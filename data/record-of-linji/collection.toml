preface_zh = '''
黃檗山頭曾遭痛棒，大愚肋下方解築拳。饒舌老婆、尿床鬼子，這風顛漢再捋虎鬚。巖谷栽松，後人標榜；钁頭斸地，幾被活埋。肯個後生，驀口自摑。辭焚机案，坐斷舌頭。不是河南，便歸河北。院臨古渡，運濟往來，把定要津，壁立萬仞。奪人奪境，陶鑄仙陀，三要三玄，鈐鎚衲子。常在家舍，不離途中。無位真人，面門出入，兩堂齊喝，賓主歷然。照用同時，本無前後，菱花對像，虛谷傳聲。妙應無方，不留朕迹。拈衣特地，南北東西，到處任真，未有師承。一一從頭勘破。
'''

intro_en = '''
The Record of Linji (Chinese: Linji Lu; Japanese: Rinzai-roku) collects the sayings of Linji Yixuan, the ninth-century Tang master from whom the Linji (Rinzai) school takes its name. Famous for the shout, the blow, and the figure of the "true person of no rank," it is one of the most celebrated of all Chan texts. Unlike the Blue Cliff Record or the Book of Serenity, it is a collection of recorded sayings, including Linji's Dharma-hall discourses and instructions, his encounter dialogues, and his pilgrimage. We have segmented it into sequential passages along the text's own editorial divisions.

The original text is public domain (from the Taishō Tripiṭaka), set in our own punctuation. The translations and pointers are released under CC0.
'''

preface_en = '''
On Mount Huangbo he took a painful beating. Only at Dayu's ribs did he learn how to land a punch. A talkative grandmother, a bed-wetting imp. This madman tugs at the tiger's whiskers again.

He plants pines in the rocky valley, a landmark for those who come after. His mattock bites into the earth, and someone is nearly buried alive. Huangbo approves of the young man and suddenly slaps his own mouth. At parting, fire for the little table. Seated, he cuts off tongues.

If he doesn't go south of the Yellow River, he goes back north of it. His monastery stands at an old crossing, ferrying people back and forth. He holds the ford, sheer as a cliff ten thousand fathoms high. He takes away the person and takes away the ground. He trains people to know what to bring when the king calls for saindhava [salt, water, a horse, or a vessel]. With his three essentials and three mysteries he puts the monks under the hammer.

Always at home, never off the road. The true person of no rank comes and goes through the gate of the face. The head monks of both halls shout together, and guest and host are plain. Seeing and acting take place at the same time, with no before or after. The mirror catches an image, and the empty valley sends back a voice. He responds freely and leaves no trace.

He takes up his robe and goes north, south, east, and west. Wherever he goes, he gives the real free rein, as though he'd never learned from a teacher. Examine it all from the beginning, one thing at a time.
'''
