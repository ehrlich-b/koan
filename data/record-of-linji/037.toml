pointer = '''
An "interview" is the formal one-on-one where a student is supposed to prove himself, and Linji is the rough examiner. Raising the whisk and spreading the bowing mat are the scripted opening moves of that ritual, test and response. Then Linji throws the whisk down, cancelling the contest mid-step, and Dajue instantly gathers up his mat and leaves, declining to make the next move in a game that is already off. The watching monks read it as favoritism, why did this one skip the usual beating, and so Linji baits him in front of the crowd: everyone says you never paid your respects. Dajue tosses back a flat "my respects" and rejoins the group, unbothered.
'''
