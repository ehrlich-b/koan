pointer = '''
Bodhidharma is the Indian monk credited with carrying Chan to China, so "what was Bodhidharma's purpose in coming from the West" became shorthand for "what is the deepest point of all this," the same giant question Zhaozhou aimed at Linji in case 38. Longya goes around lobbing it at famous teachers, and both Linji and Cuiwei get Longya to hand over what they'll whack him with, a meditation board in one case, a cushion in the other. Longya's verdict each time: strike me if you like, the patriarch had no such purpose. The needle is his last line, years later, running his own monastery: he grants that the old teachers were deeply right, and in the same breath still says the patriarch had no such purpose. That is the trap folded into his original question. It expects a purpose the teachers can hand over, and Longya keeps handing them the very things they hit him with.
'''
