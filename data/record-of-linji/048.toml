pointer = '''
Linji and Huangbo are out hoeing the fields with the rest of the monks, still in the easy sparring that fills these post-awakening scenes (the communal-labor scenes run through 47, 48, and 51). Huangbo opens with a jab, "worn out already?", Linji bats it back, and when Huangbo swings his stick Linji catches it mid-air and dumps his own teacher flat on the ground. The trouble is the rector, a monk who helps enforce the monastery's rules, who sees only "kid attacks the master" and rushes in to defend Huangbo's dignity, so Huangbo gets up and clobbers him instead. Yangshan's line puts it in the language of a chase: the actual thief strolls off and the man on his trail eats the beating.
