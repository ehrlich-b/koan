case_zh = '''
上堂，僧問：「如何是第一句？」師云：「三要印開朱點側，未容擬議主賓分。」問：「如何是第二句？」師云：「妙解豈容無著問，漚和爭負截流機。」問：「如何是第三句？」師云：「看取棚頭弄傀儡，抽牽都來裏有人。」師又云：「一句語須具三玄門，一玄門須具三要，有權、有用。汝等諸人作麼生會？」下座。

'''
case_en = '''
Linji took the high seat. A monk asked, "What is the first statement?"

Linji said, "The seal of the three essentials opens beside the vermilion mark.
Before there's time to weigh it, host and guest are distinct."

The monk asked, "What is the second statement?"

Linji said, "How could subtle understanding leave room for Wuzhuo's question?
How could skillful means fail to cut off the current?"

The monk asked, "What is the third statement?"

Linji said, "Watch the puppets dancing on the little stage.
Behind every pull of the strings there's someone inside."

Then Linji said, "Every statement must hold three mysterious gates, and every gate must hold three essentials. It has expedient means and it has a function. So how do you people get hold of that?"

He came down from the seat.
'''

