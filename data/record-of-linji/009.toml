pointer = '''
This is the densest knot in the record, and Linji built it that way on purpose. The monk keeps asking him to rank the teaching, first statement, second, third, as if awakening came in tiers you could file away. Linji answers each with a cryptic image instead of a definition (the official's seal stamping instant and undeliberated, a question from Wuzhuo, and the puppet jerking on its strings), then springs the structure: every statement holds three "mysteries," every mystery three "essentials." Wuzhuo is the monk who trades questions with Manjushri, the bodhisattva of wisdom, in Blue Cliff Record 35. The puppet image brings us back to the "true person" from case 3, with someone working the strings on the other side of the show.
'''
