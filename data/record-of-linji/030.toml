pointer = '''
Linji takes his testing on the road, to an army camp, and works over an officer instead of a monk. He points at a plain wooden pillar and forces a choice: ordinary, or holy? The question is rigged, because it assumes the world sorts into two bins, sacred over here and mundane over there, and any answer accepts the bins. The officer freezes. Then comes the punchline: Linji whacks the pillar and says even if the officer had found an answer, it would still be a wooden stump. This is the same split he puts to Puhua a few cases back (26).
'''
