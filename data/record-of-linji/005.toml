pointer = '''
The whisk is a fly-swatter a Chan master might raise in place of a spoken reply. The monks have clearly studied the choreography of the whisk and the shout, and Linji hits both of them. The heart of this one is the memory he shares: under Huangbo he asked the same question three times and got beaten three times, and the blows landed like a brush of mugwort. So when he offers his own stick, the last monk is about to take it when the stick comes down on him. The account of his training (46) tells the full story of those three beatings; here you see how completely they became his method.
'''
