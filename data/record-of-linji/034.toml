pointer = '''
The "white ox standing in the open field" recalls the Lotus Sutra, where a father coaxes his children out of a burning house with the promise of carts and gives them a fine cart drawn by a white ox. So Linji asks Xingshan to produce it. Xingshan refuses to describe the ox and just moos. Linji prods, "what, are you mute," Xingshan flips the demand back, "you try then, Elder," and Linji answers "you animal," which sounds like a slur but is him grabbing the same ox by the other end, naming the beast instead of pointing at it. Neither man will hand over a clean definition.
'''
