Linji arrives at Master Ping's place fresh from two earlier stops, and a bit of talk about his travels turns into an exam conducted in poetry. When Ping asks what Linji's old teacher Huangbo has been saying lately, a dutiful student would relay a lesson; Linji answers with a riddle about a "golden ox" that came to grief and is gone without a trace, handing over nothing you could write down (and watch the same golden ox turn up as a person's name later, in case 64). Ping keeps fishing with prettier and prettier lines, jade flutes and the golden wind of autumn, and each time Linji tops him with something larger and harder to grab, until he simply stops playing. Then Ping shifts to the polite move, "sit down, have some tea, and where were you before this?" Linji says Longguang, the teacher he visited in case 55, and walks straight out when Ping asks after him.
