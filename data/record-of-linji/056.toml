case_zh = '''
到三峯，平和尚問曰：「什麼處來？」師云：「黃蘗來。」平云：「黃蘗有何言句？」師云：「金牛昨夜遭塗炭，直至如今不見蹤。」平云：「金風吹玉管，那箇是知音？」師云：「直透萬重關，不住清霄內。」平云：「子這一問太高生。」師云：「龍生金鳳子，衝破碧琉璃。」平云：「且坐，喫茶。」又問：「近離甚處？」師云：「龍光。」平云：「龍光近日如何？」師便出去。

'''
case_en = '''
Linji came to Sanfeng. Master Ping asked, "Where have you come from?"

"From Huangbo," Linji said.

"What did Huangbo have to say?"

Linji said, "Last night the golden ox came to grief.
To this moment, not a trace of him."

Ping said, "A golden wind blows through a jade flute.
Who knows the tune?"

Linji said, "Straight through ten thousand gates,
with no resting place in the clear sky."

Ping said, "That question of yours is pitched awfully high."

Linji said, "A dragon sires a golden phoenix,
which breaks through the blue-green glass."

"Sit down," Ping said. "Have some tea." Then he asked, "And where have you just come from?"

"Longguang," Linji said.

"How are things at Longguang lately?"

Linji walked straight out.
'''

