pointer = '''
Right after laying out his theory of the shout (case 41), Linji meets someone who can throw one. His opening, "have you come for good or for ill," turns a greeting into a choice, and any answer takes the bait. The nun skips the words and shouts, flinging the challenge straight back, a clean move. Then Linji baits her again, "say it again," and when she repeats the same shout he hits her. He hit her for the second shout, not the first. The fact that she is a nun is almost the only place in the record one appears, and Linji tests her on exactly the terms he tests everyone, no softer.
'''
