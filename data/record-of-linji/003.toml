pointer = '''
This is the line Linji is remembered for. The "true person of no rank" is his name for what you already are under every job, title, and role, and "no rank" is load-bearing: it can't be classified, graded, or pinned down. Watch the move that defines the whole record: Linji doesn't argue, he grabs the man and says speak, now, and the monk falters. The crude punchline, "what a dried shit-stick," is Linji kicking the pedestal out from under his own famous phrase before anyone can start worshipping it. He spends sixty more passages knocking that same search out of people's hands.
'''
