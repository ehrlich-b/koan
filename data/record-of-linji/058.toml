pointer = '''
At Huayan's place Linji is again the traveler, and Huayan greets him with a test built out of a fake nap, slumping on his staff as if dozing off, a gesture that asks whether the visitor is sharp enough to read what's really happening. Linji needles him about the sleeping, Huayan throws back a line drawing the line between a true adept and a student of Chan, the kind of visitor who goes from monastery to monastery the way Linji has been doing across these cases. Linji's answer isn't a counter-argument, it's a role reversal: he calls for tea to be served to "the master," quietly taking the host's part and casting Huayan as the guest. Huayan seats Linji in the third place, among the senior monks.
'''
