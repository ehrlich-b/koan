pointer = '''
A short riddle that looks like a quiz with a right answer. Picture two people: one alone on a peak with no path back to the world, one planted in an intersection yet not pulled this way or that. Total withdrawal versus total engagement, which is the higher state? The catch is in the two names he forbids. Vimalakirti is the layman from the sutras whose silence got praised as the deepest teaching of all; Mahasattva Fu was a celebrated lay teacher known for wordless stunts in place of lectures. Linji rules out both of those famous poses just after asking who's ahead. He drops it and walks off with "take care," leaving the live question of where you actually are right where it sits.
'''
