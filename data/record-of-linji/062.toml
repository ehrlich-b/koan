pointer = '''
This is the short setup to the longer Fenglin encounter in case 63, and Fenglin is both the place Linji is walking toward and the name of the master who lives there, which is the whole joke in the old woman's line. "Fenglin's not in" says the master is out, even though the place is still right where it was. He won't take it: he spins her own question around, "then where are YOU headed?", and she walks on. Then he calls her back, and the instant her head turns to look he hits. The exchange lives entirely in the timing, the catching of someone in the small reflex of turning toward a voice.
'''
