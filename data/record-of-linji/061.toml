case_zh = '''
到明化，化問：「來來去去作什麼？」師云：「秖徒踏破草鞋。」化云：「畢竟作麼生？」師云：「老漢話頭也不識。」

'''
case_en = '''
Linji came to see Minghua. Minghua said, "Coming and going, coming and going. What for?"

Linji said, "Just wearing holes in straw sandals for nothing."

Minghua said, "And what does that come to?"

Linji said, "Old man, you can't even recognize what's being said."
'''

