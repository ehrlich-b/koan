pointer = '''
By now Linji has visited a string of teachers, and Minghua needles him about exactly that: all this trekking temple to temple, what's it actually for? Linji's deadpan, "just wearing holes in straw sandals for nothing," flatly refuses to gild the journey as a noble spiritual quest; it's walking, and shoes die. Minghua pushes for the real haul, what have you got to show, and Linji turns the question inside out: he tells Minghua he can't even recognize what's being said. The wandering wears out sandals and produces no trophy, and for Linji that's not the joke's failure, it's the joke.
'''
