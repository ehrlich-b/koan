case_zh = '''
到大慈，慈在方丈內坐。師問：「端居丈室時如何？」慈云：「寒松一色千年別，野老拈花萬國春。」師云：「今古永超圓智體，三山鎖斷萬重關。」慈便喝，師亦喝。慈云：「作麼？」師拂袖便出。

'''
case_en = '''
Linji came to Daci, who sat inside his abbot's room. Linji asked, "What is it like, settled here in your room?"

Daci said, "The cold pine holds one color, standing apart a thousand years.
The old farmer lifts a flower, and ten thousand lands turn to spring."

Linji said, "Perfect wisdom forever leaps clear of past and present.
Three peaks bolt shut ten thousand gates."

Daci gave a shout. Linji shouted back.

Daci said, "What was that?"

Linji shook out his sleeves and walked out.
'''

