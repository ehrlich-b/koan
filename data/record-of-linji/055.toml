pointer = '''
On his travels Linji drops in on Longguang just as the man has taken the high seat to give a talk, and instead of listening he opens with a challenge wearing the clothes of a question. The "blade" is the decisive move a teacher uses to cut a student loose, so "how do you win without showing its edge?" is Linji asking what Longguang has when the showmanship is stripped away. Longguang runs the standard repertoire in reply: he sits in silence, then fixes Linji with a stare, then barks "Hah!" Each is a recognized Chan power move. He jabs a finger and calls the match: today you lost.
