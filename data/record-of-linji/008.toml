pointer = '''
"Leaving home" was the standard phrase for becoming a monk, walking out on family and ordinary life to practice. But "home" can also mean your own true nature, and Linji is playing on what it would take to leave that. So he hands you two characters who each seem to be missing half the picture: one on the road for ages who somehow never leaves home, one who left home yet goes nowhere. Which deserves the offerings monks live on? It pairs naturally with the peak and the crossroads just before it (7), the same setup of two seeming opposites. And like that one, he steps down without answering.
'''
