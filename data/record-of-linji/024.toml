pointer = '''
Now Linji holds the seat and others come to be checked. The shout was his signature blast of sound, meant to cut through thinking, and students copied it the way you'd copy a famous coach's move. The first monk answers Linji's question with a shout, borrowing the master's own weapon; Linji gestures for him to sit, plays along, then hits him the instant he hesitates. The fly-whisk, a horsehair swatter that became a teacher's prop, runs the same trap twice: one monk bows to it, the next ignores it. There is no correct response sitting in Linji's pocket. He hits the bowing monk and the one who doesn't bow alike.
'''
