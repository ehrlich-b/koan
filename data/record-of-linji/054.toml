case_zh = '''
師到達磨塔頭，塔主云：「長老先禮佛？先禮祖？」師云：「佛、祖俱不禮。」塔主云：「佛、祖與長老是什麼冤家？」師便拂袖而出。

'''
case_en = '''
Linji came to Bodhidharma's stupa. The keeper asked, "Will the elder bow to the Buddha first, or to the patriarch first?"

Linji said, "I bow to neither."

The keeper said, "What quarrel have you got with the Buddha and the patriarch?"

Linji shook out his sleeves and walked off.
'''

