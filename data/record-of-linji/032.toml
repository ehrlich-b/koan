pointer = '''
This is the second master to teach at Deshan, the monastery famous for the stick. His line is a flawless no-win: say it and you get thirty blows, fail to say it and you get thirty blows. There is no safe square to stand on. Linji sends his student Luopu in as a scout with a counter-move ready: catch the stick and shove it back. Luopu does it, and Deshan simply walks back to his room, declining the contest. Then notice what Linji actually asks when Luopu returns. Not did the trick work, but did you see Deshan, did you take in who you were standing in front of or only run the play you were handed. The moment Luopu stops to assemble an answer the stick lands on him too, at home this time.
'''
