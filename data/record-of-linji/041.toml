case_zh = '''
師問僧：「有時一喝如金剛王寶劍，有時一喝如踞地金毛師子，有時一喝如探竿影草，有時一喝不作一喝用，汝作麼生會？」僧擬議，師便喝。

'''
case_en = '''
Linji asked a monk: "Sometimes a shout is the jeweled sword of the Vajra King. Sometimes it's a golden-maned lion crouching on the ground. Sometimes it's a probing pole and concealing grass. And sometimes a shout isn't used as a shout. How do you understand that?"

The monk hesitated, and Linji shouted.
'''

