pointer = '''
Linji is famous above all for one thing, yelling, and here he sets out his own theory of it. The shout was never a tantrum, it was a tool, and he claims it comes in kinds. The "jeweled sword of the Vajra King" cuts through confusion in a stroke. The "crouching lion" is raw force that pins you where you stand. The "probing pole and concealing grass" suggest reconnaissance, a poke to flush out what is hiding. The same pair turns up in Book of Serenity 14. And the fourth "isn't used as a shout," it is doing something else entirely. Then he asks the monk to tell them apart, the monk hesitates, and gets a live shout. The instant the four shouts become a menu to memorize, you are standing exactly where the monk stood. This is the formal statement of the move you have watched land on people for twenty cases.
'''
