number = 75
slug = ""
title_zh = "瑞巖常理"
title_en = "Ruiyan Asks About the Eternal"

intro_zh = '''
喚作如如，早是變也。智不到處，切忌道著。這裏還有參究分也無？

'''
intro_en = '''
Call it "thusness" and already it has shifted. Where knowing can't reach, whatever you do, don't put it into words. Is there room here to dig in and work it through?
'''

case_zh = '''
瑞巖問巖頭：「如何是本常理？」頭云：「動也。」巖云：「動時如何？」頭云：「不見本常理。」巖佇思。頭云：「肯即未脫根塵，不肯即永沈生死。」

'''
case_en = '''
Ruiyan asked Yantou, "What is the original, constant truth?"

Yantou said, "It moves."

Ruiyan said, "And when it moves?"

Yantou said, "You don't see the original, constant truth."

Ruiyan stood there, turning it over.

Yantou said, "Agree, and you're still caught in the senses and their objects. Refuse, and you drown forever in birth and death."
'''

verse_zh = '''
圓珠不穴，
大璞不琢。
道人所貴無稜角，
拈却肯路根塵空，
脫體無依活卓卓。

'''
verse_en = '''
A round pearl has no hole.
A fine piece of raw jade goes uncarved.
What a person of the Way prizes: no edges or corners.
Take away the way of assent and senses and their objects empty out.
Free through and through, leaning on nothing, alive and standing clear.
'''

pointer = '''
Yantou Quanhuo and his student Ruiyan are sparring, and Ruiyan wants the one fixed eternal truth behind everything handed over, the bedrock that never shifts. Yantou will not hold still for it: "It moves." The whole trap lives in the idea of an eternal truth. Ruiyan is hunting something solid to stand on, and Yantou keeps pulling the floor out from under each grab. The last line is the killer. Agree, nod along, and you have turned the answer into one more object to clutch, snagged again in the senses and their objects, including the mind and its thoughts; refuse, dig in and argue, and you sink back into the endless churn of birth and death. Both doors are wired. Ruiyan stands there turning it over, and Hongzhi gives him a pearl with no hole to thread.
'''
