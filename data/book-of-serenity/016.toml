number = 16
slug = ""
title_zh = "麻谷振錫"
title_en = "Magu Shakes His Staff"

intro_zh = '''
指鹿為馬，握土成金。舌上起風雷，眉間藏血刃。坐觀成敗，立驗死生。且道：是何三昧？

'''
intro_en = '''
Point at a deer and call it a horse. Squeeze a fistful of earth into gold. Wind and thunder rise on the tongue, and a bloody blade hides between the brows. Sit and watch who wins and loses. Stand and test who lives and dies. Tell me, what samadhi is this?
'''

case_zh = '''
麻谷持錫到章敬，遶禪床三匝，振錫一下，卓然而立。敬云：「是，是。」谷又到南泉，遶禪床三匝，振錫一下，卓然而立。泉云：「不是，不是。」谷云：「章敬道是，和尚為什麼道不是？」泉云：「章敬即是，是汝不是。此是風力所轉，終成敗壞。」

'''
case_en = '''
Magu came to Zhangjing carrying his ringed staff. He walked around the meditation seat three times, gave his staff a single shake, and stood there straight as a post.
Zhangjing said, "Right, right."
Then Magu went to Nanquan. He walked around the meditation seat three times, gave his staff a single shake, and stood there straight as a post.
Nanquan said, "Wrong, wrong."
Magu said, "Zhangjing called it right. Why do you call it wrong?"
Nanquan said, "Zhangjing is right. You're the one who's wrong. The wind is blowing this around, and in the end it all falls apart."
'''

verse_zh = '''
是與不是，
好看棬䙡。
似抑似揚，
難兄難弟。
縱也彼既臨時，
奪也我何特地。
金錫一振太孤標，
繩床三遶閑游戲。
叢林擾擾是非生，
想像髑髏前見鬼。

'''
verse_en = '''
Right and wrong.
Just look at the tangle.
It looks like a put-down, it looks like praise.
Two brothers, neither the lesser.
If he lets it go, he merely meets the moment.
If I take it away, what's so special in that?
One shake of the metal-ringed staff, aloof and alone.
Three laps of the rope seat, idle play.
The monastery bustles, and right and wrong are born.
Picture someone seeing a ghost in front of a skull.
'''

pointer = '''
Magu, Zhangjing, and Nanquan are all Tang masters. A monk's ringed staff carried metal rings that jingled when shaken, a way of announcing yourself. Magu pulls the same wordless stunt on two teachers in turn: circle the seat three times, shake the staff, plant your feet. One says "right," the other says "wrong." Magu tries to pin down why the two verdicts differ. Nanquan jabs back that Zhangjing is right and Magu is wrong, then brings in the wind that blows things around. The Blue Cliff Record (case 31) adds Xuedou's "Wrong!" after each verdict. Seeing ghosts in front of a skull is the punchline, with the monastery in an uproar over right and wrong.
'''
