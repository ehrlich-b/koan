number = 97
slug = ""
title_zh = "光帝檏頭"
title_en = "Emperor Zhuangzong's Hat"

intro_zh = '''
達磨朝梁武，本為傳心；鹽官識大中，不妨具眼。天下太平，國王長壽，不犯天威，日月停景，四時和適，有光風化。人王法王相見，合談何事？

'''
intro_en = '''
Bodhidharma came before Emperor Wu of Liang to transmit the mind. Yanguan recognized the future Emperor Xuanzong. He had an eye for such things. The realm is at peace and the king lives long. No one offends heaven's majesty. Sun and moon hold their light, the four seasons run smooth, and the ruler's influence shines. When a king of this world and a king of the Dharma meet, what should they talk about?
'''

case_zh = '''
同光帝謂興化曰：「寡人收得中原一寶，只是無人酬價。」化云：「借陛下寶看。」帝以兩手引幞頭脚。化云：「君王之寶，誰敢酬價？」

'''
case_en = '''
The emperor of the Tongguang era said to Xinghua, "I've come into a treasure out of the Central Plains. Trouble is, nobody will meet its price."

Xinghua said, "May I see Your Majesty's treasure?"

The emperor reached up with both hands and tugged the dangling ends of his court cap.

Xinghua said, "A king's treasure. Who would dare price it?"
'''

verse_zh = '''
君王底意語知音，
天下傾誠葵藿心。
掇出中原無價寶，
不同趙璧與燕金。
中原之寶呈興化，
一段光明難定價。
帝業堪為萬世師，
金輪景耀四天下。

'''
verse_en = '''
The king tells his meaning to someone who knows the tune.
The whole realm leans in, hearts turned to him as mallows to the sun.
He brings out the priceless treasure of the Central Plains.
It's different from the jade of Zhao or the gold of Yan.
The treasure of the Central Plains, held up for Xinghua,
one flash of brightness no one can price.
The emperor's work can teach ten thousand generations.
the golden wheel ablaze over all four quarters of the world.
'''

pointer = '''
Tongguang was the reign era of Emperor Zhuangzong of the Later Tang in the 920s, and Xinghua was a noted Chan teacher in Linji's line. The emperor opens with a riddle that is half boast and half probe: I have a treasure out of the Central Plains that no one can put a price on. Xinghua plays along and asks to appraise it, and the emperor reaches up and tugs the dangling ends of his court cap, a futou. Xinghua asks who would dare name a price for a king's treasure. It rhymes with Yunmen's "one treasure hidden in the mountain of form" a few cases back (92).
'''
