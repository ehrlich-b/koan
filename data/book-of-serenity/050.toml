title_zh = "雪峯甚麼"
title_en = "Xuefeng's \"What Is It?\""

intro_zh = '''
末後一句，始到牢關。巖頭自負，上不肯於親師，下不讓於法弟。為復是強生節目？為復別有機關？

'''
intro_en = '''
The last word brings you at last to the locked gate. Yantou had nerve. He wouldn't give his own teacher a nod of approval, and he wouldn't yield an inch to his younger Dharma brother. Was he just manufacturing trouble where there was none? Or did he have some other trick up his sleeve?
'''

case_zh = '''
雪峯住庵時，有兩僧來禮拜。峯見來，以手托庵門，放身出云：「是甚麼？」僧亦云：「是甚麼？」峯低頭歸庵。僧後到巖頭，頭問：「甚麼處來？」僧云：「嶺南。」頭云：「曾到雪峯麼？」僧云：「曾到。」頭云：「有何言句？」僧舉前話。頭云：「他道甚麼？」僧云：「他無語，低頭歸庵。」頭云：「噫！當時不向他道末後句，若向伊道，天下人不奈雪老何。」僧至夏末，再舉前話請益。頭云：「何不早問？」僧云：「未敢容易。」頭云：「雪峯雖與我同條生，不與我同條死。要知末後句，只這是。」

'''
case_en = '''
When Xuefeng was living in his hermitage, two monks came to pay their respects. When he saw them, he braced his hand against the door and lunged out. "What is it?"

One of the monks said, "What is it?"

Xuefeng dropped his head and went back inside.

Later the monk came to Yantou. Yantou asked, "Where have you come from?"

"Lingnan."

"Have you been to Xuefeng's?"

"I have."

"What did he have to say?"

The monk told him what had happened.

Yantou said, "What did he say?"

"Nothing. He dropped his head and went back inside."

Yantou said, "Ah! I didn't tell him the last word back then. If I had, no one on earth could touch old Xuefeng."

At the end of the summer the monk brought up the exchange again and asked for more.

Yantou said, "Why didn't you ask sooner?"

"I didn't dare take it lightly."

Yantou said, "Xuefeng and I were born on the same branch, but we won't die on the same branch. Want to know the last word? Just this is it."
'''

verse_zh = '''
切瑳琢磨，
變態殽訛。
葛陂化龍之杖，
陶家居蟄之梭。
同條生兮有數，
同條死兮無多。
末後句，只這是，
風舟載月浮秋水。

'''
verse_en = '''
Cutting, filing, carving, polishing.
Shapes change and errors creep in.
The staff that turned into a dragon at Gepi Pond.
The shuttle that lay dormant in the Tao household.
Born on the same branch: there are some.
Die on the same branch: there aren't many.
The last word? Just this is it.
A wind-driven boat carries the moon over autumn water.
'''

pointer = '''
Xuefeng and Yantou were old friends who trained under Deshan, and Yantou is the sharper of the two, needling his buddy from across the country. Xuefeng bursts out of his hut at two visiting monks barking "What is it?", a classic ambush meant to catch you flat with no time to think. One monk simply fires the same question back, a respectable move, and Xuefeng oddly lowers his head and retreats inside. Hearing the report, Yantou says he wishes he'd taught Xuefeng "the last word," the final finishing thing nobody can cap. Watch how everyone keeps treating this last word as a withheld password, the monk hesitating to ask until the end of summer, when Yantou asks why he didn't speak up sooner and calls the last word "just this." The last word comes up again in case 55, where Yantou says old Deshan lacks it, then has something else to say the next day. Yantou's line about two men "born on the same branch but not dying on the same branch" starts from the fact that they trained with the same teacher.
'''
