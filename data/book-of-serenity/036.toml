number = 36
slug = ""
title_zh = "馬師不安"
title_en = "Mazu's Sun-Face, Moon-Face"

intro_zh = '''
離心意識參，有這箇在；出凡聖路學，已太高生。紅爐迸出鐵蒺䔧，舌劍脣槍難下口。不犯鋒鋩，試請舉看。

'''
intro_en = '''
Investigate apart from mind, thought, and consciousness, and there's still this thing. Study beyond the road of ordinary and holy, and you've gone too high already. A red-hot furnace spits out iron caltrops. Tongues are swords, lips are spears: it's hard to get a word in. See if you can take up the case without touching the edge.
'''

case_zh = '''
馬大師不安，院主問：「和尚近日尊位如何？」大師云：「日面佛，月面佛。」

'''
case_en = '''
Master Mazu was ill. The monastery director asked, "How are you feeling these days, Master?"
Mazu said, "Sun-face Buddha. Moon-face Buddha."
'''

verse_zh = '''
日面月面，
星流電卷。
鏡對像而無私，
珠在盤而自轉。
君不見：鉆鎚前百鍊之金，
刀尺下一機之絹。

'''
verse_en = '''
Sun-face, moon-face.
Stars streak, lightning rolls.
A mirror meets each shape and plays no favorites,
the pearl in the dish rolls on its own.
Don't you see the gold refined a hundred times under anvil and hammer?
One loom's worth of silk under knife and measure.
'''

pointer = '''
Mazu is one of the giants of Tang Chan, a teacher who minted dozens of masters; here he is sick, and the monastery director does the decent thing and asks how he's feeling. Mazu answers with two names from Buddhist lore: the Sun-face Buddha, said to live eighteen hundred years, and the Moon-face Buddha, who lives a single day and a night. The trap is folded into the polite question, in its quiet assumption that a long life is the good answer and a short one the bad. The verse gives us a mirror that takes whatever stands in front of it and prefers no face to any other. The same Mazu turns up again at case 6, and the Blue Cliff Record (case 3) gives this same reply.
'''
