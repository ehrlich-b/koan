number = 86
slug = ""
title_zh = "臨濟大悟"
title_en = "Linji's Great Awakening"

intro_zh = '''
銅頭鐵額，天眼龍睛，雕觜魚顋，熊心豹膽。金剛劍下，是計不納，一籌不獲。為甚麼如此？

'''
intro_en = '''
A head of bronze, a forehead of iron. A heavenly eye, a dragon's pupil. An eagle's beak, a fish's gills. A bear's heart, a leopard's nerve. And still, under the diamond sword, not one scheme gets through, not one trick lands. Why is that?
'''

case_zh = '''
臨濟問黃蘗：「如何是佛法的的大意？」蘗便打。如是三度，乃辭蘗，見大愚。愚問：「甚麼處來？」濟云：「黃蘗來。」愚云：「黃蘗有何言句？」濟云：「某甲三問佛法的的大意，三度喫棒，不知有過無過。」愚云：「黃蘗恁麼，老婆為爾得徹困，更來問有過無過！」濟於言下大悟。

'''
case_en = '''
Linji asked Huangbo, "What is the real point of the Buddha's teaching?"

Huangbo hit him. Three times this happened.

So Linji took his leave and went to see Dayu.

Dayu asked, "Where have you come from?"

"From Huangbo."

"What did Huangbo have to say?"

"Three times I asked the real point of the Buddha's teaching, and three times I got the stick. I can't tell whether I was at fault."

Dayu said, "Huangbo wore himself out for you like a doting grandmother, and here you are asking whether you were at fault!"

At those words, Linji had a great awakening.
'''

verse_zh = '''
九包之鶵，
千里之駒。
真風度籥，
靈機發樞。
劈面來時飛電急，
迷雲破處太陽孤。
捋虎鬚，
見也無？
箇是雄雄大丈夫。

'''
verse_en = '''
A phoenix chick with all nine marks.
A colt that can go a thousand li.
The true wind passes through the pipe.
The living mechanism springs from its pivot.
Straight at your face it comes, quick as lightning,
where the clouds of delusion tear, the sun stands alone.
He pulls the tiger's whiskers.
Do you see?
Here is a person with real nerve.
'''

pointer = '''
Linji (died 866) went on to found the most aggressive school of Chan in China, the one that runs on the shout and the blow; this is the story of how he got there. As a young monk he asks his teacher Huangbo an earnest question, what is the actual point of the Buddha's teaching, and gets beaten for it three times with no word of explanation. Crushed, he goes to Dayu to find out whether he was at fault, and Dayu turns it over: Huangbo wasn't cruel, he was kind to the point of wearing himself out like a grandmother, and Linji is too busy with self-pity to see it. Hearing that, something breaks open. The verse cheers the prize colt who finally bolts free, and its tiger's whiskers turn up when Linji returns and slaps Huangbo in case 46 of the Record of Linji. The man minted here is the same one we meet making a stroke with his staff in case 95.
'''
