number = 59
slug = ""
title_zh = "青林死蛇"
title_en = "Qinglin's Dead Snake"

intro_zh = '''
去即留住，住即遣去。不去不住，渠無國土。何處逢渠？在在處處。且道：是甚麼物，得恁麼奇特？

'''
intro_en = '''
Leave, and it holds you back. Stay, and it drives you off. Neither leave nor stay, and it has no country to live in. So where do you meet it? Everywhere, always. Now tell me: what is this thing, that it can be so strange?
'''

case_zh = '''
僧問青林：「學人徑往時如何？」林云：「死蛇當大路，勸子莫當頭。」僧云：「當頭時如何？」林云：「喪子命根。」僧云：「不當頭時如何？」林云：「亦無迴避處。」僧云：「正恁麼時如何？」林云：「却失也。」僧云：「未審向甚麼處去也？」林云：「草深無覓處。」僧云：「和尚也須隄防始得。」林拊掌云：「一等是箇毒氣。」

'''
case_en = '''
A monk asked Qinglin, "What if I go straight ahead?"
Qinglin said, "There's a dead snake across the main road. Better not meet it head-on."
The monk said, "And if I meet it head-on?"
Qinglin said, "It'll take your life."
The monk said, "And if I don't?"
Qinglin said, "Then there's nowhere left to dodge it."
The monk said, "And right at that moment?"
Qinglin said, "You've already lost it."
The monk said, "Where did it go?"
Qinglin said, "The grass is deep. There's nowhere to look."
The monk said, "Then you'd better watch yourself too, Master."
Qinglin clapped his hands and said, "Same poison, all of it."
'''

verse_zh = '''
三老暗轉柁，
孤舟夜迴頭。
蘆花兩岸雪，
煙水一江秋。
風力扶帆行不棹，
笛聲喚月下滄洲。

'''
verse_en = '''
The boatman unseen turns the rudder.
The lone boat turns in the night.
Reed flowers, snow on both banks,
mist on the water, one river of autumn.
The wind fills the sail and the boat goes without oars.
A flute call draws the moon down to the blue-green sandbar.
'''

pointer = '''
This one is a fencing match start to finish. A monk asks the teacher Qinglin, in effect, can't I just barrel straight ahead and go for enlightenment head-on? Qinglin answers with a dead snake lying across the road, a trap that looks harmless. Meet it head-on and it kills you; refuse to meet it and there's still no way around; ask what happens right then and you've already lost it. Every door the monk tries, Qinglin slams. When he finally turns it back on the teacher, "you'd better watch yourself," Qinglin claps his hands and calls it the same poison.
'''
