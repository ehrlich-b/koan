number = 85
slug = ""
title_zh = "國師塔樣"
title_en = "The Seamless Stupa"

intro_zh = '''
有打破虛空底鉆鎚，擘開華嶽底手段，始到元無縫罅處、不見瑕痕處。且誰是恁麼人？

'''
intro_en = '''
It takes a hammer and anvil that can break open empty space and hands that can split Mount Hua. Only then do you reach the place that never had a seam or crack, where no flaw or scar shows. Who can do that?
'''

case_zh = '''
肅宗帝問忠國師：「百年後所須何物？」國師云：「與老僧作箇無縫塔。」帝曰：「請師塔樣。」國師良久，云：「會麼？」帝云：「不會。」國師云：「吾有付法弟子耽源，却諳此事。」後帝詔耽源，問：「此意如何？」源云：「相之南，譚之北，中有黃金充一國。無影樹下合同舡，瑠璃殿上無知識。」

'''
case_en = '''
Emperor Suzong asked National Teacher Zhong, "What will you need when your hundred years are up?"

The National Teacher said, "Build this old monk a seamless stupa."

The emperor said, "May I see your design, Master?"

The National Teacher sat silent for a long time, then said, "Got it?"

The emperor said, "I don't."

The National Teacher said, "My Dharma heir Danyuan knows this matter."

Later the emperor summoned Danyuan and asked what it meant. Danyuan said:

South of Xiang and north of Tan,
with gold enough between them to fill a whole country.
Beneath the shadowless tree, they share a boat.
In the crystal hall, no familiar face.
'''

verse_zh = '''
孤迴迴，
圓陀陀。
眼力盡處高峩峩，
月落潭空夜色重，
雲收山瘦秋容多。
八卦位正，
五行氣和。
身先在裏見來麼？
南陽父子兮却似知有，
西竺佛祖兮無如奈何。

'''
verse_en = '''
Solitary, all by itself.
Round, all the way around.
Past the reach of sight, still rising high.
The moon sinks, the pool is empty, the night thickens.
The clouds draw back, the mountains thin, autumn fills the air.
The eight trigrams in their proper places,
the five phases in harmony.
You were inside it before. Do you see it?
Father and son at Nanyang seem to know what's what.
The buddhas and ancestors of India can do nothing with it.
'''

pointer = '''
This is a deathbed riddle. National Teacher Zhong, Nanyang Huizhong, was the most honored Chan master of his time and tutor to two emperors. Asked what he will want after death, he requests a "seamless stupa," a burial monument with no crack in it. The emperor's blunder is to ask for blueprints, as if the seamless could be drawn to scale. The Teacher goes silent, then he hands the matter to his heir Danyuan, who answers with strange pictures, a tree that throws no shadow, a crystal hall without a familiar face. "Father and son" means the Teacher and his heir; even India's founders, the verse notes, had no diagram for it either.
'''
