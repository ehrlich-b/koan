number = 63
slug = ""
title_zh = "趙州問死"
title_en = "Zhaozhou Asks About Dying"

intro_zh = '''
三聖、雪峯，春蘭秋菊；趙州、投子，卞璧燕金。無星秤上兩頭平，沒底舡中一處渡。二人相見時如何？

'''
intro_en = '''
Sansheng and Xuefeng: spring orchids and autumn chrysanthemums. Zhaozhou and Touzi: the jade of Bian He and the gold of Yan. A scale with no markings, and still both pans hang even. A bottomless boat, and they cross together in it. What happens when two such people meet?
'''

case_zh = '''
趙州問投子：「大死底人却活時如何？」子云：「不許夜行，投明須到。」

'''
case_en = '''
Zhaozhou asked Touzi, "A man has died the Great Death and come back to life. What then?"

Touzi said, "No traveling by night. Be there at daybreak."
'''

verse_zh = '''
芥城劫石妙窮初，
活眼環中照廓虛。
不許夜行投曉到，
家音未肯付鴻魚。

'''
verse_en = '''
A city full of mustard seeds, a stone worn down through an eon: probing the mystery to its beginning.
The living eye, dead center, lights up the vast emptiness.
No traveling by night. Arrive at daybreak.
Word from home, not yet trusted to wild goose or fish.
'''

pointer = '''
Zhaozhou, one of the great Chan masters, is quizzing the teacher Touzi with a test question. The "Great Death" isn't literal dying; it's Chan slang for the total collapse of your old self, ego and every certainty wiped clean. The catch is what comes next, because a real practitioner doesn't stay parked in that blank emptied-out state. So Zhaozhou asks, in effect, once you've died to everything, then what? Touzi answers with a folksy proverb, no traveling by night, be there at daybreak. The Blue Cliff Record tells the same exchange in case 41. The verse's "mustard-seed city" and "kalpa-grinding stone" are old images for a nearly endless stretch of time, and the "wild goose and fish" were traditional letter-carriers.
'''
