number = 21
slug = ""
title_zh = "雲巖掃地"
title_en = "Yunyan Sweeps the Ground"

intro_zh = '''
脫迷悟，絕聖凡，雖無多事。立主賓，分貴賤，別是一家。量材授職，即不無；同氣連枝作麼生會？

'''
intro_en = '''
Get free of delusion and awakening, cut off holy and ordinary, and there's little to fuss over. Set up host and guest, distinguish high and low, and that's another household altogether. There is such a thing as fitting people to their jobs. But how do you understand branches sharing one life?
'''

case_zh = '''
雲巖掃地次，道吾云：「太區區生。」巖云：「須知有不區區者。」吾云：「恁麼則有第二月也。」巖提起掃箒云：「這箇是第幾月？」吾便休去。玄沙云：「正是第二月。」雲門云：「奴見婢殷勤。」

'''
case_en = '''
Yunyan was sweeping the ground. Daowu said, "You look awfully busy."

Yunyan said, "You should know there's someone who isn't busy."

Daowu said, "Then there's a second moon."

Yunyan held up his broom. "Which moon is this?"

Daowu let it drop.

Xuansha said, "That's exactly the second moon."

Yunmen said, "A servant sees a maid and grows attentive."
'''

verse_zh = '''
借來聊爾了門頭，
得用隨宜即便休。
象骨巖前弄蛇手，
兒時做處老知羞。

'''
verse_en = '''
Borrow it for now to take care of the front gate.
Use it as needed, then leave it be.
At Elephant Bone Crag, the snake handler plies his trade.
What he did as a boy, the old man blushes to recall.
'''

pointer = '''
Yunyan and Daowu were dharma brothers, students of the same teacher, fond of testing each other. The trap is "the second moon." In old Buddhist usage, press on your eyeball and you see two moons, the real one and a phantom double, and the phantom stands for anything secondary or derivative, not the genuine article. So when Yunyan says "someone isn't busy," Daowu pounces: aren't you conjuring a fake second moon by splitting yourself in two? Yunyan's comeback, holding up the broom and asking "which moon is this?", makes Daowu drop the exchange. The later one-liners from Xuansha and Yunmen are rival scorecards, Xuansha saying "That's exactly the second moon" and Yunmen bringing in a servant who perks up when he sees a maid.
'''
