number = 23
slug = ""
title_zh = "魯祖面壁"
title_en = "Luzu Faces the Wall"

intro_zh = '''
達磨九年，呼為壁觀；神光三拜，漏泄天機。如何得掃蹤滅跡去？

'''
intro_en = '''
Bodhidharma sat for nine years. They called it "wall gazing." Shenguang bowed three times and gave the whole game away. How do you sweep away your tracks and leave no trace?
'''

case_zh = '''
魯祖凡見僧來便面壁。南泉聞云：「我尋常向他道，空劫以前承當，佛未出世時會取，尚不得一箇半箇。他恁麼，驢年去。」

'''
case_en = '''
Whenever Luzu saw a monk coming, he'd turn to face the wall. Nanquan heard of it and said, "I keep telling them, 'Take it up before the empty eon. Understand it before a Buddha has appeared in the world.' And I still don't get one person, or even half of one. At this rate he'll be at it till the year of the donkey."
'''

verse_zh = '''
淡中有味，
妙超情謂。
綿綿若存兮象先，
兀兀如愚兮道貴。
玉雕文以喪淳，
珠在淵而自媚。
十分爽氣兮清磨暑秋，
一片閑雲兮遠分天水。

'''
verse_en = '''
There's flavor in the plain.
Its subtlety goes beyond what you can think or say.
On and on, as if it were there, before any form.
Stock still, as if a fool, yet precious to the Way.
Carve patterns in jade and it loses its natural plainness.
The pearl rests in the deep, lovely on its own.
Bracing air, autumn scouring away the summer heat.
A single drift of idle cloud, far off, parting sky from water.
'''

pointer = '''
Bodhidharma is the Indian monk who supposedly brought Chan to China and then sat facing a wall for nine years, so "wall-gazing" became shorthand for hardcore meditation. His student Huike, called Shenguang in the introduction, bows three times, which the intro teases as giving the game away. Luzu, a dharma-heir of Mazu, takes Bodhidharma one further: a monk shows up with a question and Luzu just turns to the wall, no words at all. Nanquan, his dharma-brother, is unimpressed. He says he tells monks to go back before the empty eon, the stretch between worlds, or before any Buddha appeared, and he still gets nobody, not half a person. "The year of the donkey" is the joke, since there is no donkey in the Chinese zodiac, so it means never. The live question is whether Luzu's silent wall is the purest possible answer or a gimmick he could ride forever, and Nanquan leaves it hanging.
'''
