number = 64
slug = ""
title_zh = "子昭承嗣"
title_en = "Zizhao's Lineage"

intro_zh = '''
韶陽親見睦州，拈香於雪老；投子面承圓鑒，嗣法於大陽。珊瑚枝上玉花開，薝蔔林中金果熟。且道：如何造化來？

'''
intro_en = '''
Shaoyang met Muzhou face to face, yet burned his incense for old Xuefeng. Touzi had his approval straight from Yuanjian, yet his Dharma came down from Dayang. On the coral branch, jade flowers open. In the gardenia grove, golden fruit ripens. So tell me: how does it all come to be?
'''

case_zh = '''
子昭首座問法眼：「和尚開堂，承嗣何人？」眼云：「地藏。」昭云：「太辜負長慶先師。」眼云：「某甲不會長慶一轉語。」昭云：「何不問？」眼云：「『萬象之中獨露身』，意作麼生？」昭乃竪起拂子。眼云：「此是長慶處學得底，首座分上作麼生？」昭無語。眼云：「只如『萬象之中獨露身』，是撥萬象？不撥萬象？」昭云：「不撥。」眼云：「兩箇。」參隨左右皆云：「撥萬象。」眼云：「萬象之中獨露身聻！」

'''
case_en = '''
Zizhao, the head monk, asked Fayan, "When you opened your hall, whose lineage did you inherit?"

Fayan said, "Dizang's."

Zizhao said, "You've let our old teacher Changqing down badly."

Fayan said, "There's a turning word of Changqing's I can't make out."

Zizhao said, "Why not ask me?"

Fayan said, "'Amid all things, the body alone stands revealed.' What does that mean?"

Zizhao held up his whisk.

Fayan said, "That's what you learned from Changqing. What about you?"

Zizhao said nothing.

Fayan said, "Take that phrase, 'Amid all things, the body alone stands revealed.' Does it sweep all things away or not?"

Zizhao said, "It doesn't sweep them away."

Fayan said, "That's two."

The monks at either side all said, "It sweeps all things away."

Fayan said, "'Amid all things, the body alone stands revealed.' Well?"
'''

verse_zh = '''
離念見佛，
破塵出經。
現成家法，
誰立門庭？
月逐舟行江練淨，
春隨草上燒痕青。
撥不撥，
聽叮嚀。
三徑就荒歸便得，
舊時松菊尚芳馨。

'''
verse_en = '''
Drop every thought, and there's the Buddha.
Crack open a speck of dust and out comes a sutra.
The family rule is right here, ready-made.
Who's setting up a gate and courtyard?
The moon rides with the boat, the river a strip of clean silk.
Spring comes with the grass, green over the burn scar.
Sweep, don't sweep,
listen close to what's being said.
The three paths have gone to weeds, but you can still go home,
where the old pines and chrysanthemums are fragrant as ever.
'''

pointer = '''
This is an inside-baseball fight about lineage. In Chan, who your teacher was is your entire pedigree, and Fayan, the great Five Dynasties master, openly says he's the heir of Dizang, not of Changqing, the teacher he and Zizhao had both studied with. Zizhao is scandalized, you let our old master down, so Fayan baits him with one of Changqing's signature lines, "amid all things, the body alone stands revealed." Then comes the trap. Does that line wipe out the world of "all things," or leave it standing? Zizhao picks "leave it," the attendants pick "wipe it out," and Fayan just throws the line back at the whole room.
'''
