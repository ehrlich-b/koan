number = 45
slug = ""
title_zh = "覺經四節"
title_en = "The Four Lines of the Sutra of Perfect Enlightenment"

intro_zh = '''
現成公案，只據現今；本分家風，不圖分外。若也強生節目，枉費工夫，盡是與混沌畫眉、鉢盂安柄。如何得平穩去？

'''
intro_en = '''
The case is already here, whole, right in front of you. Go by what's present now. Keep to the family's usual ways and seek nothing beyond them. Start manufacturing fancy steps and you've thrown your effort away, painting eyebrows on Chaos or sticking a handle on a begging bowl. How will you get anywhere steady that way?
'''

case_zh = '''
圓覺經云：「居一切時不起妄念，於諸妄心亦不息滅；住妄想境不加了知，於無了知不辨真實。」

'''
case_en = '''
The Sutra of Perfect Enlightenment says, "At all times, don't kick up deluded thoughts, but don't stamp out the deluded mind either. Amid the things that deluded thoughts conjure, add no judgments. Where there is no judging, do not try to distinguish what's real."
'''

verse_zh = '''
巍巍堂堂，
磊磊落落。
鬧處刺頭，
穩處下脚。
脚下線斷我自由，
鼻端泥盡君休斵。
莫動著，
千年故紙中合藥。

'''
verse_en = '''
Towering and upright.
Open and unencumbered.
In the clamor, he plunges in headfirst.
On firm ground, he sets his foot down.
The cord below my feet is cut and I go free.
The speck of mud is off your nose, so drop the axe.
Don't lay a finger on it.
Mix the medicine in thousand-year-old papers.
'''

pointer = '''
The case quotes four lines from a scripture, the Sutra of Perfect Enlightenment, and they read like a tightrope walk in slow motion: don't kick up wandering thoughts, but don't stamp them out either; don't pile analysis onto what's in front of you, but when you aren't judging, don't try to decide what's real. Every correction you'd reach for turns out to be one motion too many, and there sits the whole difficulty. The nose and the axe in the verse come from the Zhuangzi, where a craftsman could shave a fleck of plaster off a man's nose and leave no scratch while the man stood without flinching. By the time Hongzhi brings in the axe, the speck is already gone.
'''
