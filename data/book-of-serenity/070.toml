number = 70
slug = ""
title_zh = "進山問性"
title_en = "Jin Asks About Nature"

intro_zh = '''
聞香象渡河底，已隨流去；知生不生性底，為生之所留。更論定前定後、作笋作篾，劍去久矣，爾方刻舟。蹋轉機輪，作麼生別行一路？試請舉看。

'''
intro_en = '''
Hear about the elephant crossing the river, and you've already been swept away with the current. Know how birth itself is unborn, and birth still holds you back. Go on debating before and after absorption, making shoots and making strips, but the sword fell in the water long ago, and only now do you notch the boat. Turn the wheel of the teaching. How do you take a different road? Let's look.
'''

case_zh = '''
進山主問脩山主云：「明知生不生性，為甚麼為生之所留？」脩云：「筍畢竟成竹去，如今作篾使還得麼？」進云：「汝向後自悟去在。」脩云：「某甲只如此，上座意旨如何？」進云：「這箇是監院房，那箇是典座房。」脩便禮拜。

'''
case_en = '''
Jin, the head of a mountain temple, asked his fellow temple head Xiu, "If you see clearly that birth is unborn by nature, why does birth still hold you back?"

Xiu said, "A shoot will become bamboo in the end. But can you split it into strips to use right now?"

Jin said, "Later you'll wake up to it yourself."

Xiu said, "That's how it is for me. How do you see it?"

Jin said, "This is the manager's room. That's the cook's room."

Xiu bowed.
'''

verse_zh = '''
豁落亡依，
高閑不羈。
家邦平怗到人稀，
些些力量分階級，
蕩蕩身心絕是非。
是非絕，
介立大方無軌轍。

'''
verse_en = '''
Wide open, nothing to lean on.
high and idle, off the leash.
The country is at peace, and few reach it.
Small differences in strength make for ranks and grades.
body and mind swept clear, right and wrong gone.
Right and wrong gone,
stand alone in the open, no ruts, no tracks.
'''

pointer = '''
Two heads of mountain temples are talking shop about the deepest teaching in the school: that things are "unborn," arising and passing without acquiring a fixed nature of their own. Abbot Jin's question is the honest one every practitioner hits. If I genuinely understand that, why am I still stuck in the ordinary churn of living and dying? Xiu answers with bamboo: a shoot becomes bamboo eventually, but you cannot split strips from it today. They feint at each other over who actually sees it, and then Jin quits philosophizing and just points, this is the manager's room, that is the cook's room. Xiu bows.
'''
