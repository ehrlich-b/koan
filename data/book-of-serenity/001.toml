slug = ""
title_zh = "世尊陞座"
title_en = "The Buddha Takes the Seat"

intro_zh = '''
閉門打睡，接上上機；顧鑑頻申，曲為中下。那堪上曲䚄木，弄鬼眼睛。有箇傍不肯底，出來，也怪伊不得。

'''
intro_en = '''
Shut the door and doze off: that's how you meet the sharpest students. Keep looking around and giving signals to accommodate the middling and the slow. But why go so far as to climb onto the wooden teaching chair and make faces? If someone off to the side won't buy it and steps forward, you can hardly blame them.
'''

case_zh = '''
世尊一日陞座。文殊白槌云：「諦觀法王法，法王法如是。」世尊便下座。

'''
case_en = '''
One day the Buddha took the teaching seat. Manjushri struck the gavel and announced, "Look closely at the law of the King of the Law. The law of the King of the Law is just this." And the Buddha came down from the seat.
'''

verse_zh = '''
一段真風見也麼？
綿綿化母理機梭。
織成古錦含春象，
無柰東君漏泄何。

'''
verse_en = '''
Do you see that current of true wind?
On and on, the mother of change works her loom and shuttle.
She weaves an ancient brocade with spring folded into it.
What's she to do? The Lord of Spring gives it away.
'''

pointer = '''
The collection opens at the source: the Buddha climbing onto the teaching seat to deliver a sermon, the founding scene of the whole tradition. Manjushri is the bodhisattva of wisdom, who runs this assembly like a master of ceremonies; the gavel he strikes is the signal that a Dharma talk is about to begin. He bangs it and says in one breath: look closely, the truth of the King of the Law is exactly this. The "King of the Law" is the Buddha. So the Buddha simply gets down and walks off. Notice that the case never tells you what "this" points to.
'''
