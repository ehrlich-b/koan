slug = ""
title_zh = "馬祖白黑"
title_en = "Mazu's White and Black"

intro_zh = '''
開口不得時，無舌人解語；擡脚不起處，無足人解行。若也落他彀中，死在句下，豈有自由分？四山相逼時，如何透脫？

'''
intro_en = '''
When opening the mouth won't do, a person without a tongue knows how to speak. Where a foot can't lift, a person without feet knows how to walk. Fall within someone else's sights and die under a sentence: what room is left to move? When the four mountains close in on every side, how do you slip free?
'''

case_zh = '''
僧問馬大師：「離四句，絕百非，請師直指某甲西來意。」大師云：「我今日勞倦，不能為汝說，問取智藏去。」僧問藏，藏云：「何不問和尚？」僧云：「和尚教來問。」藏云：「我今日頭痛，不能為汝說，問取海兄去。」僧問海，海云：「我到這裏，却不會。」僧舉似大師，大師云：「藏頭白，海頭黑。」

'''
case_en = '''
A monk asked Master Ma, "Leave the four propositions and the hundred negations aside. Please point me straight to the meaning of Bodhidharma's coming from the West."

Mazu said, "I'm worn out today. I can't explain it to you. Go ask Zhizang."

The monk asked Zhizang. Zhizang said, "Why not ask the master?"

The monk said, "The master sent me to you."

Zhizang said, "My head aches today. I can't explain it to you. Go ask Brother Hai."

The monk asked Hai. Hai said, "When it comes to this, I don't understand."

The monk reported it all to Mazu. Mazu said, "Zang's head is white. Hai's head is black."
'''

verse_zh = '''
藥之作病，
鑒乎前聖。
病之作醫，
必也其誰。
白頭黑頭兮克家之子，
有句無句兮截流之機。
堂堂坐斷舌頭路，
應笑毘耶老古錐。

'''
verse_en = '''
Medicine can become an illness.
Take the old sages as your mirror.
The illness can become the doctor.
Who else could it be?
White head, black head: true sons of the house.
With words or without: a move that cuts off the current.
Sitting bolt upright, he severs the road of the tongue,
He might well laugh at that old awl of Vaishali.
'''

pointer = '''
Mazu is one of the towering Tang masters; Zhizang and Huaihai are two of his leading students. Huaihai is the one Zhizang calls Brother Hai. The monk arrives swinging technical gear: "the four propositions" and "the hundred negations" are logic-chopping categories from Buddhist debate. The four are yes, no, both, and neither, and "why did Bodhidharma come from the West?" is the headline question, the meaning of Chan itself. He wants the answer handed over, gift-wrapped, with all the philosophy stripped off. So Mazu plays keep-away, passing him down a relay of dodges (I'm tired, I have a headache, I don't understand) that leave him nothing solid to seize. His verdict is "Zang's head is white. Hai's head is black." The verse imagines laughing at Vimalakirti, the famous layman from Vaishali who answered a question about nonduality with pure silence.
'''
