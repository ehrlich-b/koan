number = 54
slug = ""
title_zh = "雲巖大悲"
title_en = "Yunyan's Hands and Eyes"

intro_zh = '''
八面欞櫳，十方通暢。一切處放光動地，一切時妙用神通。且道：如何發現？

'''
intro_en = '''
Windows on all eight sides, open clear through in all ten directions. Everywhere it floods with light and shakes the ground. Every moment it works its wonders. So tell me, how does it show itself?
'''

case_zh = '''
雲巖問道吾：「大悲菩薩用許多手眼作麼？」吾云：「如人夜間背手摸枕子。」巖云：「我會也。」吾云：「汝作麼生會？」巖云：「遍身是手眼。」吾云：「道即大曬，道即得八成。」巖云：「師兄作麼生？」吾云：「通身是手眼。」

'''
case_en = '''
Yunyan asked Daowu, "What does the Bodhisattva of Great Compassion do with all those hands and eyes?"
Daowu said, "It's like someone in the dark reaching back to feel for a pillow."
Yunyan said, "I get it."
Daowu said, "What do you get?"
Yunyan said, "Hands and eyes all over the body."
Daowu said, "Well said. But you've only got eighty percent of it."
Yunyan said, "How would you put it, brother?"
Daowu said, "The whole body is hands and eyes."
'''

verse_zh = '''
一竅虛通，
八面櫺櫳。
無象無私春入律，
不留不礙月行空。
清淨寶目功德臂，
遍身何似通身是？
現前手眼顯全機，
大用縱橫何忌諱？

'''
verse_en = '''
One opening, clear through,
windows on all eight sides.
Formless and impartial, spring comes in on the proper note.
Nothing lingering, nothing in the way, the moon crosses the sky.
Pure, jeweled eyes and arms of merit.
How does "all over the body" compare with "the whole body"?
Hands and eyes right here lay the whole works bare.
Free to act in every direction, what's there to flinch from?
'''

pointer = '''
The Bodhisattva of Great Compassion is Guanyin (Avalokiteshvara), often shown with a thousand arms, an eye set in every palm, a picture of compassion reaching all directions at once. Yunyan calls his fellow monk Daowu brother, and Yunyan is poking at the image: a thousand hands and eyes, what are they actually for? Daowu's answer is the case. It's like reaching back in the dark to find your pillow, no looking, no deciding, the body just doing it. Then the two split hairs over wording, "all over the body" against "the whole body," and Daowu's "eighty percent" leaves a gap between the two. This is Yunyan again from the memorial in case 49, the teacher whose every word both lands and slightly misses.
'''
