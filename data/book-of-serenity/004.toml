number = 4
slug = ""
title_zh = "世尊指地"
title_en = "The Buddha Points at the Ground"

intro_zh = '''
一塵纔舉，大地全收；疋馬單槍，開疆展土。便可隨處作主，遇緣即宗底，是甚麼人？

'''
intro_en = '''
Lift a single speck of dust and the whole earth comes with it. One horse, one spear, and you've opened up new country. Who can be master wherever they go and meet whatever comes as the heart of the teaching?
'''

case_zh = '''
世尊與眾行次，以手指地云：「此處宜建梵剎。」帝釋將一莖草，插於地上云：「建梵剎已竟。」世尊微笑。

'''
case_en = '''
The Buddha was walking with the assembly. He pointed at the ground and said, "This is a good spot to build a temple." Indra, lord of the gods, took a single blade of grass, stuck it in the ground, and said, "The temple is built." The Buddha smiled.
'''

verse_zh = '''
百草頭上無邊春，
信手拈來用得親。
丈六金身功德聚，
等閑携手入紅塵。
塵中能作主，
化外自來賓。
觸處生涯隨分足，
未嫌伎倆不如人。

'''
verse_en = '''
On the tip of every blade of grass, spring without end.
Pick one up as your hand pleases and put it to use right there.
The sixteen-foot golden body, a treasury of merit,
yet off he strolls hand in hand into the red dust.
In the dust, he can play host.
Beyond the reach of the teaching, he comes as a guest.
Wherever he goes, what he has is enough.
He never worries that his skills might fall short of anyone else's.
'''

pointer = '''
The Buddha is out walking with his students, and Indra, the king of the gods in Indian myth, appears here as an eager pupil rather than a cosmic overlord. When the Buddha points at the ground and calls it a good site for a temple, he sounds like he is scouting real estate for a grand building. Indra plants a single blade of grass and declares the temple finished. The Buddha's only response is a smile. The verse has the Buddha's golden body stroll right into the "red dust," the everyday world.
'''
