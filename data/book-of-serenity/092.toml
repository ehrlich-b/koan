number = 92
slug = ""
title_zh = "雲門一寶"
title_en = "Yunmen's One Treasure"

intro_zh = '''
得游戲神通大三昧，解眾生語言陀羅尼。拽轉睦州秦時𨍏輅鑽，弄出雪峯南山鱉鼻蛇。還識得此人麼？

'''
intro_en = '''
He has mastered the great samadhi where miracles come out to play, and knows the spell that opens up every tongue living things speak. He can spin Muzhou's old Qin cart drill and flush Xuefeng's turtle-nosed snake out of South Mountain. Do you know who this man is?
'''

case_zh = '''
雲門大師云：「乾坤之內，宇宙之間，中有一寶，祕在形山。」拈燈籠向佛殿裏，將三門來燈籠上。

'''
case_en = '''
Master Yunmen said, "Within heaven and earth, out in the wide cosmos, there is one treasure, hidden in the mountain of form." He took up a lantern and went into the Buddha hall, then brought the temple gate over and put it on the lantern.
'''

verse_zh = '''
收卷餘懷厭事華，
歸來何處是生涯。
爛柯樵子疑無路，
挂樹壺公妙有家。
夜水金波浮桂影，
秋風雪陣擁蘆花。
寒魚著底不吞餌，
興盡清歌却轉槎。

'''
verse_en = '''
I roll up my remaining cares, tired of the world's display.
I come home. Where is my life to be found?
His axe handle rotted through, the woodcutter wonders if there's a road back.
The old man hangs his gourd from a tree. He has a marvelous home.
Gold ripples on the water at night lift the shadow of the cassia tree.
The autumn wind bunches the reed flowers in ranks of snow.
The cold fish lies on the bottom and won't take the bait.
When I've had my fill, I sing out and turn the raft around.
'''

pointer = '''
Yunmen (864–949, Five Dynasties) was among the sharpest masters of his era, known for one-line jolts. He quotes an old line from a Buddhist text, "within heaven and earth, in the cosmos, there is one treasure hidden in the mountain of form," where "mountain of form" means your own body. Most ears take that as poetry about a precious buddha-nature to be mined out of you. Yunmen grabs a lantern, carries it into the Buddha hall, and balances the giant temple gate on top of it, ordinary objects handled as if the whole place weighed nothing. In case 62 of the Blue Cliff Record, he tells his listeners to put the gate on the lantern. The verse parades the woodcutter from case 57 whose axe-handle rots while he watches immortals at their game and the sage who kept a paradise inside a gourd, then ends on a fish too wise to take the hook.
'''
