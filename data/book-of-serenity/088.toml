number = 88
slug = ""
title_zh = "楞嚴不見"
title_en = "The Surangama: Not Seeing"

intro_zh = '''
有見有不見，日午點燈；無見無不見，夜半潑墨。若信見聞如幻瞖，方知聲色若空花。且道：教中還有衲僧說話麼？

'''
intro_en = '''
There's seeing and not-seeing, a lamp lit at high noon. There's neither seeing nor not-seeing, ink splashed at midnight. Once you accept that seeing and hearing are like the delusions of a clouded eye, you'll know sound and form for flowers in empty air. Tell me, are there any words of a Zen monk in the scriptures?
'''

case_zh = '''
楞嚴經云：「吾不見時，何不見吾不見之處？若見不見，自然非彼不見之相；若不見吾不見之地，自然非物，云何非汝？」

'''
case_en = '''
The Surangama Sutra says, "When I don't see, why don't you see where I don't see? If you see it, what you see clearly can't be the appearance of my not seeing. If you don't see where I don't see, then clearly it isn't an object. How could it not be you?"
'''

verse_zh = '''
滄海瀝乾，
太虛充滿。
衲僧鼻孔長，
古佛舌頭短。
珠絲度九曲，
玉機纔一轉。
直下相逢誰識渠，
始信斯人不合伴。

'''
verse_en = '''
The vast ocean wrung dry,
empty space packed full.
The monk's nostrils run long.
the old buddha's tongue falls short.
A silk thread goes through the nine bends of a pearl.
The jade loom turns just once.
Meet him face to face. Who recognizes him?
Now you trust this one keeps no company.
'''

pointer = '''
This comes straight from the Surangama Sutra, with the Buddha pressing his disciple Ananda on what "seeing" actually is. Ordinary logic says: I see things, so seeing is something I aim at objects out there. The Buddha inverts it. He points to "not-seeing" and dares you to spot it, and you can't, because there is no object out there to find. The intro likens what you see and hear to a smudge drifting across a sick eye. The same sutra furnishes the question that closes this collection (case 100), where mountains and rivers "suddenly arise" from the originally pure.
'''
