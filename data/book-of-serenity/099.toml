number = 99
slug = ""
title_zh = "雲門鉢桶"
title_en = "Yunmen's Bowl and Bucket"

intro_zh = '''
棊有別智，酒有別腸。狡兔三穴，猾胥萬倖。更有箇誵頭底，且道是誰？

'''
intro_en = '''
Board games take their own kind of cunning. Drink takes its own kind of gut. The clever hare keeps three burrows, and the sly clerk has ten thousand ways to slip free. And there's one slipperier than any of them. Tell me, who?
'''

case_zh = '''
僧問雲門：「如何是塵塵三昧？」門云：「鉢裏飯，桶裏水。」

'''
case_en = '''
A monk asked Yunmen, "What is the samadhi of each and every speck of dust?"

Yunmen said, "Rice in the bowl, water in the bucket."
'''

verse_zh = '''
鉢裏飯，桶裏水，
開口見膽，求知已。
擬思便落二三機，
對面忽成千萬里。
韶陽師較些子，
斷金之義兮誰與相同，
匪石之心兮獨能如此。

'''
verse_en = '''
Rice in the bowl, water in the bucket.
Open your mouth, show your heart, and look for someone who knows you.
Begin to think it over and you fall into second and third moves.
Face to face, and at once you're a thousand miles off.
The master of Shaoyang comes a little closer.
A bond that cuts through metal, who else shares it?
A heart that can't be rolled like a stone. He alone can be so.
'''

pointer = '''
Yunmen (864–949, active into the Five Dynasties) is the master known for blunt one-line replies that stop you flat. The monk fishes for something cosmic: "samadhi" is deep meditative absorption, and he asks about it in each and every speck of dust, braced for a lofty answer. Yunmen points at lunch instead: rice is in the bowl, water is in the bucket. Hongzhi's verse has you start thinking it over, then meet it face to face and find it's suddenly a thousand miles off. This is the same hammer Yunmen swings at the sesame cake (case 78).
'''
