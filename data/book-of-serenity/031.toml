number = 31
slug = ""
title_zh = "雲門露柱"
title_en = "Yunmen's Pillar"

intro_zh = '''
向上一機，鶴沖霄漢；當陽一路，鷂過新羅。直饒眼似流星，未免口如匾檐。且道：是何宗旨？

'''
intro_en = '''
One move beyond: a crane shoots high into the sky. One road in broad daylight: a hawk flies past Silla. Even with eyes like shooting stars, your mouth is still stiff as a carrying pole. Tell me, what's the point of it?
'''

case_zh = '''
雲門垂語云：「古佛與露柱相交，是第幾機？」眾無語。自代云：「南山起雲，北山下雨。」

'''
case_en = '''
Yunmen put it to the room: "The ancient buddha and the bare pillar have dealings with each other. Which kind of move is that?" No one answered. He answered for them: "Clouds rise on the south mountain. Rain falls on the north."
'''

verse_zh = '''
一道神光，
初不覆藏。
超見緣也是而無是，
出情量也當而無當。
巖華之粉兮蜂房成蜜，
野草之滋兮麝臍作香。
隨類三尺一丈六，
明明觸處露堂堂。

'''
verse_en = '''
One stroke of wondrous light,
never hidden from the start.
Beyond what meets the eye, right without there being a right.
Beyond what thought can measure, fitting without there being a fit.
Pollen from cliff flowers makes honey in the hive.
Nourishment from wild grass becomes the musk deer's scent.
It takes the form that fits, three feet tall or sixteen.
Plain as day, wherever you turn, it stands wide open.
'''

pointer = '''
Yunmen (864–949), a Five Dynasties master famous for blunt sideways replies, turns up across this book in cases 19, 40, 78, and 82. A 露柱 is a bare pillar holding up the temple hall, the dullest object in the room. When he asks what kind of encounter an ancient buddha has with a dumb post, he is baiting the monks to rank it high teaching or low, and the ranking is the snare. His own answer skips the grading and points out the window: clouds rise on one hill, rain falls on the next.
'''
