number = 32
slug = ""
title_zh = "仰山心境"
title_en = "Yangshan on Mind and Its Object"

intro_zh = '''
海為龍世界，隱顯優游；天是鶴家鄉，飛鳴自在。為甚麼困魚止濼，鈍鳥棲蘆？還有計利害處麼？

'''
intro_en = '''
The sea is the dragon's world; it hides or shows itself as it pleases. The sky is the crane's home; it flies and cries free as it likes. Why, then, does the weary fish stop in a pool, and the dull bird hole up in the reeds? Is there any reckoning of gain and loss here?
'''

case_zh = '''
仰山問僧：「甚處人？」僧云：「幽州人。」山云：「汝思彼中麼？」僧云：「常思。」山云：「能思是心，所思是境，彼中山河大地、樓臺殿閣、人畜等物，反思思底心，還有許多般麼？」僧云：「某甲到這裏，總不見有。」山云：「信位即是，人位未是。」僧云：「和尚莫別有指示否？」山云：「別有別無，即不中。據汝見處，只得一玄，得坐披衣，向後自看。」

'''
case_en = '''
Yangshan asked a monk, "Where are you from?"

"Youzhou," the monk said.

"Do you think about home?"

"All the time."

Yangshan said, "What does the thinking is mind. What it thinks of is its object: the mountains, rivers, and land there, the towers and halls, the people and animals and the rest. Now turn your thoughts back toward the mind that thinks. Is all that variety there?"

The monk said, "When I come this far, I see none of it at all."

Yangshan said, "That will do for the stage of faith. It isn't yet the stage of the person."

The monk said, "Master, do you have anything else to show me?"

Yangshan said, "Whether you say there's something else or nothing else, you miss it. As far as you've seen, you've got just one of the mysteries. Take your seat, put on your robe, and from here look into it yourself."
'''

verse_zh = '''
無外而容，
無礙而沖。
門牆岸岸，
關鎖重重。
酒常酣而臥客，
飯雖飽而穨農。
突出虛空兮風搏妙翅，
踏翻滄海兮雷送游龍。

'''
verse_en = '''
Nothing outside it, yet it makes room.
Nothing in its way, yet it is empty.
Gates and walls rise steeply.
Bolts and locks, layer upon layer.
The wine is strong, and the guest lies drunk.
The farmer has had his fill of rice, yet he's worn out.
It breaks into open sky, and wind beats those wondrous wings.
It kicks over the blue sea, thunder sends the roaming dragon on.
'''

pointer = '''
Yangshan, a Tang master, runs a monk through a standard distinction: "mind" is the part of you doing the perceiving, "object" is everything perceived, the hometown and buildings and people out there. The monk, who comes from Youzhou, a region centered on what's now Beijing, reports that when he looks back at the mind doing the thinking he doesn't see any of that scenery. Yangshan's catch is precise: that's the "stage of faith," a foothold. The monk hasn't reached the "stage of the person." When the monk fishes for the next secret move, Yangshan won't sell it, because "there's more" and "there's nothing more" both miss; he tells him to take his seat and look into it himself. The intro's tired fish settling in a pool and dull bird holing up in the reeds name the danger exactly: a creature built to roam freely settling into the shallows on the strength of one good insight.
'''
