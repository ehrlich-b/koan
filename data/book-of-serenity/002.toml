number = 2
slug = ""
title_zh = "達磨廓然"
title_en = "Bodhidharma's \"Vast Emptiness\""

intro_zh = '''
卞和三獻，未免遭刑；夜光投人，鮮不按劍。卒客無卒主，宜假不宜真。差珍異寶用不著，死猫兒頭拈出，看。

'''
intro_en = '''
Bian He offered his jade three times and it cost him his feet. Toss someone a pearl that glows in the dark and just about anyone will reach for a sword. An unexpected guest finds no host ready. Better make do with a stand-in than bring out the real thing. Rare treasures are no use here. So watch: I'll hold up a dead cat's head instead.
'''

case_zh = '''
梁武帝問達磨大師：「如何是聖諦第一義？」磨云：「廓然無聖。」帝云：「對朕者誰？」磨云：「不識。」帝不契，遂渡江至少林，面壁九年。

'''
case_en = '''
Emperor Wu of Liang asked Bodhidharma, "What is the highest meaning of the sacred truth?"

Bodhidharma said, "Vast emptiness. Nothing holy."

The emperor said, "Who is standing in front of me?"

Bodhidharma said, "No idea."

The emperor didn't get it, so Bodhidharma crossed the river to Shaolin and sat facing a wall for nine years.
'''

verse_zh = '''
廓然無聖，
來機逕庭。
得非犯鼻而揮斤，
失不迴頭而墮甑。
寥寥冷坐少林，
默默全提正令。
秋清月轉霜輪，
河淡斗垂夜柄。
繩繩衣鉢付兒孫，
從此人天成藥病。

'''
verse_en = '''
Vast emptiness, nothing holy.
The question and reply are worlds apart.
Get it right and the axe swings without touching the nose.
Miss it and the pot shatters without a backward glance.
Alone, cold, sitting at Shaolin,
silent, holding the whole teaching in force.
Autumn clear, the moon a wheel of frost rolling on,
the Milky Way pale, the Dipper's handle hung in the night.
Robe and bowl pass on down the line, son to grandson.
From here on, for gods and humans, both cure and disease.
'''

pointer = '''
This is the same scene that opens the Blue Cliff Record (case 1), and reading it here gives you the cooler, slower version of the encounter. Bodhidharma is the Indian monk credited with carrying Chan to China in the early sixth century. Emperor Wu of Liang was a lavish Buddhist patron who had built temples and funded translations, so his question about "the highest holy truth" is fishing for the merit badge he assumes he has earned. Bodhidharma takes it away: vast emptiness, nothing holy. Then "Who is standing in front of me?" gets an "No idea," and when the emperor stays baffled, Bodhidharma leaves for nine years of wall-sitting. The verse closes on "cure and disease," which is the sting: once people grip even this teaching, it becomes the next thing that holds them.
'''
