number = 93
slug = ""
title_zh = "魯祖不會"
title_en = "Luzu Doesn't Get It"

intro_zh = '''
荊珍抵鵲，老鼠□金。不識其寶，不得其用。還有頓省衣珠底麼？

'''
intro_en = '''
A gem from Jing to throw at a magpie, a rat with gold. Fail to recognize a treasure and you can't put it to use. Is there anyone who sees at once the jewel sewn into their own robe?
'''

case_zh = '''
魯祖問南泉：「摩尼珠人不識，如來藏裏親收得。如何是藏？」泉云：「王老師與汝往來者是。」祖云：「不往來者？」泉云：「亦是藏。」祖云：「如何是珠？」泉召云：「師祖！」祖應諾。泉云：「去！汝不會我語。」

'''
case_en = '''
Luzu asked Nanquan, "People don't recognize the mani jewel, but in the Buddha's treasury you can take it right in hand. What is the treasury?"

Nanquan said, "It's old Teacher Wang coming and going with you."

Luzu asked, "And what doesn't come and go?"

Nanquan said, "That's the treasury too."

Luzu asked, "What is the jewel?"

Nanquan called, "Master Zu!"

Luzu answered, "Yes?"

Nanquan said, "Get out. You don't understand a word I say."
'''

verse_zh = '''
別是非，明得喪，
應之心指諸掌。
往來不往來，
只這俱是藏。
輪王賞之有功，
黃帝得之罔象。
轉樞機，能伎倆，
明眼衲僧無鹵莽。

'''
verse_en = '''
Tell right from wrong, see clearly what's gained and lost.
Respond with your heart, as plain as something in your palm.
Coming and going, or neither coming nor going,
all of this is the treasury.
The wheel-turning king awards it for merit.
The Yellow Emperor gets it through the Shapeless One.
Turn the pivot and show what you can do.
The clear-eyed monk is never clumsy.
'''

pointer = '''
Luzu and Nanquan are Tang-dynasty Chan teachers. The "mani jewel" is a wish-granting gem from Buddhist lore, standing here for your own buddha-nature, the thing you already carry but keep failing to notice. The "Buddha's treasury" (tathagatagarbha) is the teaching that this nature is stowed inside everyone, treasure in a junk heap. The jewel sewn into the robe comes from the Lotus Sutra. Luzu keeps trying to corner the jewel as an object he can point at and define: what is the treasury, what comes and goes, what doesn't. Nanquan calls himself "old Teacher Wang," using his family name. Nanquan plays along until the last beat, when he simply barks Luzu's name; Luzu answers "yes" on reflex, and Nanquan throws him out. The setup is close kin to Nanquan's peony (case 91).
'''
