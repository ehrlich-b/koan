number = 8
slug = ""
title_zh = "百丈野狐"
title_en = "Baizhang's Fox"

intro_zh = '''
記箇元字脚在心，入地獄如箭射。一點野狐涎，嚥下三十年，吐不出。不是西天令嚴，只為獃郎業重。曾有誤犯者麼？

'''
intro_en = '''
Lodge a scrap of the old wording in your mind and you're off to hell like an arrow. Swallow a single drop of fox spit and you'll choke on it thirty years and never get it back up. The law from India isn't harsh. The fool's karma is heavy. Has anyone ever slipped up here?
'''

case_zh = '''
百丈上堂，常有一老人聽法，隨眾散去。一日不去，丈乃問：「立者何人？」老人云：「某甲於過去迦葉佛時，曾住此山。有學人問：『大修行底人還落因果也無？』對他道：『不落因果。』墮野狐身五百生。今請和尚代一轉語。」丈云：「不昧因果。」老人於言下大悟。

'''
case_en = '''
Whenever Baizhang gave a talk, an old man would listen with the assembly and leave when they did. One day he stayed. Baizhang asked, "Who's that standing there?"

The old man said, "Ages ago, in the time of Kashyapa Buddha, I lived on this mountain. A student asked me, 'Does someone of deep practice still fall under cause and effect?' I told him, 'They don't fall under cause and effect.' I fell into a fox's body for five hundred lives. Master, please give a turning word in my place."

Baizhang said, "They aren't blind to cause and effect."

At those words the old man woke up.
'''

verse_zh = '''
一尺水，一丈波，
五百生前不奈何。
不落不昧商量也，
依前撞入葛藤窠。
阿呵呵，
會也麼？
若是爾灑灑落落，
不妨我哆哆和和。
神歌社舞自成曲，
拍手其間唱哩囉。

'''
verse_en = '''
A foot of water, a ten-foot wave.
Five hundred lives, and no way out.
Talk it over: "doesn't fall," "isn't blind,"
and back you go, tangled in the vines.
Ha ha ha!
Got it yet?
If you're loose and clear and free of it all,
I don't mind babbling and humming along.
Songs for the gods and dances at the shrine make their own tune.
Clap your hands and sing along: la-di-da.
'''

pointer = '''
Baizhang is a great Tang master, and this is the famous fox, told here beside Wumen's sharper handling of it in the Gateless Gate (case 2). An old man confesses that he once lived and answered students' questions on this same mountain and got reborn as a fox five hundred times over a single answer. The fatal question was whether an enlightened person still falls under cause and effect, karma, the law that actions carry consequences, and his fatal reply was no, the awakened are above it, as if enlightenment were a permanent exemption. Baizhang changes one Chinese character: not "does not fall under" cause and effect but "is not blind to" it. The verse's joke is that even this change becomes another hair to split.
'''
