number = 29
slug = ""
title_zh = "風穴鐵牛"
title_en = "Fengxue's Iron Ox"

intro_zh = '''
遲棊鈍行，爛却斧柯；眼轉頭迷，奪將杓柄。若也打在鬼窟裏，把定死蛇頭，還有變豹分也無？

'''
intro_en = '''
Drag your feet at the game, stall your moves, and the axe handle rots away. Your eyes swim, your head goes foggy, and someone snatches the ladle by the handle. Once you've landed in a ghost cave and got a dead snake by the head, do you still have a chance of changing like a leopard?
'''

case_zh = '''
風穴在郢州衙內，上堂云：「祖師心印，狀似鐵牛之機，去即印住，住即印破。只如不去不住，印即是？不印即是？」時有廬陂長老出問云：「某甲有鐵牛之機，請師不搭印。」穴云：「慣釣鯨鯢澄巨浸，却嗟蛙步𩥇泥沙。」陂佇思。穴喝云：「長老何不進語？」陂擬議，穴打一拂子云：「還記得話頭麼？試舉看。」陂擬開口，穴又打一拂子。牧主云：「佛法與王法一般。」穴云：「見箇什麼？」牧云：「當斷不斷，返招其亂。」穴便下座。

'''
case_en = '''
Fengxue took the high seat at the government office in Yingzhou and said, "The ancestors' mind seal works like the iron ox. If it goes, the seal holds. If it stays, the seal breaks. If it neither goes nor stays, is it right to stamp or right to leave it unstamped?"

Elder Lupi stepped forward and said, "I have the working of the iron ox. Master, please don't stamp."

Fengxue said, "I'm used to fishing for whales to clear the vast waters. What a pity to see a frog hop through the mud." Lupi stood thinking.

Fengxue shouted, "Elder, why don't you say something?" Lupi started to consider a reply, and Fengxue struck him with his whisk. "Do you even remember the question? Let's hear it." Lupi was about to open his mouth, and Fengxue struck him with the whisk again.

The governor said, "The Buddha's law is just like the king's law."

Fengxue asked, "What do you see in it?"

The governor said, "When it's time to cut and you don't cut, you only invite chaos."

Fengxue came down from the seat.
'''

verse_zh = '''
鐵牛之機，
印住印破。
透出毘盧頂𩕳行，
却來化佛舌頭坐。
風穴當衡，
盧陂負墮。
棒頭喝下，
電光石火。
歷歷分明珠在盤，
眨起眉毛還蹉過。

'''
verse_en = '''
The working of the iron ox.
The seal holds, the seal breaks.
It goes right out through the crown of Vairocana's head.
Then comes back to sit on the tongue of a buddha in manifested form.
Fengxue holds the balance.
Lupi takes the fall.
At the tip of the stick, in the shout,
lightning flashes and flint sparks.
Plain as a pearl on a tray.
Raise an eyebrow and you've already missed it.
'''

pointer = '''
Fengxue is running a public Dharma session inside a provincial government office, the regional governor seated in the audience, which pays off at the end. The "mind-seal" is the wordless transmission from master to student, likened to a seal that stamps its pattern into another surface. In Chinese lore, iron oxen were set out to hold back floods. Fengxue likens the seal to the workings of an iron ox and sets the room an either/or (stamp it? don't?). Elder Lupi struts up claiming he owns the iron ox's working, then locks up, and both times he reaches for words Fengxue's whisk lands before he can speak. The governor caps it with a soldier's proverb about fatal hesitation, and Fengxue steps down. Watch the whisk: it strikes while Lupi is still getting ready to speak.
'''
