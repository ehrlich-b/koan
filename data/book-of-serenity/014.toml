number = 14
slug = ""
title_zh = "廓侍過茶"
title_en = "Kuo Serves Tea to Deshan"

intro_zh = '''
探竿在手，影草隨身。有時鐵裹綿團，有時錦包特石。以剛決柔則故是，逢強即弱事如何？

'''
intro_en = '''
A probing pole in your hand, decoy grass close by. Sometimes iron wrapped in cotton, sometimes a big stone dressed in brocade. The hard can cut through the soft, of course. What happens when you meet strength with weakness?
'''

case_zh = '''
廓侍者問德山：「從上諸聖向什麼處去也？」山云：「作麼？作麼？」廓云：「勅點飛龍馬，跛鼈出頭來。」山便休去。來日山浴出，廓過茶與山，山撫廓背一下。廓云：「這老漢方始瞥地。」山又休去。

'''
case_en = '''
Kuo the attendant asked Deshan, "Where did all the old sages go?"

Deshan said, "What? What's that?"

Kuo said, "The decree called for a flying dragon horse, and a lame turtle stuck its head out." Deshan let it drop.

The next day Deshan came out of the bath, and Kuo brought him tea. Deshan gave him a pat on the back.

Kuo said, "So the old man's finally caught a glimpse." Again Deshan let it drop.
'''

verse_zh = '''
覿面來時作者知，
可中石火電光遲。
輸機謀主有深意，
欺敵兵家無遠思。
發必中，
更謾誰？
腦後見腮兮，人難觸犯；
眉底著眼兮，渠得便宜。

'''
verse_en = '''
When it comes right at him, an adept knows.
Even a spark off flint and a lightning flash might come too slow.
The strategist who yields the moment may have a deeper plan.
A commander bent on tricking the enemy thinks no further ahead.
When it goes off, it hits the mark.
Who is left to fool?
If you can see his jowls from behind, he's hard to take on.
Eyes under his eyebrows, and he has the advantage.
'''

pointer = '''
Deshan is the famously fierce Tang master, the kind who would hit or yell to knock you off your script. Kuo is his personal attendant, the junior monk who fetches his tea and washes his robes, and the kid is testing the master, trying to catch him napping. Twice Kuo throws a sharp line, first likening Deshan to a lame turtle when he was expecting an imperial dragon horse, then saying "so the old man's finally caught a glimpse" after Deshan pats him on the back. Both times Deshan simply lets it go. The trap is reading that silence as a loss. The strange closing image, jowls you can see from behind, is the verse's sign of someone hard to take on.
'''
