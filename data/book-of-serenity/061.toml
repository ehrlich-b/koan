number = 61
slug = ""
title_zh = "乾峯一畫"
title_en = "Qianfeng's One Stroke"

intro_zh = '''
曲說易會，一手分付；直說難會，十字打開。勸君不用分明語，語得分明出轉難。不信試舉看。

'''
intro_en = '''
Talk around it and it goes down easy. You can hand it over with one hand. Say it straight and it's hard to take. The whole thing cracks wide open. Take my advice and don't bother spelling it out. The clearer you make it, the harder it is to get away. Don't believe me? Here's a case. Watch.
'''

case_zh = '''
僧問乾峯：「十方薄伽梵，一路涅盤門，未審路頭在甚麼處？」峯以拄杖一畫云：「在這裏。」僧舉問雲門，門云：「扇子𨁝跳上三十三天，築著帝釋鼻孔；東海鯉魚打一棒，雨似盆傾。會麼？會麼？」

'''
case_en = '''
A monk asked Qianfeng, "For the buddhas of the ten directions, there's one road to the gate of nirvana. Where does that road begin?"

Qianfeng made a stroke with his staff and said, "Right here."

The monk brought this up with Yunmen. Yunmen said, "The fan leaps up to the Heaven of the Thirty-Three and rams Indra in the nostrils. Give the carp in the Eastern Sea a whack, and rain comes down like water from an overturned basin. Get it? Get it?"
'''

verse_zh = '''
入手還將死馬醫，
返魂香欲起君危。
一期拶出通身汗，
方信儂家不惜眉。

'''
verse_en = '''
He takes it in hand the way a vet doctors a dead horse,
would burn soul-restoring incense to raise you from the brink.
One hard squeeze and your whole body breaks into sweat,
Only then will you believe I never spared my own eyebrows.
'''

pointer = '''
A monk wants the one true path to enlightenment, straight and certain and mapped, and asks where it begins. Qianfeng's answer is to make a single stroke with his staff: "Right here." No doctrine, no direction handed over, only this spot under his stick. Then the monk carries the exchange to Yunmen, the tenth-century master famous for one-word hammer-blows, and Yunmen goes completely off the rails: a fan flying up to the Heaven of the Thirty-Three to ram Indra, its king, in the nose, then a whack to a carp in the Eastern Sea that brings on a downpour. The same exchange closes the Gateless Gate in case 48. In Chan lore a teacher who over-explains "loses his eyebrows," they drop out as karmic payment for spelling out what can't really be said, and the verse's narrator brags he risked his own.
'''
