number = 56
slug = ""
title_zh = "密師白兔"
title_en = "Master Mi's White Rabbit"

intro_zh = '''
寧可永劫沈淪，不求諸聖解脫。提婆達多，無間獄中受三禪樂；欝頭藍弗，有頂天上墮飛狸身。且道：利害在甚麼處？

'''
intro_en = '''
Better to sink for endless ages than seek the liberation of the saints. In the hell of unceasing suffering, Devadatta enjoyed the bliss of the third meditative absorption. Udraka, perched at the very summit of heaven, fell into the body of a flying civet. So tell me, where are the gain and the loss?
'''

case_zh = '''
密師伯與洞山行次，見白兔子面前走過。密云：「俊哉！」山云：「作麼生？」密云：「如白衣拜相。」山云：「老老大大，作這箇語話！」密云：「爾又作麼生？」山云：「積代簪纓，暫時落薄。」

'''
case_en = '''
Senior monk Mi was walking with Dongshan when a white rabbit darted across their path.
"Splendid!" said Mi.
"How so?" said Dongshan.
"Like a commoner made chief minister," said Mi.
"A grown man your age, and that's the best you can do?" said Dongshan.
"Then what would you say?" said Mi.
"Generations of official rank," said Dongshan, "fallen on hard times for a little while."
'''

verse_zh = '''
抗力霜雪，
平步雲霄。
下惠出國，
相如過橋。
蕭曹謀略能成漢，
巢許身心欲避堯。
寵辱若驚深自信，
真情參跡混漁樵。

'''
verse_en = '''
He holds his ground against frost and snow,
then strolls at ease into the clouds.
Liuxia Hui walks out of his own country.
Sima Xiangru crosses the bridge.
Xiao He and Cao Shen devise the plans that establish the Han.
Chaofu and Xu You want nothing to do with Yao.
Startled by favor or disgrace, he trusts himself deeply.
His true heart hidden among fishermen and woodcutters.
'''

pointer = '''
Two Tang Chan monks are out walking when a white rabbit bolts past. Mi sees a commoner suddenly made chief minister; Dongshan sees a family that held office for generations fallen on hard times, same rabbit, opposite stories, and the jab "a grown man your age, that's all you've got?" is the kind of needle these two traded to test each other. The intro stacks the paradox harder: Devadatta, the Buddha's traitor cousin, finds the bliss of meditation inside hell, while the holy hermit Udraka, who reached the highest heaven, drops back down into a flying civet's body. The verse name-drops famous Chinese figures who held steady whether the world honored them or threw them out.
'''
