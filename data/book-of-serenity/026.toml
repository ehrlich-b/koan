number = 26
slug = ""
title_zh = "仰山指雪"
title_en = "Yangshan Points at the Snow"

intro_zh = '''
氷霜一色，雪月交光。凍殺法身，清損漁父。還堪賞玩也無？

'''
intro_en = '''
Ice and frost are one color. Snow and moon, their light blended into a single glare. It freezes the Dharma body to death and chills the old fisherman through. Is there still anything worth admiring?
'''

case_zh = '''
仰山指雪師子云：「還有過得此色者麼？」雲門云：「當時便與推倒。」雪竇云：「只解推倒，不解扶起。」

'''
case_en = '''
Yangshan pointed at a snow lion and said, "Is there anyone who can get past this color?"
Yunmen said, "Right then I'd have shoved it over."
Xuedou said, "He knows how to knock it down. He doesn't know how to set it back up."
'''

verse_zh = '''
一倒一起雪庭師子，
慎於犯而懷仁，
勇於為而見義。
清光照眼似迷家，
明白轉身還墮位。
衲僧家了無寄，
同死同生何此何彼。
暖信破梅兮春到寒枝，
涼飈脫葉兮秋澄潦水。

'''
verse_en = '''
Once down, once up: the snow lion in the courtyard.
Care in overstepping shows kindness.
Boldness in action shows a sense of what's right.
Clear light strikes your eyes and you seem to lose your way home.
You turn around in broad daylight and fall into another position.
A monk has nowhere at all to lodge.
Dying together, living together, what is this, what is that?
Warm tidings split the plum buds. Spring reaches the cold branches.
A cool gust strips the leaves, autumn clears the standing pools.
'''

pointer = '''
Someone has packed a lion out of snow, and Yangshan turns it into a checkpoint: "this color" is the whole blank-white world, a picture of emptiness as one uniform glare that swallows every distinction. Can anyone get past it? Yunmen says he'd shove the thing over. Xuedou, a later master who collected old cases and wrote the verses used in the Blue Cliff Record, turns the same blade on Yunmen: demolition is easy, but having flattened the lion, can you build anything back? The verse measures both moves against the way the seasons keep cracking the plum buds and stripping the leaves without holding still. So which can you do, and can you do both?
'''
