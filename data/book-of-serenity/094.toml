number = 94
slug = ""
title_zh = "洞山不安"
title_en = "Dongshan Unwell"

intro_zh = '''
下不論上，卑不動尊。雖能攝已從他，未可以輕勞重。四大不調時，如何侍養？

'''
intro_en = '''
Those below don't judge those above. The humble don't push the honored around. You can rein yourself in and go along with another, but you can't trouble the weighty with the light. When the four elements fall out of balance, how do you tend to someone?
'''

case_zh = '''
洞山不安，僧問：「和尚病，還有不病者麼？」山云：「有。」僧云：「不病者還看和尚否？」山云：「老僧看他有分。」僧云：「和尚看他時如何？」山云：「則不見有病。」

'''
case_en = '''
Dongshan was sick. A monk asked, "Master, you're ill. Is there one who isn't?"
Dongshan said, "There is."
The monk said, "Does the one who isn't sick still look after you?"
Dongshan said, "I'm the one who gets to look after him."
The monk said, "And when you look after him, how is it?"
Dongshan said, "Then I see no sickness at all."
'''

verse_zh = '''
卸却臭皮袋，
拈轉赤肉團。
當頭鼻孔正，
直下髑髏乾。
老醫不見從來癖，
少子相看向近難。
野水瘦時秋潦退，
白雲斷處舊山寒。
須勦絕，
莫顢頇。
轉盡無功伊就位，
孤標不與汝同盤。

'''
verse_en = '''
Drop the stinking leather sack,
Take hold of the red lump of flesh and turn it.
Face to face, the nostrils are straight.
Right here, the skull is dry.
The old doctor can't see the longstanding ailment.
The young son comes to see him and finds it hard to get close.
The wild stream thins as the autumn floods recede,
the white clouds break, and the old mountain is cold.
Cut it clean.
Don't fumble.
The turning exhausted, with nothing achieved, he takes his place.
standing alone, he won't share your plate.
'''

pointer = '''
Dongshan, the ninth-century master at the head of the Caodong line, is sick, and a student tries to corner him: if the teacher is sick, is there one who isn't? The four elements in the introduction are earth, water, fire, and wind, whose balance was thought to keep the body well. Watch how he refuses the split. He grants there is "one who isn't sick," then inverts the hierarchy the student expected: the student asks if the well one looks after him, and Dongshan says he looks after the well one. Asked what happens then, he says he sees no sickness. The verse lays on the death-imagery, drop the leather sack, the skull dries out, and ends on the loner who won't share your plate. The question of who doesn't get sick also comes up in case 83. Dongshan makes offerings before his own teacher's portrait in case 49.
'''
