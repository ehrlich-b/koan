number = 80
slug = ""
title_zh = "龍牙過板"
title_en = "Longya Passes the Board"

intro_zh = '''
大音希聲，大器晚成。向盛忙百鬧裏佯呆，待七古千年後慢㤆。且道：是如何底人？

'''
intro_en = '''
The greatest sound is scarcely audible. The greatest vessel takes longest to finish. Right in the thick of the noise and the rush, someone plays dumb and takes his time, even if it takes a thousand years. So tell me, what sort of person is this?
'''

case_zh = '''
龍牙問翠微：「如何是祖師西來意？」微云：「與我過禪板來。」牙取禪板與翠微，微接得便打。牙云：「打即任打，要且無祖師西來意。」又問臨濟：「如何是祖師西來意？」濟云：「與我將蒲團來。」牙取蒲團與臨濟，濟接得便打。牙云：「打即任打，要且無祖師意。」牙後住院，僧問：「和尚當年問翠微、臨濟祖意，二尊宿明也未？」牙云：「明即明矣，要且無祖師意。」

'''
case_en = '''
Longya asked Cuiwei, "What's the point of the ancestor coming from the West?"
Cuiwei said, "Pass me the meditation board."
Longya handed it to him. Cuiwei took it and hit him.
Longya said, "Hit me all you like. Still, there's no meaning to the ancestor's coming."

Then he asked Linji, "What's the point of the ancestor coming from the West?"
Linji said, "Bring me the sitting cushion."
Longya handed it to him. Linji took it and hit him.
Longya said, "Hit me all you like. Still, there's no meaning to the ancestor's coming."

Later, when Longya had his own temple, a monk asked, "Back when you asked Cuiwei and Linji about the ancestor's meaning, did those two old masters see it clearly?"

Longya said, "See it? They saw it, all right. Still, there's no meaning to the ancestor's coming."
'''

verse_zh = '''
蒲團禪板對龍牙，
何事當機不作家。
未意成褫明目下，
恐將流落在天涯。
虛空那挂劍，
星漢却浮槎。
不萌草解藏香象，
無底籃能著活蛇。
今日江湖何障礙，
通方津渡有舡車。

'''
verse_en = '''
Cushion and board, squared off against Longya,
Why doesn't he meet the moment like a master?
Unexpectedly stripped bare before clear eyes,
in danger of drifting to the ends of the earth.
How could a sword hang in empty space?
yet a raft drifts across the river of stars.
Grass that never sprouts can hide a fragrant elephant.
a bottomless basket can hold a living snake.
What gets in the way on the rivers and lakes today?
At crossings open to all directions, there are boats and carts.
'''

pointer = '''
"Why did Bodhidharma come from the West?" is the stock Zen question; Bodhidharma is traditionally credited with bringing Chan from India to China, so to ask why he came is to ask what this whole enterprise is even about. Longya puts it to two heavyweight teachers, Cuiwei and Linji, and both answer not in words but with a blow, telling him to hand over an object and then hitting him with it. The live ambiguity is Longya's refrain, "still no point to Bodhidharma's coming," which never resolves into whether he is the dull student who whiffed or the one man present who got it and won't let it be dressed up. Years later, running his own temple, he gives the line again, a scene the Blue Cliff Record's case 20 leaves out. Hongzhi's verse lets it stand both ways, the bottomless basket that holds a living snake, the crossing where boats wait for anyone who knows the way over.
'''
