number = 66
slug = ""
title_zh = "九峯頭尾"
title_en = "Jiufeng's Head and Tail"

intro_zh = '''
神通妙用底，放脚不下；忘緣絕慮底，擡脚不起。可謂有時走殺，有時坐殺。如何得恰好去？

'''
intro_en = '''
The one with marvelous powers can't set a foot down. The one who's forgotten every concern and cut off thought can't lift a foot. Sometimes you run yourself to death, sometimes you sit yourself to death. How do you hit it just right?
'''

case_zh = '''
僧問九峯：「如何是頭？」峯云：「開眼不覺曉。」僧云：「如何是尾？」峯云：「不坐萬年床。」僧云：「有頭無尾時如何？」峯云：「終是不貴。」僧云：「有尾無頭時如何？」峯云：「雖飽無力。」僧云：「直得頭尾相稱時如何？」峯云：「兒孫得力，室內不知。」

'''
case_en = '''
A monk asked Jiufeng, "What is the head?"
Jiufeng said, "Open your eyes and still you miss the dawn."
The monk said, "What is the tail?"
Jiufeng said, "You don't sit on the ten-thousand-year seat."
The monk said, "What if there's a head but no tail?"
Jiufeng said, "It isn't worth much in the end."
The monk said, "What if there's a tail but no head?"
Jiufeng said, "Full, but no strength."
The monk said, "And when the head and tail match?"
Jiufeng said, "The descendants thrive, and in the inner room no one knows."
'''

verse_zh = '''
規圓矩方，
用行舍藏。
鈍躓棲蘆之鳥，
進退觸藩之羊。
喫人家飯，
臥自家床。
雲騰致雨，
露結為霜。
玉線相投透針鼻，
錦絲不斷吐梭腸。
石女機停兮夜色向午，
木人路轉兮月影移央。

'''
verse_en = '''
The compass makes a circle, the square makes a square.
Called on, you act. Set aside, you go into hiding.
A slow bird flounders among the reeds.
a ram in the hedge, no forward, no back.
You eat the rice at someone else's house.
you sleep in your own bed.
Clouds climb and bring the rain,
dew gathers and turns to frost.
The jade thread meets its mark and slips through the needle's eye,
the brocade silk runs without a break from the shuttle's gut.
The stone woman's loom stops as the night nears its midpoint.
The wooden man rounds the bend, the moon's shadow slides to the center.
'''

pointer = '''
Jiufeng Daoqian was Shishuang's attendant, the same monk who refuses to be impressed by a death-on-command exit in case 96, and here a student probes him with a riddle frame. "Head" and "tail" stand for the start of practice and its finish, how you open a thing against how you close it out. The monk keeps trying to pull the two apart, head without tail, tail without head, and Jiufeng keeps declining the cut: a beginning that never follows through is worthless, a finish with no real start is full but has no strength in it. The line everyone waits for is the last. When head and tail finally line up, you brace for something to celebrate, and Jiufeng hands you descendants growing strong while no one in the inner room notices.
'''
