number = 74
slug = ""
title_zh = "法眼質名"
title_en = "Fayan on Names"

intro_zh = '''
富有萬德，蕩無纖塵。離一切相，即一切法。百尺竿頭進步，十方世界全身。且道：甚麼處得來？

'''
intro_en = '''
Rich with every virtue. Swept clean of the last speck of dust. Free of every form, right there in all things. Step forward at the top of the hundred-foot pole and your whole body is the world in all ten directions. So tell me, where did you get it?
'''

case_zh = '''
僧問法眼：「承教有言：『從無住本立一切法。』如何是無住本？」眼云：「形興未質，名起未名。」

'''
case_en = '''
A monk asked Fayan, "The teaching says, 'All things are established with non-abiding as their root.' What is this root of non-abiding?"

Fayan said, "A form takes shape before it has solidified. A name arises before it has named anything."
'''

verse_zh = '''
沒蹤跡，
斷消息。
白雲無根，
清風何色。
散乾蓋而非心，
持坤輿而有力。
洞千古之淵源，
造萬象之模則。
剎塵道會也，處處普賢；
樓閣門開也，
頭頭彌勒。

'''
verse_en = '''
No tracks.
No news.
White clouds, rootless.
What color is the clear wind?
It spreads across the canopy of heaven without a mind.
It has the strength to hold up the earth.
It reaches deep into the source of all the ages.
It casts the mold for the ten thousand things.
At gatherings of the Way in lands as countless as dust, everywhere is Samantabhadra.
The tower gate swings open,
and at every turn there's Maitreya.
'''

pointer = '''
Fayan Wenyi (885–958, Five Dynasties) founded one of the major Chan houses and was known for catching monks inside their own words. Here the monk quotes the Vimalakirti Sutra, that all things rest on a root that has no fixed place to settle, "the root of non-abiding," and he wants Fayan to point at that bottomless bottom. The trap is the wanting itself: he is fishing for a thing to grab, and the whole claim is that there is nothing to grab. So Fayan goes earlier than the question, shape shows up before there is anything solid to be shaped, a name lands before there is anything for it to name. Samantabhadra and Maitreya are two great bodhisattvas, and the tower in Hongzhi's verse is Maitreya's in the Flower Garland Sutra.
'''
