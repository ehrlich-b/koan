slug = ""
title_zh = "臺山婆子"
title_en = "The Old Woman of Mount Wutai"

intro_zh = '''
有收有放，干木隨身；能殺能活，權衝在手。塵勞魔外盡付指呼，大地山河皆成戲具。且道：是甚麼境界？

'''
intro_en = '''
Sometimes you reel them in, sometimes you let them run. A dry stick goes wherever you go. You can kill or bring to life, with the power in your own hands. The world's troubles, demons, and outsiders all answer to your call. The whole earth, its rivers and mountains, becomes a set of props. Tell me, what sort of realm is this?
'''

case_zh = '''
臺山路上有一婆子，凡有僧問：「臺山路向什麼處去？」婆云：「驀直去。」僧纔行，婆云：「好箇阿師，又恁麼去也。」僧舉似趙州，州云：「待，與勘過。」州亦如前問，至來日上堂云：「我為汝勘破婆子了也。」

'''
case_en = '''
There was an old woman on the road to Mount Wutai. Whenever a monk asked, "Which way to Mount Wutai?" she'd say, "Straight ahead." As soon as he set off she'd say, "There he goes, another fine priest off the same way as all the rest."

A monk told Zhaozhou about her. He said, "Wait. Let me go size her up." Zhaozhou went and asked the same question.

The next day he addressed the assembly. "I've seen through the old woman for you."
'''

verse_zh = '''
年老成精不謬傳，
趙州古佛嗣南泉。
枯龜喪命因圖象，
良駟追風累纏牽。
勘破了老婆禪，
說向人前不直錢。

'''
verse_en = '''
It's true what they say: grow old enough and you turn into a spirit.
Zhaozhou, the old buddha, is Nanquan's heir.
The tortoise dies because its shell is wanted for divination.
The fine horse races the wind, yet it ends snarled in its harness.
He saw clean through the old woman's Chan,
then said so out loud, and it wasn't worth a dime.
'''

pointer = '''
Mount Wutai was a major pilgrimage destination sacred to Manjushri, the bodhisattva of wisdom, so monks were forever trudging up the road toward it. An old woman stationed along the way has a routine: every monk asks the same tourist's question, she gives the same flat "straight ahead," then needles each one as he walks off, another fine priest going the same way as all the rest. She has their number. A monk reports her to Zhaozhou, the legendary old master, who says he will go check her out, the word meaning to size someone up and test what they are made of. He goes, asks the identical question, then announces he has seen through her. The Gateless Gate (case 31) says she gave him the identical answer too. So either he saw something they could not, or "seeing through her" is one more move in her own game, and the verse needles that even saying you've won this contest is not worth a dime.
'''
