number = 37
slug = ""
title_zh = "溈山業識"
title_en = "Guishan's Karmic Consciousness"

intro_zh = '''
驅耕夫之牛，拽迴鼻孔；奪飢人之食，把定咽喉。還有下得毒手者麼？

'''
intro_en = '''
Drive off the plowman's ox and pull it back by the nose. Snatch a hungry person's food and take hold of their throat. Anybody here got a hand cruel enough?
'''

case_zh = '''
溈山問仰山：「忽有人問：『一切眾生但有業識，茫茫無本可據』，子作麼生驗？」仰云：「若有僧來，即召云：『某甲。』僧迴首，乃云：『是甚麼？』待伊擬議，向道：『非唯業識茫茫，亦乃無本可據。』」溈云：「善哉。」

'''
case_en = '''
Guishan asked Yangshan, "Suppose someone says, 'All sentient beings have only karmic consciousness, a vast murk with no ground to rely on.' How would you test him?"

Yangshan said, "If a monk came, I'd call his name. When he turned his head I'd say, 'What is it?' I'd wait until he started to think it over and say, 'Karmic consciousness is a vast murk, and there's also no ground to rely on.'"

Guishan said, "Good."
'''

verse_zh = '''
一喚迴頭識我不？
依俙蘿月又成鉤。
千金之子纔流落，
漠漠窮途有許愁。

'''
verse_en = '''
One call and you turn your head. Do you recognize me?
Faint behind the vines, the moon hooks thin again.
A rich man's son has just fallen on hard times.
On the bleak road to nowhere, what grief he finds.
'''

pointer = '''
Guishan and Yangshan founded one of the early Chan houses, and this is shop talk between teacher and star pupil. "Karmic consciousness" is awareness shaped by past actions, the habits and impulses that can leave you on autopilot. It's the same term Zhaozhou uses for the dog in case 18. Yangshan's move is to catch the thing live rather than describe it: call a man's name, wait for him to turn his head, then ask what just happened and watch him start to think it over. The verse closes the loop with a rich man's son who falls on hard times and ends up wandering broke on a dead-end road. Where exactly is the ground he thinks he's standing on?
'''
