number = 71
slug = ""
title_zh = "翠巖眉毛"
title_en = "Cuiyan's Eyebrows"

intro_zh = '''
含血噴人，自污其口。貪柸一世償人債，賣紙三年欠鬼錢。萬松為諸人請益：還有擔干計處也無？

'''
intro_en = '''
Spit blood at someone and you foul your own mouth. Love the cup too much and you spend a lifetime paying other people back. Sell paper for three years and you still owe the ghosts money. Wansong asks on everyone's behalf: is there any way to shoulder the debt?
'''

case_zh = '''
翠巖夏末示眾云：「一夏以來，為兄弟說話，看翠巖眉毛在麼？」保福云：「作賊人心虛。」長慶云：「生也。」雲門云：「關。」

'''
case_en = '''
At the end of the summer retreat, Cuiyan said to the assembly, "All summer I've been talking to you brothers. Look, are Cuiyan's eyebrows still there?"

Baofu said, "A thief's heart is uneasy."

Changqing said, "They've grown."

Yunmen said, "Barrier."
'''

verse_zh = '''
作賊心，
過人膽。
歷歷縱橫對機感。
保福雲門，也垂鼻欺脣；
翠巖長慶，也脩眉映眼。
杜禪和，
有何限。
剛道：意句一齊剗。
埋沒自己，也飲氣吞聲；
帶累先宗，也面牆擔板。

'''
verse_en = '''
A thief's heart,
a daredevil's gall.
Clear and free, meeting whatever comes.
Baofu and Yunmen, noses hanging over their lips.
Cuiyan and Changqing: long brows shading the eyes.
These half-baked Zen hands,
is there any end to them?
They insist on cutting away words and meaning in one stroke.
Burying themselves, they swallow their breath and choke down the sound.
Dragging down the old school with them, they face a wall with a board on one shoulder.
'''

pointer = '''
A summer retreat is the three-month stretch when monks settle in one place and practice together. Old superstition held that if you talked too freely about the Dharma, explaining what cannot really be explained, your eyebrows would drop out, karma collecting on the spot. So Cuiyan, a student of Xuefeng, ends a whole summer of lecturing by asking the assembly to check: are my eyebrows still there? It is half a joke and half a dare. Did all that talk cost me, or did I get clean away with it? Three famous monks answer and none of them plays it straight. The intro's images all circle the same hook, foul your own mouth, owe debts you can never clear: open your teeth to teach and you are already on the line. Yunmen (864–949, Five Dynasties) ends it with one word, "Barrier," the word for a gate or checkpoint, slamming it across the whole question rather than walking through it. The Blue Cliff Record tells the same story in case 8.
'''
