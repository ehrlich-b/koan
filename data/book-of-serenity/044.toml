number = 44
slug = ""
title_zh = "興陽妙翅"
title_en = "Xingyang's Garuda"

intro_zh = '''
師子擊象，妙翅搏龍。飛走尚別君臣，衲僧合存賓主。且如冐犯天威底人，如何裁斷？

'''
intro_en = '''
A lion strikes an elephant. A garuda seizes a dragon. Even birds and beasts distinguish ruler and subject. A monk should keep track of host and guest. What judgment do you hand down on someone who defies the throne?
'''

case_zh = '''
僧問興陽剖和尚：「娑竭出海，乾坤靜；覿面相呈事若何？」師云：「妙翅鳥王當宇宙，箇中誰是出頭人？」僧云：「忽遇出頭時，又作麼生？」陽云：「似鶻捉鳩，君不覺；御樓前驗始知真。」僧云：「恁麼則叉手當胸，退身三步。」陽云：「須彌座下烏龜子，莫待重教點額痕。」

'''
case_en = '''
A monk asked Master Pou of Xingyang, "When Sagara leaves the sea, heaven and earth go still. What happens when he shows himself face to face?"

Xingyang said, "The garuda, king of the birds, rules the whole world. Who here will stick his head out?"

The monk said, "And if someone suddenly does stick his head out, what then?"

Xingyang said, "Like a falcon taking a dove, you'd never see it coming. Only after the test before the emperor's tower do you know what's genuine."

The monk said, "Then I'll fold my hands at my chest and step back three paces."

Xingyang said, "Little turtle under the Sumeru throne, don't wait for me to mark your forehead again."
'''

verse_zh = '''
絲綸降，
號令分。
寰中天子，
塞外將軍。
不待雷驚出蟄，
那知風遏行雲。
機底聯綿兮，自有金針玉線；
印前恢廓兮，元無鳥篆蟲文。

'''
verse_en = '''
The silk-spun decree comes down.
Orders go out in turn.
Within the realm, the emperor;
beyond the border, the general.
They emerge from their winter sleep without waiting to be startled by thunder.
How would they know the wind that stops the moving clouds?
The work goes on at the loom, with its own gold needle and jade thread.
Before the seal, wide open: no curling bird-script, no fancy insect-script at all.
'''

pointer = '''
This whole exchange runs on a mythical bestiary of power. The "great sea-dragon" is Sagara, a naga king, a storm-bringing serpent so vast the world holds its breath when it surfaces. The garuda is its natural predator, a giant bird that hunts dragons out of the sky. So the monk is boasting in code: what if some overwhelming, world-stopping force shows up at the gate? Master Pou of Xingyang plays the bigger animal, the garuda owns the whole sky, and dares the monk to actually be that force, to stick his head out and prove it. The monk folds his hands in a show of respect and takes three steps back, and Pou pounces on the retreat. His last jab rides the old Dragon Gate legend, where carp that leap the falls become dragons and the ones that strike the rocks can come away with a mark on their foreheads. Pou puts his turtle below a Sumeru throne, the raised seat of a Buddha. The verse holds up the real master, issuing commands like an emperor, needing no ornamental flourish to do it.
'''
