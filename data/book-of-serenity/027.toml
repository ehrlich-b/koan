number = 27
slug = ""
title_zh = "法眼指簾"
title_en = "Fayan Points at the Blind"

intro_zh = '''
師多脈亂，法出姦生。無病醫病，雖以傷慈；有條攀條，何妨舉話。

'''
intro_en = '''
Too many doctors and the pulse readings get muddled. Issue a law and cheats appear. Treat an illness where there is none, and your kindness does harm. If there's a branch to grab, grab it. What's the harm in bringing up a case?
'''

case_zh = '''
法眼以手指簾，時有二僧同去捲簾。眼云：「一得一失。」

'''
case_en = '''
Fayan pointed at the bamboo blind. Two monks went over together and rolled it up. Fayan said, "One got it, one missed."
'''

verse_zh = '''
松直棘曲鶴長𠒎短，
羲皇世人俱忘治亂。
其安也潛龍在淵，
其逸也翔鳥脫絆。
無何祖禰西來，
裏許得失相半。
蓬隨風而轉空，
舡截流而到岸。
箇中靈利衲僧，
看取清涼手段。

'''
verse_en = '''
Pines grow straight, brambles crooked, cranes stand on long legs, ducks on short.
In Fuxi's age people forgot all about order and disorder.
At rest, a dragon submerged in the depths.
At ease, a bird slips its tether and soars.
Out of nowhere the founding ancestor came from the West.
In there, gain and loss split down the middle.
The tumbleweed wheels through the air with the wind.
The boat cuts across the current and reaches the shore.
You sharp-witted monks in the thick of it,
watch how Qingliang handles it.
'''

pointer = '''
Fayan (885–958) was a major teacher of the Five Dynasties period, founder of the Fayan house; "the man from Qingliang" is just him, named for his temple. He points at a hanging bamboo blind, two monks go over together and roll it up, and he rules that one got it and one missed without saying which. The grading is what he is fishing for you to do. The verse stacks up pairs that nature never ranks, straight pines and crooked brambles, long-legged cranes and short-legged ducks, then takes you back to the age of the legendary ruler Fuxi, when people forgot about order and disorder. That sets the live question loose: where, if anywhere, does "one got it, one missed" actually live?
'''
