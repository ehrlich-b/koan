number = 11
slug = ""
title_zh = "雲門兩病"
title_en = "Yunmen's Two Sicknesses"

intro_zh = '''
無身人患疾，無手人合藥，無口人服食，無受人安樂。且道：膏肓之疾，如何調理？

'''
intro_en = '''
Someone with no body falls ill. Someone with no hands mixes the medicine. Someone with no mouth swallows it. Someone with no sensation is at ease. Tell me, how do you treat a sickness too deep for medicine to reach?
'''

case_zh = '''
雲門大師云：「光不透脫，有兩般病。一切處不明，面前有物，是一。透得一切法空，隱隱地似有箇物相似，亦是光不透脫。又法身亦有兩般病。得到法身，為法執不忘，已見猶存，墮在法身邊，是一。直饒透得，放過即不可，子細點檢將來，有甚麼氣息，亦是病。」

'''
case_en = '''
Master Yunmen said, "When the light doesn't pass freely through, there are two sicknesses. The first is when nothing is clear anywhere and there's something in front of you. Even after you see that all things are empty, there may still be a faint sense of something there. That's also the light failing to pass freely through.

"There are also two sicknesses of the Dharma body. The first is when you reach the Dharma body but still cling to the teaching. Your own view remains, and you fall to one side of the Dharma body. Even if you do get through, you can't let it pass. Look closely for the slightest trace. That too is a sickness."
'''

verse_zh = '''
森羅萬象許崢嶸，
透脫無方礙眼睛。
掃彼門庭誰有力，
隱人胸次自成情。
船橫野渡涵秋碧，
棹入蘆花照雪明。
串錦老漁懷就市，
飄飄一葉浪頭行。

'''
verse_en = '''
The myriad things can stand out sharp and tall.
Even breaking through every which way can get in your eye.
Who has the strength to sweep that gate and yard?
Hidden in the heart, it turns into attachment on its own.
A boat lies crosswise at the lonely ford, holding the autumn blue.
The oar dips through reed flowers, bright as lit snow.
The old fisherman strings his bright catch and heads for market.
Drifting, drifting, one leaf on the crest of a wave.
'''

pointer = '''
Yunmen is the tenth-century master, a Five Dynasties figure famous for blunt, surgical one-liners, and here he is diagnosing spiritual diseases. "Your light not breaking through" means your awareness still has not cleared; even after you have seen that things are empty, a faint residue lingers, a vague sense of something out there you have not seen past. Then the "dharma-body," the term for ultimate reality or your true nature, the prize everyone is chasing, turns out to carry two sicknesses of its own. You can reach it and cling to the teaching like a possession, your own view still parked at its edge. Even if you break through, Yunmen warns against letting the slightest trace slip by. The opening riddle about a man with no body falling ill and a man with no mouth swallowing medicine plants the same question up front: who exactly is the one getting cured?
'''
