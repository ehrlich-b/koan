number = 62
slug = ""
title_zh = "米胡悟否"
title_en = "Mihu's Question About Awakening"

intro_zh = '''
達磨第一義諦，梁武頭迷；淨名不二法門，文殊口過。還有入作分也無？

'''
intro_en = '''
Bodhidharma's ultimate truth, and Emperor Wu of Liang's head went fuzzy. At Vimalakirti's gate of nonduality, even Manjushri spoke out of turn. So is there any way in at all?
'''

case_zh = '''
米胡令僧問仰山：「今時人還假悟否？」山云：「悟即不無，爭奈落第二頭何？」僧迴，舉似米胡，胡深肯之。

'''
case_en = '''
Mihu sent a monk to ask Yangshan, "Do people these days still need to wake up?"

Yangshan said, "It's not that there's no awakening. But what can you do about falling into second place?"

The monk went back and reported this to Mihu, who gave it his deep approval.
'''

verse_zh = '''
第二頭分悟破迷，
快須撒手捨筌罤。
功兮未盡成駢拇，
智也難知覺噬臍。
兔老氷盤秋露泣，
鳥寒玉樹曉風凄。
持來大仰辨直假，
痕玷全無貴白珪。

'''
verse_en = '''
In second place, awakening breaks through delusion.
Quick, open your hands and drop the fish trap and the rabbit snare.
With the work still unfinished, what you've gained is a webbed toe.
Even sharp wits can barely see it. Then it's too late to gnaw your own navel.
The old rabbit on the icy moon weeps autumn dew.
A bird shivers in the jade tree, the dawn wind keening.
Bring it to great Yangshan, he'll sort the true from the false,
not a flaw, not a stain, a prized tablet of white jade.
'''

pointer = '''
Yangshan and Mihu are ninth-century Chan masters. Mihu sends a messenger with the loaded question of the whole tradition: do you still need to "wake up," have a sudden breakthrough, or is enlightenment already here and the striving beside the point? Say yes and you've turned awakening into a prize you chase and fall short of; say no and you've thrown out the practice. Yangshan grants that awakening is real and still calls it falling into "second place." The verse stacks images of things you don't need, a fish trap and a rabbit snare once they've done their job, and a webbed toe. Mihu gave Yangshan's answer deep approval.
'''
