number = 98
slug = ""
title_zh = "洞山常切"
title_en = "Dongshan on the Three Bodies"

intro_zh = '''
九峯截舌，追和石霜；曹山斫頭，不辜洞嶺。古人三寸得恁麼密，且為人手段在甚麼處？

'''
intro_en = '''
Jiufeng cuts off the tongue and carries on Shishuang's tune. Caoshan cuts off the head and does Dongshan justice. Such care the old masters took with three inches of tongue. Where does their skill in helping people lie?
'''

case_zh = '''
僧問洞山：「三身中，那身不墮諸數？」山云：「吾常于此切。」

'''
case_en = '''
A monk asked Dongshan, "Of the Buddha's three bodies, which one falls outside the count?"

Dongshan said, "I always take this to heart."
'''

verse_zh = '''
不入世，
未循緣，
劫壺空處有家傳。
白蘋風細秋江暮，
古岸舡歸一帶煙。

'''
verse_en = '''
He doesn't enter the world.
He hasn't followed conditions.
In the empty jar of an eon, the house has something to pass on.
White waterweed, thin wind, the autumn river at dusk.
A boat comes home to the old bank trailing a long ribbon of mist.
'''

pointer = '''
Buddhism gives a buddha "three bodies": the everyday human form, a glorified visionary form, and the formless truth-body, three ways of carving up what a buddha is. The monk's trap sits in the carving itself; he asks which body escapes being a category while the question crams everything into categories. Dongshan, the ninth-century Caodong founder, doesn't pick a body. He says he always takes this to heart, declining to name some item that floats above the labels. The closing verse gives us a plain autumn river at dusk, thin wind, a boat trailing mist. The intro uses the image of a severed tongue for the fidelity of Jiufeng, from case 96, to his old teacher Shishuang.
'''
