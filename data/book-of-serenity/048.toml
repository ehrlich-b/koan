number = 48
slug = ""
title_zh = "摩經不二"
title_en = "Vimalakirti's Silence"

intro_zh = '''
妙用無方，有下手不得處；辯才無礙，有開口不得時。龍牙如無手人行拳，夾山教無舌人解語。半路抽身底，是甚麼人？

'''
intro_en = '''
Subtle action can go any way, yet there is a place where you can't lay a hand on it. Eloquence has no obstruction, yet there is a time when you can't open your mouth. Longya is like a man without hands throwing punches. Jiashan teaches a man without a tongue to speak. Who is it that slips away halfway through?
'''

case_zh = '''
維摩詰問文殊師利：「何等是菩薩入不二法門？」文殊師利曰：「如我意者，於一切法無言無說，無示無識，離諸問答，是為入不二法門。」於是文殊師利問維摩詰言：「我等各自說已，仁者當說：何等是菩薩入不二法門？」維摩默然。

'''
case_en = '''
Vimalakirti asked Manjushri, "How does a bodhisattva enter the gate of nonduality?"

Manjushri said, "As I see it, with regard to all things there are no words, no explanations, no showing, and no knowing. Leave questions and answers behind. This is entering the gate of nonduality." Then he asked Vimalakirti, "We've each had our say. Now please tell us, how does a bodhisattva enter the gate of nonduality?"

Vimalakirti said nothing.
'''

verse_zh = '''
曼殊問疾老毘耶，
不二門開看作家。
珉表粹中誰賞鑒？
忘前失後莫咨嗟。
區區投璞兮楚庭臏士，
璨璨報珠兮隋城斷蛇。
休點破，
絕玼瑕，
俗氣渾無却較些。

'''
verse_en = '''
Manjushri visits the sick old man of Vaishali.
The gate of nonduality swings open, and a master shows his hand.
Common stone outside, pure jade within. Who can tell its worth?
Lose the start, drop the end, but don't stand there sighing.
The man at the court of Chu offered uncut jade and lost his feet.
The wounded snake of Sui paid back the kindness with a gleaming pearl.
Leave it without pointing it out.
The flaws are gone.
Free of every trace of worldliness, you come a little closer.
'''

pointer = '''
Vimalakirti is Buddhism's star layman, an ordinary householder who out-argues the greatest bodhisattvas. In the sutra a crowd of them takes turns defining "non-duality," the Buddhist term for getting past pairs of opposites like self and other, holy and ordinary. Manjushri, who stands for wisdom itself, says entering non-duality takes leaving all words behind, and of course he needed words to say so. Then he hands the question to Vimalakirti, the supposed master, who answers by going completely silent. Chan kept it as his "thunderous silence." The verse stacks old stories of treasure that looks like a plain rock or comes from a healed snake. Bian He brings his uncut jade to court in the introduction to case 2, and the Marquis of Sui gets a pearl from a snake he helps.
'''
