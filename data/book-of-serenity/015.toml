number = 15
slug = ""
title_zh = "仰山插鍬"
title_en = "Yangshan Plants His Spade"

intro_zh = '''
未語先知，謂之默論；不明自顯，謂之暗機。三門前合掌，兩廊下行道，有箇意度。中庭上作舞，後門外搖頭，又作麼生？

'''
intro_en = '''
Knowing before a word is spoken is called silent argument. Showing without spelling it out is called a hidden move. Press your palms together in front of the temple gate, or walk in procession under the two galleries: there's an intention there. What about dancing in the courtyard and shaking your head outside the back gate?
'''

case_zh = '''
溈山問仰山：「甚處來？」仰云：「田中來。」山云：「田中多少人？」仰插下鍬子，叉手而立。山云：「南山大有人刈茆。」仰拈鍬子便行。

'''
case_en = '''
Guishan asked Yangshan, "Where've you been?"
"Out in the fields," Yangshan said.
"How many people are out there?"
Yangshan stuck his spade in the ground, folded his hands, and stood there.
Guishan said, "There's a whole crowd cutting thatch on the south mountain."
Yangshan pulled up his spade and walked off.
'''

verse_zh = '''
老覺情多念子孫，
而今慚愧起家門。
是須記取南山語，
鏤骨銘肌共報恩。

'''
verse_en = '''
Growing old, there's so much affection for children and grandchildren.
Now, with gratitude, the household is raised again.
Be sure to remember the words about the south mountain.
Carve them in bone, brand them in skin, and repay the kindness together.
'''

pointer = '''
Guishan and Yangshan are teacher and student, and together the founders of the Guiyang house, one of Chan's five houses, so this is the family business, a master grooming his heir. The small talk about fieldwork and headcounts is a test wearing ordinary clothes: Guishan keeps lobbing plain questions to see whether Yangshan will get tangled in numbers and facts. Yangshan responds twice without a word, once by planting his spade and standing still, once by pulling it up and leaving. The trap sits in "how many people," which sounds like a request for a figure; what you want to watch is what Yangshan does before and after Guishan brings up the south mountain.
'''
