number = 68
slug = ""
title_zh = "夾山揮劍"
title_en = "Jiashan Swings the Sword"

intro_zh = '''
寰中天子勅，閫外將軍令。有時門頭得力，有時室內稱尊。且道：是甚麼人？

'''
intro_en = '''
Within the realm, the emperor issues decrees. Out in the field, the general gives orders. Sometimes the strength is at the front gate, sometimes the inner room takes precedence. So tell me, who is this?
'''

case_zh = '''
僧問夾山：「撥塵見佛時如何？」山云：「直須揮劍。若不揮劍，漁父棲巢。」僧舉問石霜：「撥塵見佛時如何？」霜云：「渠無國土，何處逢渠？」僧迴，舉似夾山。山上堂云：「門庭施設，不如老僧；入理深談，猶較石霜百步。」

'''
case_en = '''
A monk asked Jiashan, "What about when you sweep away the dust and see the Buddha?"

Jiashan said, "You have to swing the sword. If you don't, the fisherman will roost in a nest."

The monk put the same question to Shishuang. "What about when you sweep away the dust and see the Buddha?"

Shishuang said, "He has no country. Where would you meet him?"

The monk went back and told Jiashan. Jiashan took the teaching seat and said, "At setting up shop by the front gate, no one beats me. But at the deep talk that goes all the way into the truth, I'm still a hundred paces behind Shishuang."
'''

verse_zh = '''
拂牛劍氣洗兵威，
定亂歸功更是誰。
一旦氛埃清四海，
垂衣皇化自無為。

'''
verse_en = '''
The sword's gleam brushes the Ox in the sky, washing away the might of arms.
The chaos quelled, who's left to take the credit?
One morning the haze and dust clear across the four seas,
and the emperor lets his robes hang and transforms his realm without acting.
'''

pointer = '''
Jiashan and Shishuang are two ninth-century masters, and the monk is shopping one question to both. "Sweep away the dust and see the Buddha" is supposed to be the whole job: clear off your delusions and the truth stands revealed, so the monk thinks he is asking what comes after you arrive. The flaw is buried in the word "see," which smuggles in a Buddha sitting there to be found, a destination, a someone. Jiashan plays along but warns that you have to keep the blade moving; stop swinging the sword and you go soft, the fisherman ends up roosting in a nest. Shishuang cuts harder: he has no country, so where would you ever meet him. Jiashan, hearing that, openly tips his hat, unbeaten at running a room, a hundred paces back on the cut that goes all the way down.
'''
