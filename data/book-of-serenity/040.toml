number = 40
slug = ""
title_zh = "雲門白黑"
title_en = "Yunmen's Black and White"

intro_zh = '''
機輪轉處，智眼猶迷；寶鑑開時，纖塵不度。開拳不落地，應物善知時。兩刃相逢時，如何迴互？

'''
intro_en = '''
Where the wheel of action turns, even the eye of wisdom gets lost. When the precious mirror is uncovered, not a speck of dust gets through. Open your fist and nothing falls. Meet what comes and know the right moment. When two blades meet, how do they give each other room?
'''

case_zh = '''
雲門問乾峯：「請師答話。」峯云：「到老僧也未？」門云：「恁麼別某甲在遲也。」峯云：「恁麼那？恁麼那？」門云：「將謂侯白，更有侯黑。」

'''
case_en = '''
Yunmen said to Qianfeng, "Master, please give an answer."
Qianfeng said, "Have you reached this old monk yet?"
Yunmen said, "In that case, you're late in recognizing me."
Qianfeng said, "Is that so? Is that so?"
Yunmen said, "I thought there was only a Hou Bai. It turns out there's a Hou Hei too."
'''

verse_zh = '''
弦筈相𠾑，
網珠相對。
發百中而箭箭不虛，
攝眾景而光光無礙。
得言句之總持，
住游戲之三昧。
妙其間也，宛轉偏圓；
必如是也，縱橫自在。

'''
verse_en = '''
Bowstring fits the notch of the arrow.
Jewels in the net face each other.
A hundred arrows hit, every shot counts.
All the scenery gathered, light through light, nothing blocked.
He has the knack of holding whole words and phrases.
He dwells in the samadhi of play.
The wonder between them turns freely through part and whole.
It can only be this way, free and clear, every which way.
'''

pointer = '''
Yunmen (864–949, Five Dynasties) and Qianfeng are sparring, and the weapons are words. Yunmen opens by asking for an answer; Qianfeng parries by asking whether Yunmen has even reached him yet. They trade thrusts, each refusing to be pinned or to play the lesser man. The payoff is the last line. Hou Bai was a famous wit, and his name literally reads "Hou White," so Yunmen comes back with a second wit called "Hou Black." It is a backhanded salute, one sharp operator tipping his hat to another. The verse just admires two people who can volley like this with neither one's footing slipping. Its jewels are from Indra's net, where every jewel reflects all the others.
'''
