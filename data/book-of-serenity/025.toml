number = 25
slug = ""
title_zh = "鹽官犀扇"
title_en = "Yanguan's Rhino Fan"

intro_zh = '''
剎海無涯，不離當處；塵劫前事，盡在而今。試教伊覿面相呈，便不解當風拈出。且道：過在什麼處？

'''
intro_en = '''
The ocean of worlds has no shore, yet it never leaves this spot. What happened eons ago, as many eons as specks of dust, is all here now. Have it come right up and show its face and you still won't know how to pick it out in the wind. Tell me, where's the mistake?
'''

case_zh = '''
鹽官一日喚侍者：「與我過犀牛扇子來。」者云：「扇子破也。」官云：「扇子既破，還我犀牛兒來。」者無對。資福畫一圓相，於中書一牛字。

'''
case_en = '''
One day Yanguan called to his attendant, "Bring me the rhino-horn fan."

The attendant said, "The fan's broken."

Yanguan said, "So the fan's broken. Give me back the rhino."

The attendant had nothing to say.

Zifu drew a circle and wrote the character for "ox" inside it.
'''

verse_zh = '''
扇子破索犀牛，
棬攣中字有來由。
誰知桂轂千年魄，
妙作通明一點秋。

'''
verse_en = '''
The fan breaks, and he asks for the rhino.
There's a reason for the character inside the circle.
Who knows the age-old spirit of the cassia moon,
making a single clear point of autumn light?
'''

pointer = '''
Yanguan is a Tang master, an heir of Mazu; the attendant is his student. A rhino-horn fan is a real object, a fan fitted with rhinoceros horn, the sort of fine thing a teacher might own. When the student reports it broken, Yanguan springs the trap, "then bring me the rhino," asking for the animal when the object made from its horn is no good. The student freezes, because the demand sounds impossible. Later another teacher, Zifu, answers without speaking: he draws a circle, a stock Chan emblem for the whole, complete thing, and writes "ox" inside it, just one of the two characters in the Chinese word for rhinoceros. The same drawing turns up among several replies in the Blue Cliff Record (case 91).
'''
