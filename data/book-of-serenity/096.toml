number = 96
slug = ""
title_zh = "九峯不肯"
title_en = "Jiufeng Won't Buy It"

intro_zh = '''
雲居不憑戒珠舍利，九峯不愛坐脫立亡，牛頭不要百鳥㗸花，黃蘗不羨浮柸渡水。且道：別有何長處？

'''
intro_en = '''
Yunju didn't rely on relic pearls. Jiufeng wasn't impressed by dying on cue, sitting or standing. Niutou had no use for birds bringing flowers in their beaks. Huangbo didn't envy crossing the water on a floating cup. Tell me, what other strengths did they have?
'''

case_zh = '''
九峯在石霜作侍者。霜遷化後，眾欲請堂中首座接續住持。峯不肯，乃云：「待某甲問過。若會先師意，如先師侍奉。」遂問：「先師道：『休去歇去，一念萬年去，寒灰枯木去，一條白練去。』且道明甚麼邊事？」座云：「明一色邊事。」峯云：「恁麼則未會先師意在。」座云：「爾不肯我？那裝香來。」座乃焚香云：「我若不會先師意，香煙起處脫去不得。」言訖，便坐脫。峯乃撫其背云：「坐脫立亡則不無，先師意未夢見在。」

'''
case_en = '''
Jiufeng was Shishuang's attendant. When Shishuang died, the assembly wanted the head monk to succeed him as abbot. Jiufeng wouldn't have it. "Let me ask him a question first. If he understands our late teacher's meaning, I'll serve him as I served the teacher."

He asked, "Our late teacher said, 'Stop and rest. One thought for ten thousand years. Cold ashes and a dead tree. One strip of white silk.' Tell me, what was he pointing at?"

The head monk said, "He was showing us the realm of one color."

Jiufeng said, "Then you haven't understood our late teacher."

"You don't accept me? Bring some incense." The head monk lit it and said, "If I haven't understood our late teacher's meaning, I won't be able to die as the smoke goes up." He finished speaking and died sitting upright.

Jiufeng patted him on the back. "Dying seated or standing, that much you can do. But the late master's meaning you haven't seen even in a dream."
'''

verse_zh = '''
石霜一宗，
親傳九峯。
香煙脫去，
正脈難通。
月巢鶴作千年夢，
雪屋人迷一色功。
坐斷十方猶點額，
密移一步看飛龍。

'''
verse_en = '''
One line from Shishuang,
handed straight to Jiufeng.
In the incense smoke he slipped away.
The true line is hard to pass on.
A crane in its moonlit nest dreams for a thousand years.
Snowed into his house, a man is lost in 'all one color.'
Sit and shut off all ten directions, and you still bump your head.
Step quietly to one side, and watch the dragon fly.
'''

pointer = '''
In old Chan circles, dying on command, sitting upright or standing and just releasing the body, was the showpiece feat, taken as proof you had mastered something. This story detonates that. Shishuang, a famous teacher, had left a string of phrases, "cold ashes, a dead tree, one strip of white silk," that sound like the destination: shut it all down, go blank and still. The head monk reads them at face value as the realm where everything melts into one undifferentiated color, and to prove the reading he lights incense and drops dead as the smoke rises, which is impressive by any measure. Shishuang's attendant Jiufeng won't buy it, however spectacular the exit. The verse ends with one quiet step and a dragon taking flight. The intro stacks up other masters who shrugged off such marvels, holy relics and birds bearing flowers.
'''
