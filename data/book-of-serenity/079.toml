number = 79
slug = ""
title_zh = "長沙進步"
title_en = "Changsha's Hundred-Foot Pole"

intro_zh = '''
金沙灘頭馬郎婦，別是精神；瑠璃瓶裏擣𩝐餻，誰敢轉動？不入驚人浪，難逢稱意魚。寬行大步，一句作麼生？

'''
intro_en = '''
Ma's wife on the Golden Sands has a spirit all her own. Pound a rice cake in a glass bottle, and who dares move it? Stay clear of the terrifying waves and you'll have a hard time landing the fish you're after. Stride out, take the big step. What's the one line that does it?
'''

case_zh = '''
長沙令僧問會和尚：「未見南泉時如何？」會良久。僧云：「見後如何？」會云：「不可別有也。」僧迴，舉似沙。沙云：「百尺竿頭坐底人，雖然得入，未為真。百尺竿頭須進步，十方世界是全身。」僧云：「百尺竿頭如何進步？」沙云：「朗州山，澧州水。」僧云：「不會。」沙云：「四海五湖王化裏。」

'''
case_en = '''
Changsha sent a monk to ask Master Hui, "How was it before you met Nanquan?"

Hui sat there a long time, saying nothing.

"And after you met him?" the monk asked.

Hui said, "There can't be anything more to it."

The monk went back and told Changsha.

Changsha said, "The person sitting at the top of a hundred-foot pole has found a way in, sure, but it isn't the real thing yet. At the top of a hundred-foot pole, you must step forward. The world in all ten directions is your whole body."

The monk asked, "How do you step forward from the top of a hundred-foot pole?"

Changsha said, "The mountains of Langzhou, the waters of Lizhou."

The monk said, "I don't get it."

Changsha said, "The four seas, the five lakes, all under the king's rule."
'''

verse_zh = '''
玉人夢破一聲雞，
轉盻生涯色色齊。
有信風雷催出蟄，
無言桃李自成蹊。
及時節，力耕犁，
誰怕春疇沒脛泥。

'''
verse_en = '''
A single rooster's cry breaks the beauty's dream.
She turns to look, and everything in her life is in order.
Wind and thunder keep their promise, stirring the sleepers from their dens.
Peach and plum say nothing, yet the path wears itself beneath them.
When the season comes, lean into the plow.
Who fears the spring fields, mud up to the shins?
'''

pointer = '''
"The top of a hundred-foot pole" was already a worn stock phrase: you have climbed as high as practice goes, mastered it, reached the limit. Treating that summit as the finish line is exactly the snag. Master Hui demonstrates the snag by going silent and then saying there is nothing more to it, and Changsha calls that not yet the real thing: the man sitting satisfied up top still has to step off into open air. Asked how, Changsha gives no technique, only the mountains of Langzhou and the waters of Lizhou, two districts in what's now Hunan, and then the whole realm under one rule. The Gateless Gate asks about the same step in case 46, where it puts the question in Shishuang's mouth. The verse turns this into spring fields and a plow, work you lean into with mud to your shins.
'''
