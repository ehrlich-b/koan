number = 43
slug = ""
title_zh = "羅山起滅"
title_en = "Luoshan on Arising and Ceasing"

intro_zh = '''
還丹一粒，點鐵成金；至理一言，轉凡成聖。若知金鐵無二，凡聖本同，果然一點，也用不著。且道：是那一點？

'''
intro_en = '''
One grain of the elixir turns iron to gold. One word of the deepest truth turns an ordinary person into a sage. If you know gold and iron are one and ordinary people and sages are alike to begin with, even that one touch is no use. Tell me, which touch is that?
'''

case_zh = '''
羅山問巖頭：「起滅不停時如何？」頭咄云：「是誰起滅？」

'''
case_en = '''
Luoshan asked Yantou, "When arising and ceasing never stop, what then?"

Yantou barked, "Who is arising and ceasing?"
'''

verse_zh = '''
斫斷老葛藤，
打破狐窠窟。
豹披霧而變文，
龍乘雷而換骨。
咄！
起滅紛紛是何物？

'''
verse_en = '''
Hack through the old tangled vines.
Smash the fox's den.
The leopard wraps itself in mist and changes its markings.
The dragon rides the thunder and trades its bones.
Bah!
What is all this arising and ceasing?
'''

pointer = '''
Luoshan and Yantou are two Chan masters, and "arising and ceasing" is Buddhist language for how things come and go, from a passing thought to a whole life. Luoshan asks the meditator's natural question: how do I cope with this constant flicker? Inside the question he has already granted two things, that the churn is solidly real and that he's its helpless victim, and that pair is the trap. Yantou skips the how entirely and pulls the floor out, barking "Who is arising and ceasing?" The verse hacks the tangled vines and smashes the fox-den before asking what all that arising and ceasing is.
'''
