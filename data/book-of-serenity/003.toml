number = 3
slug = ""
title_zh = "東印請祖"
title_en = "The Patriarch Reads No Sutras"

intro_zh = '''
劫前未兆之機，烏龜向火；教外別傳一句，碓嘴生花。且道：還有受持讀誦分也無？

'''
intro_en = '''
The workings give no sign before the first age begins: a turtle warming itself by the fire. A single line handed down outside the teachings: flowers bloom from a stone pestle. Tell me, can you take it up, keep it, read it, recite it?
'''

case_zh = '''
東印土國王，請二十七祖般若多羅齊。王問曰：「何不看經？」祖云：「貧道入息不居陰界，出息不涉眾緣，常轉如是經，百千萬億卷。」

'''
case_en = '''
The king of eastern India invited Prajnatara, the twenty-seventh patriarch, to a meal. The king asked, "Why don't you read the sutras?"

The patriarch said, "Breathing in, I don't dwell among the aggregates or the fields of experience. Breathing out, I don't get caught up in conditions. I'm always turning this sutra, a hundred thousand million scrolls of it."
'''

verse_zh = '''
雲犀玩月璨含輝，
木馬游春駿不羈。
眉底一雙寒碧眼，
看經那到透牛皮。
明白心起曠劫，
英雄力破重圍。
妙圓樞口轉靈機，
寒山忘却來時路，
拾得相將携手歸。

'''
verse_en = '''
The cloud rhino gazes at the moon, bright with its glow.
The wooden horse roams through spring, a steed no rein can hold.
Beneath the brows, a pair of cool blue-green eyes.
How could reading sutras ever see through oxhide?
A clear mind dawns across vast ages.
A hero's strength breaks through ring after ring.
At the subtle, perfect pivot, the living mechanism turns.
Hanshan forgets the road that brought him here,
Shide joins him and they go home hand in hand.
'''

pointer = '''
This one reaches back to the Indian roots of the lineage, before Chan ever arrived in China. A "patriarch" is just an official lineage-holder; Prajnatara is counted as the twenty-seventh, the teacher who would pass the transmission to Bodhidharma, the man who carried it east. Sutras are the recorded scriptures, and monks were expected to read and chant them, so the king's question carries a faint needle: why are you skipping the homework? Prajnatara turns the word "sutra" inside out. He calls what he's doing a recitation, and the only thing he describes is how he breathes, never dwelling among the aggregates or fields of experience, the Buddhist categories for what makes up a person and their world. Hanshan and Shide, the two laughing eccentrics who close the verse, are the tradition's patron saints of people who wander off grinning.
'''
