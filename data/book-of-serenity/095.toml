number = 95
slug = ""
title_zh = "臨濟一畫"
title_en = "Linji's One Stroke"

intro_zh = '''
佛來也打，魔來也打。有理三十，無理三十。為復是錯認怨讐？為復是不分良善？試道看。

'''
intro_en = '''
Buddha walks in? Hit him. A demon walks in? Hit him. In the right, thirty blows. In the wrong, thirty blows. Is he mistaking people for enemies? Or can't he tell who's good? Try saying which.
'''

case_zh = '''
臨濟問院主：「甚處來？」主云：「州中糶黃米來。」濟云：「糶得盡麼？」主云：「糶得盡。」濟以拄杖一畫，云：「還糶得這箇麼？」主便喝。濟便打。次典座至，舉前話。座云：「院主不會和尚意。」濟云：「爾又作麼生？」座便禮拜。濟亦打。

'''
case_en = '''
Linji asked the temple manager, "Where've you been?"

"Down in town, selling yellow millet."

"Sell all of it?"

"Every grain."

Linji made a single stroke with his staff. "Can you sell this?"

The manager shouted.

Linji hit him.

Next the head cook came in, and Linji ran the story by him.

"The manager missed your point," the cook said.

"And you?" said Linji.

The cook bowed.

Linji hit him too.
'''

verse_zh = '''
臨濟全機格調高，
棒頭有眼辨秋毫。
掃除狐兔家風峻，
變化魚龍電火燒。
活人劍，
殺人刀，
倚天照雪利吹毛。
一等令行滋味別，
十分痛處是誰遭。

'''
verse_en = '''
Linji at full pitch, his style set high.
An eye at the tip of the staff picks out the finest hair.
He sweeps out foxes and hares, the house style fierce.
Fish and dragons change in a blaze of lightning.
A sword that gives life.
A blade that takes it.
Leaned against the sky, bright as snow, keen enough to cut a hair blown against it.
The same order goes out, but it tastes different.
Where it hurts the most, who's the one who takes it?
'''

pointer = '''
Linji (died 866) was the master famous for hitting and shouting students out of their heads instead of explaining; case 86 tells how he came by that method. Here the temple manager returns from a routine errand, selling yellow millet in town, feeling competent about it, every grain gone. Linji makes a single stroke with his staff and asks, can you sell this? The manager shouts, the sort of shout Linji himself is famous for, and gets hit; the cook tries the opposite tack, a respectful bow, and gets hit too. The bind is assuming there is a correct move to find. The intro puts it at thirty blows for right and thirty for wrong.
'''
