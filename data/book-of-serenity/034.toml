number = 34
slug = ""
title_zh = "風穴一塵"
title_en = "Fengxue's Speck of Dust"

intro_zh = '''
赤手空拳，千變萬化。雖是將無作有，奈何弄假像真。且道：還有基本也無？

'''
intro_en = '''
Bare hands, empty fists, thousands upon thousands of transformations. Making something from nothing is one thing. What do you do when the imitation looks real? So tell me: is there anything solid underneath?
'''

case_zh = '''
風穴垂語云：「若立一塵，家國興盛；不立一塵，家國喪亡。」雪竇拈拄杖云：「還有同死同生底衲僧麼？」

'''
case_en = '''
Fengxue said to the assembly, "Set up a single speck of dust and the household and country flourish. Set up no speck of dust and the household and country perish."
Xuedou held up his staff. "Are there any monks here who can die together and live together?"
'''

verse_zh = '''
皤然渭水起垂綸，
何似首陽清餓人。
只在一塵分變態，
高名、勳業，兩難珉。

'''
verse_en = '''
White-haired by the Wei River, he gets up to let down his line.
How does he compare with the man who kept his name clean and starved on Mount Shouyang?
A single speck of dust makes the difference in how things go.
A great name and great deeds: neither is common stone.
'''

pointer = '''
Fengxue states the whole game in one image: raise a single speck of dust and the nation flourishes, as does the household; leave it unraised and both fall. The two sides in the verse are stock Chinese opposites: Jiang Taigong, a white-haired minister who fished by the Wei River until a king came begging him to govern, and the brothers Boyi and Shuqi of Mount Shouyang who refused to serve the new Zhou dynasty Jiang helped found and starved rather than compromise. Xuedou cuts past the whole comparison with his question, which is the live edge of the case. He asks if anyone in the room can share life and death.
'''
