number = 9
slug = ""
title_zh = "南泉斬猫"
title_en = "Nanquan Kills the Cat"

intro_zh = '''
踢翻滄海，大地塵飛；喝散白雲，虛空粉碎。嚴行正令，猶是半提；大用全彰，如何施設？

'''
intro_en = '''
Kick the ocean over and dust storms sweep the earth. Shout the white clouds apart and the empty sky shatters. Even enforcing the law to the letter is only half the work. When the full power breaks into the open, how do you handle it?
'''

case_zh = '''
南泉一日，東西兩堂爭猫兒。南泉見，遂提起云：「道得即不斬。」眾無對，泉斬却猫兒為兩段。泉復舉前話問趙州，州便脫草鞋，於頭上戴出。泉云：「子若在，恰救得猫兒。」

'''
case_en = '''
One day the monks of the east and west halls were fighting over a cat. Nanquan saw them, picked up the cat, and said, "If you can say it, I won't cut it." No one answered. Nanquan cut the cat in two. Later Nanquan put the matter to Zhaozhou, who took off his straw sandals, put them on his head, and walked out. Nanquan said, "If you'd been there, you'd have saved the cat."
'''

verse_zh = '''
兩堂雲水盡紛拏，
王老師能驗正邪。
利刀斬斷俱亡像，
千古令人愛作家。
此道未喪，
知音可嘉。
鑿山透海兮唯尊大禹，
鍊石補天兮獨賢女媧。
趙州老有生涯，
草鞋頭戴較些些。
異中來也還明鑒，
只箇真金不混沙。

'''
verse_en = '''
The monks of both halls are snarled in a quarrel.
Old Master Wang can tell the genuine from the false.
A sharp blade cuts through, and both forms vanish.
A thousand years on, people still love a master at work.
This way has yet to die out.
A listener who knows the tune deserves praise.
Only Yu the Great could cut through mountains to reach the sea.
Only Nuwa could smelt stones to mend the sky.
Old Zhaozhou knows how to make his way.
Straw sandals on his head get him a little closer.
He comes from a strange quarter, yet there's a clear mirror.
pure gold, never mixed with sand.
'''

pointer = '''
Nanquan is a famous Tang master; the verse calls him "Old Master Wang" after his lay surname. Two groups of his monks are squabbling over a cat, exactly the petty attachment a Zen monk is supposed to have outgrown. He snatches it up and gives them one chance: say something real, right now, and it lives. Silence, so he kills it, cutting it in two. Later he puts the matter to his sharpest student Zhaozhou; Zhaozhou says nothing, sets his straw sandals on his head, and walks out. Nanquan says it would have saved the cat. You meet this case again in the Gateless Gate (case 14) and across two cases in the Blue Cliff Record (63 and 64), where the cooler telling here lets you sit longer with the gap between freezing up and answering freely.
'''
