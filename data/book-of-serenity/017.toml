number = 17
slug = ""
title_zh = "法眼毫釐"
title_en = "Fayan's Hair's Breadth"

intro_zh = '''
一雙孤雁，搏地高飛；一對鴛鴦，池邊獨立。箭鋒相拄則且致，鋸解秤錘時如何？

'''
intro_en = '''
Two lone geese beat up from the ground and fly high. A pair of mandarin ducks stands apart by the pond. Leave aside two arrowheads meeting in midair. What happens when you saw a steelyard weight in two?
'''

case_zh = '''
法眼問脩山主：「毫厘有差，天地懸隔，汝作麼生會？」脩云：「毫厘有差，天地懸隔。」眼云：「恁麼又爭得？」脩云：「某甲只如此，和尚又如何？」眼云：「毫厘有差，天地懸隔。」脩便禮拜。

'''
case_en = '''
Fayan asked Master Xiu, "A hair's breadth off, and heaven and earth split apart. How do you understand that?"

Xiu said, "A hair's breadth off, and heaven and earth split apart."

Fayan said, "How's that supposed to do?"

Xiu said, "That's how I see it. And you?"

Fayan said, "A hair's breadth off, and heaven and earth split apart."

Xiu bowed.
'''

verse_zh = '''
秤頭蠅坐便欹傾，
萬世權衡照不平。
斤兩錙銖見端的，
終歸輸我定盤星。

'''
verse_en = '''
A fly settles on the balance beam, and it tips.
For ten thousand ages the scales have shown what's out of balance.
From whole pounds down to the tiniest weights, they give the exact measure.
in the end they all answer to my zero mark.
'''

pointer = '''
Fayan is the tenth-century master who founded the last of Chan's five houses, a Five Dynasties figure; "Master Xiu" is the monk who asks Dizang about the three realms in case 12. Fayan opens with a famous line, miss by a hair and heaven and earth split apart, and asks Xiu to explain it. Xiu repeats the line back, word for word. Fayan needles him, parroting is not understanding, and Xiu holds his ground and turns it around: fine, you say it. Fayan says the exact same words, and now Xiu bows. The verse runs on an old steelyard balance, where a fly's weight tips the beam and scales have been showing what's out of balance for ages, yet the zero mark, the fixed point you calibrate against, is what everything finally answers to.
'''
