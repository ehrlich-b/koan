number = 58
slug = ""
title_zh = "剛經輕賤"
title_en = "Scorn in the Diamond Sutra"

intro_zh = '''
依經解義，三世佛冤；離經一字，返同魔說。因不收，果不入底人，還受業報也無？

'''
intro_en = '''
Rely on the sutras to explain their meaning and you wrong the buddhas of past, present, and future. Stray from so much as one word and you might as well be speaking for a demon. Is someone whom neither cause nor effect can touch still hit with the consequences of what they've done?
'''

case_zh = '''
金剛經云：「若為人輕賤，是人先世罪業應墮惡道，以今世人輕賤故，先世罪業則為消滅。」

'''
case_en = '''
The Diamond Sutra says, "If people treat such a person with contempt, that person's misdeeds in past lives should have led to a miserable rebirth. But because they are treated with contempt in this life, the bad karma from those past lives is wiped away."
'''

verse_zh = '''
綴綴功過，
膠膠因果。
鏡外狂奔演若多，
杖頭擊著破竈墮。
竈墮破，
來相賀，
却道：從前辜負我。

'''
verse_en = '''
Merits and faults, stitched in a tangle.
Cause and effect, glued fast.
Yajnadatta runs wild outside the mirror.
One whack of the staff, and the stove breaks and falls.
The stove fallen, the stove broken,
someone comes to offer congratulations,
then says, "All along you've let me down."
'''

pointer = '''
The Diamond Sutra is one of Buddhism's most famous scriptures, and this case lifts a line that lands like a paradox: getting insulted can burn off bad karma carried from past lives if you're someone who recites the sutra. The verse piles on two stories. Yajnadatta is the man in an old tale who looked in a mirror, panicked that he'd lost his own head, and ran around frantically searching for the head sitting on his shoulders the whole time, the classic picture of chasing what you already have. The stove comes from a Chan story where a teacher known as Stove-Smashing Duo struck a stove-shrine with his staff, and the freed spirit showed up to thank him. Lay those beside the sutra line and the snare appears: if scorn cancels your debt, then whoever scorns you did you a favor, so do you bow in thanks or curse the abuse? The last line catches the trap snapping shut, someone shows up with congratulations and then wheels around with a complaint.
'''
