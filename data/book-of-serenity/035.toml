number = 35
slug = ""
title_zh = "洛浦伏膺"
title_en = "Luopu Takes It to Heart"

intro_zh = '''
迅機捷辯，折衝外道天魔；逸格超宗，曲為上根利智。忽遇箇一棒打不迴頭底漢，時如何？

'''
intro_en = '''
Quick moves and ready speech can turn back outsiders and heavenly demons. Going beyond the usual rules and the school's ways is a concession to the sharpest students. What happens when you run into someone who won't turn his head at a blow from the staff?
'''

case_zh = '''
洛浦參夾山，不禮拜，當面而立。山云：「鷄棲鳳巢，非其同類，出去！」浦云：「自遠趨風，乞師一接。」山云：「目前無闍梨，此間無老僧。」浦便喝。山云：「住，住！且莫草草怱怱。雲月是同，溪山各異。截斷天下人舌頭，即不無；爭教無舌人解語？」浦無語，山便打。浦從此伏膺。

'''
case_en = '''
Luopu went to see Jiashan. He didn't bow. He just stood there, facing him.

Jiashan said, "A chicken roosting in a phoenix's nest. You don't belong here. Get out."

Luopu said, "I've come a long way on the strength of your reputation. Please, master, take me in."

Jiashan said, "There's no reverend in front of me, and no old monk here."

Luopu shouted.

Jiashan said, "Wait, wait. Don't be in such a rush. The clouds and moon are the same, but the streams and mountains differ. You can cut off every tongue under heaven, sure. How do you get a man without a tongue to speak?"

Luopu had nothing to say.

Jiashan hit him. From then on Luopu took his teaching to heart.
'''

verse_zh = '''
搖頭擺尾赤梢鱗，
徹底無依解轉身。
截斷舌頭饒有術，
拽迴鼻孔妙通神。
夜明簾外兮風月如晝，
枯木巖前兮花卉常春。
無舌人，無舌人，
正令全提一句親。
獨步寰中明了了，
任從天下樂欣欣。

'''
verse_en = '''
Head tossing, tail lashing, a red-tailed fish.
Nothing beneath it to lean on, yet it knows how to turn.
Granted, there's a trick to cutting off tongues.
To pull someone back by the nose takes a marvelous touch.
Outside the screen at night, wind and moon, light as day.
Before Dead Tree Crag, flowers are always in spring.
A man with no tongue, a man with no tongue.
The whole command comes through in a single word.
He walks the world alone, utterly clear.
He lets everyone under heaven go on rejoicing.
'''

pointer = '''
Ninth-century China, two masters. Luopu arrives at Jiashan's place cocky enough to skip the bow and just stand there. The opening jabs are routine sparring: Jiashan tests him with insults, Luopu volleys back, then lets out a "shout," a wordless yell familiar from teachers like Linji. Then Jiashan flips the floor. He grants that the kid is sharp enough to silence anyone, and asks the real thing: anybody can shut people up, but can you make a man with no tongue speak? Luopu has nothing. He takes the blow and drops the swagger. The verse keeps returning to that tongueless man after the case has left him without a word.
'''
