number = 91
slug = ""
title_zh = "南泉牡丹"
title_en = "Nanquan's Peony"

intro_zh = '''
仰山以夢中為實，南泉指覺處為虛。若知覺夢元無，始信虛實絕待。且道：斯人具甚麼眼？

'''
intro_en = '''
Yangshan takes the dream for the real thing. Nanquan points at the waking world and calls it empty. Only when you see that waking and dreaming have no footing to begin with can you trust that real and unreal are past comparison. So tell me, what kind of eye does such a person have?
'''

case_zh = '''
南泉因陸亘大夫云：「肇法師也甚奇特，解道『天地同根，萬物一體』。」泉指庭前牡丹云：「大夫，時人見此一株花，如夢相似。」

'''
case_en = '''
The official Lu Gen said to Nanquan, "Master Sengzhao was really something. He could say, 'Heaven and earth share one root. All things are one body.'"

Nanquan pointed to a peony blooming in the courtyard. "Sir, people these days see this one blossom as if in a dream."
'''

verse_zh = '''
照徹離微造化根，
紛紛出沒見其門。
游神劫外問何有，
著眼身前知妙存。
虎嘯蕭蕭巖吹作，
龍吟冉冉洞雲昏。
南泉點破時人夢，
要識堂堂補處尊。

'''
verse_en = '''
Light reaches through the subtlest things to the root of creation.
Things come and go in a throng, and you see the gate.
Let the mind roam beyond the eons and ask what's there.
Look right in front of you and know that the marvel is here.
A tiger roars, and the wind rises from the cliffs.
A dragon murmurs, and the slow clouds darken the cave.
Nanquan breaks open everyone's dream,
He wants you to recognize the next Buddha, standing plain in view.
'''

pointer = '''
Lu Gen is a senior official and a committed Buddhist student; he is quoting a famous line by Sengzhao, the brilliant fourth-to-fifth-century monk, on how heaven and earth share one root and all things are a single body. It is a soaring idea, and Lu is plainly pleased to have it ready on his tongue. Nanquan doesn't argue the metaphysics. He points at an actual peony in the courtyard and says people look at a flower like this as if in a dream. Set beside the previous case (90), the pairing turns over: there Yangshan preaches in a dream, here Nanquan brings up dreaming in front of a flower.
'''
