number = 38
slug = ""
title_zh = "臨濟真人"
title_en = "Linji's True Person"

intro_zh = '''
以賊為子，認奴作郎。破木杓豈是先祖髑髏？驢鞍鞽亦非阿爺下頷。裂土分茅時，如何辨主？

'''
intro_en = '''
You take a thief for your son and a servant for the young master. Could a broken wooden ladle be an ancestor's skull? A donkey's saddle bow can hardly be your father's jaw. When they divide up the land and confer the titles, how do you tell who the lord is?
'''

case_zh = '''
臨濟示眾云：「有一無位真人，常向汝等面門出入。初心未證據者，看！看！」時有僧問：「如何是無位真人？」濟下禪床，擒住這僧，擬議，濟托開云：「無位真人，是甚乾屎橛！」

'''
case_en = '''
Linji told the assembly, "There is a true person of no rank, always going in and out through the gates of your face. Beginners who haven't seen for yourselves, look. Look!"

A monk asked, "What is the true person of no rank?"

Linji came down from his seat and grabbed the monk. The monk hesitated. Linji shoved him away and said, "True person of no rank? What a dried shit-stick!"
'''

verse_zh = '''
迷悟相返，
妙傳而簡。
春坼百花兮一吹，
力迴九牛兮一挽。
無奈泥沙撥不開，
分明塞斷甘泉眼。
忽然突出肆橫流。

'''
verse_en = '''
Delusion and awakening trade places.
The subtle teaching passes on so simply.
One breath, and spring splits a hundred flowers;
one strong tug, and nine oxen turn.
But the mud and sand won't clear.
They plug the mouth of the sweet spring.
Suddenly it bursts out and floods everywhere.
'''

pointer = '''
Linji (Rinzai, died 866) was one of the fiercest teachers in Chan, known for the shout and the grab. Here it's the grab. The "true person of no rank" fits no social slot or job title in the monastery pecking order. The monk asks "What is it?" and Linji springs off his seat and seizes him. The Record of Linji (case 3) has him demand an answer right then. Here the monk stalls, and Linji throws the whole grand phrase in the garbage by calling it a dried shit-stick, the sort of stick used to wipe after using the latrine. So who is going in and out of your face while you read this?
'''
