number = 42
slug = ""
title_zh = "南陽淨瓶"
title_en = "Nanyang's Water Jug"

intro_zh = '''
洗鉢添瓶，盡是法門佛事；般柴運水，無非妙用神通。為甚麼不解放光動地？

'''
intro_en = '''
Washing bowls, filling water bottles: it's all part of the Buddha's work and the ways into the teaching. Carrying firewood, hauling water: all of it is marvelous activity and miraculous power. Why can't it give off light and shake the earth?
'''

case_zh = '''
僧問南陽忠國師：「如何是本身盧舍那？」國師云：「與我過淨瓶來。」僧將淨瓶到。國師云：「却安舊處著。」僧復問：「如何是本身盧舍那？」國師云：「古佛過去久矣。」

'''
case_en = '''
A monk asked National Teacher Zhong of Nanyang, "What is Rocana in his original body?"

Zhong said, "Bring me the water jug."

The monk brought it over.

Zhong said, "Now put it back where it was."

The monk asked again, "What is Rocana in his original body?"

Zhong said, "The old Buddha has been gone a long, long time."
'''

verse_zh = '''
鳥之行空，
魚之在水。
江湖相忘，
雲天得志。
擬心一絲，
對面千里。
知恩報恩，
人間幾幾？

'''
verse_en = '''
A bird flies through open sky.
A fish lives in the water.
In rivers and lakes they forget one another.
Among clouds and sky they are in their element.
Let the mind stir by a single thread
and what's right in front of you is a thousand miles away.
To know a kindness and repay it,
how many in this world ever do?
'''

pointer = '''
Rocana is the name an early Chinese translation of the Flower Ornament Sutra uses for the cosmic Buddha, the whole universe pictured as one boundless body of light, about the grandest abstraction Buddhism owns. So the monk's question aims sky-high: where is that ultimate reality, the true body itself? National Teacher Zhong, the Tang monk Huizhong of Nanyang who advised emperors, replies by handing him a chore, fetch the water jug, now put it back. When the monk plows on and asks the same enormous question again, Zhong tells him the old Buddha has been gone a very long time, without saying a word about the jug. This is the bowl-washing of case 39 in another key, the towering question met by the nearest task.
'''
