number = 28
slug = ""
title_zh = "護國三懡"
title_en = "Huguo's Three Embarrassments"

intro_zh = '''
不挂寸絲底人，正是裸形外道；不嚼粒米底漢，斷歸焦面鬼王。直饒聖處受生，未免竿頭險墮。還有掩羞處麼？

'''
intro_en = '''
Someone who wears not an inch of thread is a naked ascetic outside the teaching. Someone who won't chew a grain of rice is sure to end up in the realm of the Burnt-Faced Ghost King. Even reborn in a holy place, you'd still risk a fall from the top of the pole. So is there anywhere left to hide your shame?
'''

case_zh = '''
僧問護國：「鶴立枯松時如何？」國云：「地下底一場懡㦬。」僧云：「滴水滴凍時如何？」國云：「日出後一場懡㦬。」僧云：「會昌沙汰時，護法善神向甚麼處去也？」國云：「三門頭兩箇一場懡㦬。」

'''
case_en = '''
A monk asked Huguo, "When the crane stands on the withered pine, what then?"
Huguo said, "On the ground below, a total embarrassment."
The monk said, "When the water freezes the instant it drips, what then?"
Huguo said, "Once the sun comes up, a total embarrassment."
The monk said, "During the Huichang purge, when they tore the temples down, where did the Dharma-protecting spirits go?"
Huguo said, "Those two at the gate, a total embarrassment."
'''

verse_zh = '''
壯士稜稜鬢未秋，
男兒不憤不封侯。
翻思清白傳家客，
洗耳溪頭不飲牛。

'''
verse_en = '''
The fighter is keen, his temples not yet gray.
Without a fire in his belly a man wins no title.
Think again of those who handed on a clean name:
one washed his ears at the stream, the other wouldn't water his ox there.
'''

pointer = '''
Huguo ("Protect the Country") is the master, and a monk keeps lobbing him gorgeous frozen images that monks love to pass off as awakening: a crane perched on a dead pine, water that ices over the instant it drips. Each time, Huguo answers with the same verdict, a total embarrassment. The crane has to come down, the ice melts when the sun clears the ridge, the pose cannot hold itself up. Then comes the sharp question: during the Huichang persecution of 845 the emperor tore down Buddhist temples across China, so where were the Dharma-protecting guardian spirits when it mattered? Huguo names the two guardian figures flanking the temple gate, the third embarrassment. In the story behind the verse, Xu You washes out his ears after being offered the throne, and Chaofu won't let his ox drink downstream. Which of your own poses is in that statue's position?
'''
