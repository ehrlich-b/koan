number = 53
slug = ""
title_zh = "黃檗噇糟"
title_en = "Huangbo's Dregs-Guzzlers"

intro_zh = '''
臨機不見佛，大悟不存師。定乾坤劍沒人情，擒虎兕機忘聖解。且道：是甚麼人作略？

'''
intro_en = '''
Meet the moment and you see no Buddha. Wake all the way and no teacher remains. The sword that sets heaven and earth in order plays no favorites. The trap that snares tigers and rhinoceroses leaves no room for holy answers. So tell me, what kind of person makes a move like that?
'''

case_zh = '''
黃蘗示眾云：「汝等諸人盡是噇酒糟漢！與麼行脚，何處有今日？還知大唐國裏無禪師麼？」時有僧出云：「只如諸方匡徒領眾，又作麼生？」蘗云：「不道無禪，只是無師。」

'''
case_en = '''
Huangbo addressed the assembly. "Every last one of you is guzzling the dregs! Trek from monastery to monastery like this and how will you ever get to today? Don't you know there's no Zen teacher in all the Great Tang?"

A monk stepped forward. "What about the people everywhere who guide students and lead communities?"

Huangbo said, "I didn't say there's no Zen. I said there's no teacher."
'''

verse_zh = '''
岐分絲染太勞勞，
葉綴花聯敗祖曹。
妙握司南造化柄，
水雲器具在甄陶。
屏割繁碎，
剪除氄毛。
星衡藻鑑，
玉尺金刀。
黃蘗老察秋毫，
坐斷春風不放高。

'''
verse_en = '''
Forked roads and dyed silk, all that weary fuss.
Stitch leaves and flowers together and you ruin the ancestral line.
He deftly grips the compass, the handle of creation.
The wandering monks are vessels taking shape in the potter's kiln.
Cut away the tangled clutter,
trim off the soft down.
A star-marked balance, a clear mirror,
a jade ruler, a gold knife.
Old Huangbo spots the tip of an autumn hair.
He sits and cuts off the spring wind, lets nothing grow tall.
'''

pointer = '''
Huangbo was a hard-edged ninth-century master, teacher of Linji, who founded the Linji house. "Guzzling the dregs" is his insult for monks who slurp down leftover words and other people's enlightenment instead of waking up themselves, like drinking the spent mash from brewing and calling it wine. When he announces there's "no Zen teacher in all the Great Tang," he isn't denying that teachers exist, and the trap is right there in the monk's objection. Plenty of people run schools and lead crowds, as the monk is quick to point out. The verse piles up a craftsman's tools, dyer and kiln and ruler and blade, cutting away every fake so nothing counterfeit gets to stand tall.
'''
