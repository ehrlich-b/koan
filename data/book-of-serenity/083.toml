number = 83
slug = ""
title_zh = "道吾看病"
title_en = "Daowu Visits the Sick"

intro_zh = '''
通身做病，摩詰難痊。是草堪醫，文殊善用。爭如參取向上人，得箇安樂處。如何是安樂處？

'''
intro_en = '''
The whole body one sickness, and even Vimalakirti is hard to cure. There's an herb that can cure it, and Manjushri knows the use of it. Better still, seek out the person who has gone beyond and find a place of ease. Where is that place of ease?
'''

case_zh = '''
溈山問道吾：「甚麼處來？」吾云：「看病來。」山云：「有幾人病？」吾云：「有病者、不病者。」山云：「不病者莫是智頭陀麼？」吾云：「病與不病，總不干他事。速道速道！」山云：「道得也沒交涉。」

'''
case_en = '''
Guishan asked Daowu, "Where have you come from?"

Daowu said, "From visiting the sick."

Guishan said, "How many were sick?"

Daowu said, "There were sick ones and ones who weren't sick."

Guishan said, "Could the one who isn't sick be Ascetic Zhi?"

Daowu said, "Sick or not, it has nothing to do with him. Speak! Speak now!"

Guishan said, "Say it and you'd still miss it clean."
'''

verse_zh = '''
妙藥何曾過口，
神醫莫能捉手。
若存也渠本非無，
至虛也渠本非有。
不滅而生，
不亡而壽。
全超威音之前，
獨步劫空之後。
成平也天蓋地擎，
運轉也烏飛兔走。

'''
verse_en = '''
When did the wonder drug ever pass his lips?
Even a miraculous doctor can't take his pulse.
Say he exists: he was never nothing to begin with.
Press him to pure void, he was never something to begin with.
Born without ceasing to be.
Living long without ever perishing.
Clear beyond the time before the Buddha Awesome Voice.
Walking alone after the eon of emptiness.
At peace, sky roofs him, earth bears him up.
In motion, the sun-crow flies and the moon-hare runs.
'''

pointer = '''
This is two old Chan monks taking each other's measure. Daowu comes back from visiting the sick, and Guishan needles him with what sounds like idle chat, how many were ill? Daowu turns it into a riddle: some were sick and some weren't. Guishan tries to nail the one who isn't sick onto Daowu personally, using his name Zhi, as though it were a possession you could point at and claim. Daowu's reply, that it has nothing to do with him, comes with a demand of its own: speak, quick. Hongzhi's verse circles this "him" who can't be located, can't be cured, can't be filed as either something or nothing, and runs the whole show regardless. (The sun-crow and the moon-hare are just the old shorthand for time turning.)
'''
