number = 41
slug = ""
title_zh = "洛浦臨終"
title_en = "Luopu on His Deathbed"

intro_zh = '''
有時忠誠，扣已苦屈難申；有時殃及，向人承當不下。臨行賤折倒，末後最慇懃。泪出痛腸，更難隱諱。還有冷眼者麼？

'''
intro_en = '''
Sometimes a loyal heart has a grievance it can't get anyone to hear. Sometimes trouble comes your way and you can't take it on for someone else. On the way out comes the indignity of a fall. At the very end the concern is greatest. Tears come from the gut, and nothing is easy to hide. Is anyone here watching with a cool eye?
'''

case_zh = '''
洛浦臨終示眾云：「今有一事，問爾諸人：這箇若是，即頭上安頭；若不是，即斬頭覓活。」時首座云：「青山常舉足，白日不挑燈。」浦云：「是甚麼時節，作這箇說話？」有彥從上座出云：「去此二途，請師不問。」浦云：「未在，更道。」從云：「某甲道不盡。」浦云：「我不管爾道盡道不盡。」從云：「某甲無侍者祇對和尚。」至晚，喚從上座：「爾今日祇對，甚有來由，合體得先師道：『日前無法，意在目前；他不是目前法，非耳目之所到。』那句是賓？那句是主？若揀得出，分付鉢袋子。」從云：「不會。」浦云：「汝合會。」從云：「實不會。」浦喝云：「苦哉！苦哉！」僧問：「和尚尊意如何？」浦云：「慈舟不棹清波上，劍峽徒勞放木鵝。」

'''
case_en = '''
On his deathbed Luopu told the assembly, "I have one thing to ask you all. If this is it, you're putting a head on top of your head. If it isn't, you're cutting off your head to look for life."

The head monk said, "The green mountain never stops lifting its feet. In broad daylight you don't light a lamp."

Luopu said, "What kind of occasion is this for talk like that?"

A senior monk named Yancong stepped forward. "Leave those two ways aside. Please, master, don't ask."

Luopu said, "You're not there yet. Say more."

Yancong said, "I can't say it all."

Luopu said, "I don't care whether you say it all or not."

Yancong said, "I have no attendant to answer you, master."

That evening Luopu called him in. "There was something behind your answer today. You should have grasped what my late teacher said: 'Before your eyes there is no Dharma. Its meaning is right before your eyes. It isn't the Dharma that's before your eyes, and ears and eyes can't reach it.' Which line is guest, and which is host? If you can tell them apart, I'll give you my bowl bag."

Yancong said, "I don't get it."

Luopu said, "You ought to get it."

Yancong said, "Honestly, I don't get it."

Luopu cried, "What a shame! What a shame!"

A monk asked, "Master, what did you mean?"

Luopu said, "The boat of compassion doesn't ply clear waters. It's a waste to send a wooden goose down Sword Gorge."
'''

verse_zh = '''
餌雲鉤月釣清津，
年老心孤未得鱗。
一曲離騷歸去後，
汩羅江上獨醒人。

'''
verse_en = '''
Cloud for bait, moon for hook, fishing the clear ford.
old now, heart alone, and still no fish on the line.
One song of the Li Sao, and then he goes home.
On the Miluo River, the one man sober.
'''

pointer = '''
Luopu Yuan'an, the same master who once stood cocky before Jiashan (35), is dying and hunting for someone fit to inherit his "bowl bag," the gear that marks the next teacher in the line. His final question is rigged so neither answer survives: say "yes, that's it" and you've stacked a fake head on the real one; say "no" and you've cut off your own head to go looking for life. The head monk reaches for stock Zen-sounding lines and gets a sharp word from Luopu for picking such a time to say them. Yancong answers sharper, Luopu's hopes rise, then he presses him that evening to actually carve apart guest from host in the old saying, with the host taking the lead and the guest responding. Yancong says twice that he doesn't get it, and Luopu cries "what a shame" without passing the bowl bag to him. The verse closes on Qu Yuan, the poet said to have drowned himself in the Miluo after declaring everyone drunk and himself alone sober. It leaves Luopu beside the image of the one sober man.
'''
