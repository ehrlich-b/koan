number = 45
slug = "who-is-he"
title_zh = "他是阿誰"
title_en = "Who Is He?"
title_pinyin = ""

case_zh = '''
東山演師祖曰。釋迦彌勒猶是他奴。且道他是阿誰。
'''
case_en = '''
Master Fayan of East Mountain said, "Even Shakyamuni and Maitreya are his servants. Tell me, who is he?"
'''

commentary_zh = '''
若也見得他分曉。譬如十字街頭撞見親爺相似。更不須問別人。道是與不是。
'''
commentary_en = '''
If you can really see who he is, it's like running smack into your own father at a busy crossroads. You don't need to ask anyone else whether it's really him.
'''

verse_zh = '''
他弓莫挽
他馬莫騎
他非莫辨
他事莫知
'''
verse_en = '''
Don't draw another's bow.
Don't ride another's horse.
Don't argue over another's faults.
Don't pry into another's affairs.
'''

pointer = '''
Wuzu Fayan was an influential Chan teacher, the same Wuzu who asks about the buffalo's tail in case 38. Shakyamuni is the historical Buddha and Maitreya is the buddha said to arrive in the future, two of the largest names Buddhism has. Calling even those two "his" servants leaves you holding the dare to say whom they serve. The question is built to extract a noun, an answer you can set down on the table, and the reach for that noun is the miss. The verse turns practical: quit drawing someone else's bow, quit riding someone else's horse, quit wearing a buddha's or a teacher's identity like a borrowed coat. So who is asking?
'''
