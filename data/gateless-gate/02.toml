number = 2
slug = "baizhangs-fox"
title_zh = "百丈野狐"
title_en = "Baizhang's Fox"
title_pinyin = "Bǎizhàng yěhú"

case_zh = '''
百丈和尚。凡參次有一老人。常隨眾聽法。眾人退老人亦退。忽一日不退。師遂問。面前立者復是何人。老人云。諾某甲非人也。於過去迦葉佛時。曾住此山。因學人問。大修行底人還落因果。也無。某甲對云。不落因果。五百生墮野狐身。今請和尚。代一轉語貴。脫野狐遂問。大修行底人還落因果。也無。師云。不昧因果。老人於言下大悟。作禮云。某甲已脫野狐身。住在山後。敢告和尚。乞依亡僧事例。師令無維那白槌告眾。食後送亡僧。大眾言議。一眾皆安涅槃堂。又無人病。何故如是。食後只見師領眾。至山後巖下。以杖挑出一死野狐。乃依火葬。師至晚上堂。舉前因緣。黃蘗便問。古人錯祇對一轉語。墮五百生野狐身。轉轉不錯。合作箇甚麼。師云。近前來與伊道。黃蘗遂近前。與師一掌。師拍手笑云。將謂。胡鬚赤更有赤鬚胡。
'''
case_en = '''
Whenever Master Baizhang gave a talk, an old man would come to hear the teaching along with the monks. When they filed out, he filed out too. Then one day he stayed behind. Baizhang asked, "Who is this, standing here in front of me?"

The old man said, "I am not a human being. Long ago, in the time of Kashyapa Buddha, I lived on this mountain. A student asked me, 'Does a person of deep practice still fall under cause and effect?' I told him, 'Such a person does not fall under cause and effect.' For that I have been reborn as a wild fox five hundred times. I beg you, Master: say a turning word in my place and free me from this fox's body." Then he asked, "Does a person of deep practice still fall under cause and effect?"

Baizhang said, "Such a person is not blind to cause and effect."

At those words the old man woke completely. He bowed and said, "I've shed the fox's body. It's behind the mountain. I ask you to give it a monk's funeral."

Baizhang had the monastery prefect strike the gavel and announce that after the meal there would be a funeral for a monk who had died. The monks were baffled. "Everyone is fine, and there's nobody sick in the infirmary. What's going on?" After the meal Baizhang led them to the foot of a cliff behind the mountain, fished out a dead fox with his staff, and had it cremated.

That evening Baizhang took the seat and told the whole story. Huangbo spoke up. "The old master answered wrong with one turning word and spent five hundred lives as a fox. Suppose he had answered right every time. What would he have become?"

Baizhang said, "Come closer and I'll tell you." Huangbo stepped up and slapped him. Baizhang clapped his hands and laughed. "I thought the barbarian's beard was red, and here is another red-bearded barbarian!"
'''

commentary_zh = '''
不落因果。為甚墮野狐。不昧因果。為甚脫野狐。若向者裏著得一隻眼。便知得。前百丈贏得。風流五百生。
'''
commentary_en = '''
"Does not fall under cause and effect." Why did he fall into a fox's body? "Is not blind to cause and effect." Why did he shed the fox's body? If you can get even one eye on this, you'll see how the former Baizhang won himself five hundred lifetimes of fun.
'''

verse_zh = '''
不落不昧
兩采一賽
不昧不落
千錯萬錯
'''
verse_en = '''
Not falling, not being blind.
Two throws, one game.
Not being blind, not falling.
Wrong a thousand, wrong ten thousand times.
'''

pointer = '''
Karma, cause and effect, is the engine the whole tradition runs on: every act has consequences, life after life. Ages ago the old man taught that a truly enlightened master gets to climb off the engine, "free of cause and effect," exempt. Five hundred fox-lives later Baizhang frees him by shifting a single word: not exempt from karma, just not blind to it. Then the case turns: Huangbo asks what happens if you never misspeak at all, and answers his own question with a slap.
'''
