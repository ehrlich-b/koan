number = 21
slug = "yunmen-dried-shit-stick"
title_zh = "雲門屎橛"
title_en = "Yunmen's Dried Shit-Stick"
title_pinyin = ""

case_zh = '''
雲門因僧問。如何是佛。門云乾屎橛
'''
case_en = '''
A monk asked Yunmen, "What is Buddha?"
Yunmen said, "A dried shit-stick."
'''

commentary_zh = '''
雲門可謂。家貧難辨素食。事忙不及草書。動便將屎橛來。撐門拄戶。佛法興衰可見。
'''
commentary_en = '''
You could say Yunmen keeps a poor house and can barely lay out a plain meal. He's so busy he hasn't time to scrawl a note. At the slightest provocation he brings out a shit-stick to brace the gate and prop up the door. You can see how the Buddha's teaching is faring.
'''

verse_zh = '''
閃電光
擊石火
眨得眼
已蹉過
'''
verse_en = '''
A flash of lightning,
sparks struck from flint.
Blink once
and it's already gone.
'''

pointer = '''
Yunmen, a tenth-century master of the Five Dynasties, was known for blunt one-shot answers. A monk lobs him the biggest question there is, what is Buddha, the awakened one, the whole point, clearly fishing for something lofty. Yunmen hands him a "dried shit-stick": usually understood as a thin stick used for wiping yourself at the latrine, about the crudest object a person could name. The jab is aimed at the monk's appetite for a holy, quotable answer. This is the shocking face of Zen that also cuts the cat in case 14. Wumen's verse gives you a flash of lightning and just enough time to blink.
'''
