number = 26
slug = "two-monks-roll-the-blind"
title_zh = "二僧卷簾"
title_en = "Two Monks Roll Up the Blind"
title_pinyin = ""

case_zh = '''
清涼大法眼。因僧齋前上參。眼以手指簾。時有二僧。同去卷簾。眼曰。一得一失。
'''
case_en = '''
When monks came to see the great Fayan of Qingliang before the meal, he pointed at the blind. Two monks went over together and rolled it up. Fayan said, "One gained, one lost."
'''

commentary_zh = '''
且道是誰得誰失。若向者裏著得一隻眼。便知清涼國師敗闕處。然雖如是。切忌向得失裏商量。
'''
commentary_en = '''
So tell me, who gained and who lost? Fit a single eye to this and you'll see exactly where National Teacher Qingliang slipped. Even so, whatever you do, don't go sizing it up in terms of gain and loss.
'''

verse_zh = '''
卷起明明徹太空
太空猶未合吾宗
爭似從空都放下
綿綿密密不通風
'''
verse_en = '''
Roll it up and the light shines through the whole sky.
Even the whole sky falls short of my school.
Better to let it all down from the open sky,
sealed close and seamless, no wind passing through.
'''

pointer = '''
Fayan, named here for his temple Qingliang, founded one of the major Chan houses; a roomful of monks is waiting on his talk. He just points at the window blind, two monks jump to roll it, and he grades them split: one got it, one missed, no reason given. That verdict is the bait. The reflex is to start scoring, to decide which monk passed, and the commentary cuts that off cold: fit one eye to this and don't go sizing it up as gain and loss. The verse then refuses the obvious reading too. Rolling the blind to reveal the open sky looks like the awakened move, but Wumen lets the blind down again, shutting out even that clear sky. Since identical actions earned opposite marks, the question is what Fayan was watching.
'''
