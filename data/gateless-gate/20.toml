case_zh = '''
松源和尚云。大力量人因甚抬腳不起。又云。開口不在舌頭上。
'''
case_en = '''
Master Songyuan said, "Why can't a person of great strength lift a foot?"
He also said, "Opening the mouth doesn't happen on the tongue."
'''

commentary_zh = '''
松源可謂。傾腸倒腹。只是欠人承當。縱饒直下承當。正好來無門處喫痛棒。何故聾。聻要識真金。火裏看。
'''
commentary_en = '''
Songyuan really turned his guts inside out. All that's missing is somebody to take it up. Even if you take it up on the spot, you're just in time to get a good beating from Wumen. Why? Want to know real gold? Look for it in the fire.
'''

verse_zh = '''
抬腳踏翻香水海
低頭俯視四禪天
一箇渾身無處著
請續一向
'''
verse_en = '''
One kick, and the sea of fragrant water tips over.
Lower your head and look down on the heavens of the four meditations.
A whole body, and nowhere to set it.
Your turn. Give me the next line.
'''

pointer = '''
Songyuan is a Chan teacher who tosses out two riddles in one breath. The first turns on "person of great strength": picture the strongest person alive, who still can't lift their own leg. The second puts the same snag into an everyday act: "opening the mouth doesn't happen on the tongue." Wumen then mock-praises Songyuan for over-explaining, jokes that anyone who rises to the challenge gets clubbed for it, and falls back on the old line about testing gold in fire: talk is cheap, prove it under heat. The verse blows the strength image up to cosmic scale, one kick overturns the ocean, one glance looks down on the heavens, then strands you, a body that vast with nowhere to stand. The last line hands you the brush: your turn.
'''
