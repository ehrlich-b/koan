number = 9
slug = "great-universal-wisdom"
title_zh = "大通智勝"
title_en = "Great Penetrating Wisdom"
title_pinyin = ""

case_zh = '''
興陽讓和尚。因僧問。大通智勝佛。十劫坐道場。佛法不現前。不得成佛道時如何。讓曰。其問甚諦當。僧云。既是坐道場。為甚麼不得成佛道。讓曰。為伊不成佛。
'''
case_en = '''
A monk asked Master Rang of Xingyang, "The Buddha of Great Penetrating Wisdom sat at the place of awakening for ten eons, but the Buddha's teaching didn't appear to him and he couldn't attain buddhahood. What about that?"

Rang said, "Now that's a fair question."

The monk said, "He was sitting right there at the place of awakening. Why couldn't he attain buddhahood?"

Rang said, "Because he didn't become a buddha."
'''

commentary_zh = '''
只許老胡知。不許老胡會。凡夫若知即是聖人。聖人若會即是凡夫。
'''
commentary_en = '''
I'll grant that the old foreigner knows. I won't grant that he understands. If an ordinary person knows, they're a sage. If a sage understands, they're an ordinary person.
'''

verse_zh = '''
了身何似了心休
了得心兮身不愁
若也身心俱了了
神仙何必更封侯
'''
verse_en = '''
Why settle the body when you can put the mind at rest?
Settle the mind and the body won't fret.
Once body and mind are both settled,
why make an immortal a marquis?
'''

pointer = '''
The story comes from the Lotus Sutra: the Buddha of Great Penetrating Wisdom sat in meditation for ten eons (an eon being an unthinkably long stretch of time) before attaining buddhahood. The monk asks about those ten eons, when awakening still hadn't arrived. The monk wants Master Rang to explain the glitch, since the guy did everything right and got no payoff. Rang answers with a flat tautology, "because he didn't become a buddha," and refuses to budge. The monk is treating buddhahood like a prize you bank by sitting long enough, a thing you lack and then acquire.
'''
