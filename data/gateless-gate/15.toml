case_zh = '''
雲門因洞山參次。門問曰。近離甚處。山云查渡。門曰夏在甚處。山云湖南報慈。門曰幾時離彼。山云八月二十五。門曰放汝三頓棒。山至明日卻上問訊。昨日蒙和尚放三頓棒。不知過在甚麼處。門曰飯袋子。江西湖南便恁麼去山。於此大悟。
'''
case_en = '''
When Dongshan came to study with Yunmen, Yunmen asked, "Where did you last come from?"
"Chadu," said Dongshan.
"Where did you spend the summer retreat?"
"Baoci Monastery in Hunan."
"When did you leave there?"
"The twenty-fifth of the eighth month."
Yunmen said, "I'll spare you three rounds with the stick."
The next day Dongshan returned to pay his respects. "Yesterday you spared me three rounds with the stick. What did I do wrong?"
Yunmen said, "You rice bag! Is this how you go about, through Jiangxi and Hunan?"
Dongshan woke up on the spot.
'''

commentary_zh = '''
雲門當時便與本分草料。使洞山別有生機一路。家門不致寂寥。一夜在是非海裏。著到直待天明。再來又與他注破。洞山直下悟去。未是性燥。且問諸人。洞山三頓棒合喫不合喫。若道合喫。草木叢林皆合喫棒。若道不合喫。雲門又成誑語。向者裏明得。方與洞山出一口氣。
'''
commentary_en = '''
Right then Yunmen gave Dongshan the fodder he needed, opening another way for him to come alive and keeping the family line from falling silent. Dongshan thrashed all night in a sea of right and wrong, waiting for daybreak. When he came back at daybreak, Yunmen spelled it out for him again. Dongshan woke up on the spot. He was in no hurry.

Let me ask you all, did Dongshan deserve those three rounds with the stick? Say he deserved them, and every tree and blade of grass deserves a beating too. Say he didn't, and Yunmen is a liar. Get clear about this, and you'll breathe with the same breath as Dongshan.
'''

verse_zh = '''
