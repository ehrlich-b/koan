verse_en = '''
A lion teaches its cub the trick that will fool it.
Just as it goes to pounce, it's already twisted away.
Out of nowhere a second shot hits head-on.
The first arrow grazed. The second goes deep.
'''

pointer = '''
Dongshan is a young monk on pilgrimage, traveling teacher to teacher; Yunmen is a ferocious master. The opening reads like small talk, where are you from, where'd you spend the summer, when'd you leave, and Dongshan answers each flatly, as if filling out a form. "Three rounds with the stick" means a thrashing, so saying "I'll spare you" is Yunmen telling him he blew it. Dongshan then spends all night stewing over which rule he broke. "Rice bag" means dead weight, a body that just hauls food around. The verse reads the beating as a lioness training her cub, the soft answer the first arrow, the insult the second, and the second one lands.
'''
