number = 43
slug = "shoushan-bamboo-staff"
title_zh = "首山竹篦"
title_en = "Shoushan's Bamboo Stick"
title_pinyin = ""

case_zh = '''
首山和尚。拈竹篦示眾云。汝等諸人若喚作竹篦則觸。不喚作竹篦則背。汝諸人且道。喚作甚麼。
'''
case_en = '''
Master Shoushan held up a bamboo stick before the assembly and said, "Call it a bamboo stick and you collide with it. Don't call it a bamboo stick and you turn your back on it. Tell me, what do you call it?"
'''

commentary_zh = '''
喚作竹篦則觸。不喚作竹篦則背。不得有語。不得無語。速道速道。
'''
commentary_en = '''
Call it a bamboo stick and you collide with it. Don't call it a bamboo stick and you turn your back on it. No words. No silence. Speak quickly, speak quickly.
'''

verse_zh = '''
拈起竹篦
行殺活令
背觸交馳
佛祖乞命
'''
verse_en = '''
He holds up the bamboo stick.
He gives the command that kills and gives life.
Turning away and running into it come rushing together.
Buddhas and ancestral teachers beg for their lives.
'''

pointer = '''
Shoushan was a tenth-century Chan master. The bamboo stick is a short rod teachers kept on hand, and here it is bait. Call it a stick and you have swallowed the label, treating the word as if it were the thing. Refuse the word and you are denying the plain object an arm's length away. He has nailed both doors shut, then demands you walk through. Wumen's comment tightens the screw: no words, no silence, speak. That looks impossible only as long as you think the test is about the stick. It is the same either/or trap Bajiao sets next door (44) with his giving and taking, and the same gate Mu guards at the very front of the book. So what comes out of you when both held answers are gone?
'''
