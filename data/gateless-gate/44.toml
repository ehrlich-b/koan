number = 44
slug = "bajiao-staff"
title_zh = "芭蕉拄杖"
title_en = "Bajiao's Staff"
title_pinyin = ""

case_zh = '''
芭蕉和尚示眾云。爾有拄杖子。我與爾拄杖子。爾無拄杖子。我奪爾拄杖子。
'''
case_en = '''
Master Bajiao said to the assembly: "If you have a staff, I'll give you a staff. If you have no staff, I'll take your staff away."
'''

commentary_zh = '''
扶過斷橋水。伴歸無月村。若喚作拄杖。入地獄如箭。
'''
commentary_en = '''
It steadies you across the water where the bridge is out. It walks you home to the village on a moonless night. Call it a staff and you shoot into hell like a loosed arrow.
'''

verse_zh = '''
諸方深與淺
都在掌握中
撐天并拄地
隨處振宗風
'''
verse_en = '''
The depths and shallows in every quarter
all of it here in your grip.
It props up heaven and braces the earth.
Wherever it goes, it stirs the spirit of the school.
'''

pointer = '''
A staff here is the walking stick a wandering monk carried, half travel gear and half mark of his office. Bajiao hands out a riddle that runs backward: whoever already has one gets a second, whoever has none has even that nothing taken away. There is no clever rule about sticks hiding in it. Wumen's comment works both faces of it. The staff carries you over the washed-out bridge and walks you home through the moonless village, genuinely the most useful thing you have, right up until you call it a staff and it fires you into hell like a loosed arrow. Same stick, two destinations.
'''
