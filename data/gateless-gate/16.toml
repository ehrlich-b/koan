number = 16
slug = "bell-and-seven-panel-robe"
title_zh = "鐘聲七條"
title_en = "The Bell and the Seven-Panel Robe"
title_pinyin = ""

case_zh = '''
雲門曰。世界恁麼廣闊。因甚向鐘聲裏披七條。
'''
case_en = '''
Yunmen said, "The world is so wide and open. Why do you put on your seven-panel robe at the sound of a bell?"
'''

commentary_zh = '''
大凡參禪學道。切忌隨聲逐色。縱使聞聲悟道見色明心。也是尋常。殊不知。衲僧家騎聲蓋色。頭頭上明。著著上妙。然雖如是且道。聲來耳畔。耳往聲邊。直饒響寂雙忘。到此如何話會。若將耳聽應難會。眼處聞聲方始親。
'''
commentary_en = '''
In practicing Chan and studying the Way, don't go chasing sounds and sights. Waking to the Way at a sound or seeing the mind clearly at a sight is still ordinary. A monk can ride sounds and cover sights, clear in each thing and deft at every move. Even so, tell me, does sound come to the ear, or does the ear go to the sound? Even if you forget both sound and silence, how will you speak of it here? Listen with your ears and you'll have a hard time grasping it. Hear the sound where the eye is and you'll begin to get close.
'''

verse_zh = '''
會則事同一家
不會萬別千差
不會事同一家
會則萬別千差
'''
verse_en = '''
Get it, and everything belongs to one house.
Miss it, and there are a thousand differences.
Miss it, and everything belongs to one house.
Get it, and there are a thousand differences.
'''

pointer = '''
Yunmen was a tenth-century Chan master, of the Five Dynasties era, known for short jarring questions. The setup is a scrap of monastery routine: a bell rings on schedule and the monks all pull on the formal seven-panel robe to go to the assembly. Yunmen's needle: the universe is endless and wide open, so why does this supposedly liberated crowd jump into uniform the instant a bell sounds? Are you free, or just well trained? The closing verse looks like a tidy logic puzzle, then deliberately scrambles itself, swapping "get it" and "miss it" until the equation collapses.
'''
