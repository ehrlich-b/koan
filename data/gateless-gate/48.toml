number = 48
slug = "qianfeng-one-road"
title_zh = "乾峰一路"
title_en = "Qianfeng's One Road"
title_pinyin = ""

case_zh = '''
乾峰和尚因僧問。十方薄伽梵。一路涅槃門。未審路頭在甚麼處。峰拈起拄杖。劃一劃云。在者裏。後僧請益雲門。門拈起扇子云。扇子勃跳。上三十三天。築著帝釋鼻孔。東海鯉魚打一棒。雨似盆傾。
'''
case_en = '''
A monk asked Master Qianfeng, "For the Blessed Ones of the ten directions there's one road to the gate of nirvana. Where does the road begin?"

Qianfeng raised his staff, drew a line, and said, "Right here."

Later the monk asked Yunmen for instruction. Yunmen held up his fan and said, "This fan leaps up to the Heaven of the Thirty-Three and bonks Shakra in the nostril. Give a carp in the Eastern Sea a whack and down comes rain as if someone tipped a basin."
'''

commentary_zh = '''
一人向深深海底。行簸土揚塵。一人於高高山頂。立白浪滔天。把定放行各出一隻手。扶豎宗乘。大似兩箇馳子相撞著。世上應無直底人。正眼觀來。二大老總未識路頭在。
'''
commentary_en = '''
One man goes down to the deepest seabed and kicks up dust. The other stands on the highest peak and raises white waves that swamp the sky. One holds fast, one lets go, and each puts out a hand to keep the teaching upright. They're like two racers slamming into each other. You'd think there wasn't a straight person in the world. Look with a clear eye and neither of these old masters knows where the road begins.
'''

verse_zh = '''
未舉步時先已到
未動舌時先說了
直饒著著在機先
更須知有向上竅
從上佛祖垂示機緣。據款結案。初無剩語。揭翻腦蓋。露出眼睛。肯要諸人直下承當不從他覓。若是通方上士。纔聞舉著。便知落處。了無門戶可入。亦無階級可升。掉臂度關。不問關吏。豈不見玄沙道。無門解脫之門。無意道人之意。又白雲道明明知道。只是者箇為甚麼。透不過。恁麼說話。也是赤土搽牛嬭。若透得無門關。早是鈍置無門。若透不得無門關。亦乃辜負自己。所謂涅槃心易曉。差別智難明。明得差別智。家國自安寧。
時。紹定改元解制前五日。楊岐八世孫無門比丘慧開謹識。
無門關卷【終】。
'''
verse_en = '''
Before you lift a foot, you've already arrived.
Before your tongue moves, you've already said it.
Even if you stay a beat ahead at every turn,
you still have to know there's an opening beyond.

The buddhas and ancestral teachers before us handed down these encounters. I closed each case on the facts before me, without a word to spare. I've pried open my skull and laid my eyes bare. I want you to take it up on the spot and do your own looking. If you're the real article, the instant you hear it raised you'll know where it lands. There's no gate to go through and no step to climb. You swing your arms and stroll past the checkpoint without asking the guard a thing.

Haven't you heard Xuansha say, "No gate is the gate to liberation. No intention is the intention of a person of the Way"? Baiyun said, "You know plain as day that this is it. Why can't you get through?" Talk like that is smearing cow's milk with red clay. Break through the Gateless Gate and you've already made a fool of Wumen. Fail to break through and you've let yourself down. As they say, the mind of nirvana is easy to grasp. The wisdom that sees distinctions is hard to get clear about. Get clear about that wisdom, and home and country settle into peace of their own accord.

Respectfully recorded by the monk Wumen Huikai, eighth-generation heir of Yangqi, five days before the end of the retreat in the first year of Shaoding.

End of the Gateless Gate.
'''

pointer = '''
The book closes here, and Wumen Huikai signs off the whole collection at the end of the case. A monk wants the single true entrance to enlightenment, the one road to nirvana, and carries the question to two masters. Qianfeng is blunt: he draws a line and says "right here." Yunmen, the tenth-century master of the wild reply, goes the other direction entirely, a fan that flies up to the Heaven of the Thirty-Three to bonk its ruler, Shakra, and a whack to a sea carp that brings rain down by the bucket. Wumen's comment then says the quiet part, that neither old master ever found where the road begins. The question smuggles in a road with a starting point and a gate you step through. His parting jab fits the man who spent forty-eight cases handing you tiles to throw away: clear the barrier and you have made him look foolish, fail and you have only let yourself down. So where does the road begin?
'''
