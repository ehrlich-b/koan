case_zh = '''
風穴和尚。因僧問。語默涉離微。如何通不犯。穴云。長憶江南三月裏。鷓鴣啼處百花香。
'''
case_en = '''
A monk asked Fengxue, "Speech and silence get entangled in separation and subtlety. How do I get through without falling foul of either?"

Fengxue said, "I often think of Jiangnan in the third month,
where the partridge calls and a hundred flowers are fragrant."
'''

commentary_zh = '''
風穴機如掣電。得路便行。爭奈坐前人舌頭不斷。若向者裏見得親切。自有出身之路。且離卻語言三昧。道將一句來。
'''
commentary_en = '''
Fengxue responded like a flash of lightning. The moment he saw the road, he took it. Even so, he couldn't keep from speaking with another man's tongue. See into this for yourself and you'll find your own way out. Now leave your mastery of words behind and give me one phrase.
'''

verse_zh = '''
不露風骨句
未語先分付
進步口喃喃
知君大罔措
'''
verse_en = '''
A line that won't show its bones,
passed on before a word is spoken.
You step forward, mouth still mumbling.
I know you're at a loss.
'''

pointer = '''
Fengxue Yanzhao was a Chan master of the tenth century. The monk's question is a logic trap: "separation" (li) and "subtlety" (wei) are paired Buddhist terms, and the monk says both talking and falling silent get tangled up in them, so either way you've slipped off the fence. How do you answer without landing on a side? Fengxue ignores the whole frame and quotes a gorgeous old line of poetry about spring in southern China. The sting, which Wumen pounces on, is that even this lovely reply is still borrowed words, no different from the speech the monk was fretting about. So the real dare is to do it yourself, fresh, in one line.
'''
