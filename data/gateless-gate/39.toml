number = 39
slug = "yunmen-caught-by-words"
title_zh = "雲門話墮"
title_en = "Yunmen: Caught by Your Own Words"
title_pinyin = ""

case_zh = '''
雲門因僧問。光明寂照遍河沙。一句未絕。門遽曰。豈不是張拙秀才語。僧云是。門云話墮也。後來死心。拈云。且道那裏是者僧話墮處。
'''
case_en = '''
A monk began to ask Yunmen, "Radiant light shines silent over the sands of the Ganges ..."

Before he could finish the line, Yunmen cut in. "Isn't that something the scholar Zhang Zhuo said?"

"Yes," said the monk.

"Your words have caught you," said Yunmen.

Later Sixin took this up. "Tell me, where did the monk's words catch him?"
'''

commentary_zh = '''
若向者裏。見得雲門用處。孤危者僧。因甚話墮。堪與人天為師。若也未明。自救不了。
'''
commentary_en = '''
See how Yunmen handled this, how exposed the monk was, and why his own words caught him, and you're fit to teach gods and humans alike. If you can't see it yet, you can't even save yourself.
'''

verse_zh = '''
急流垂釣
貪餌者著
口縫纔開
性命喪卻
'''
verse_en = '''
A hook dropped in the rushing current.
Greedy for the bait, he bites.
The moment his mouth cracks open,
his life is gone.
'''

pointer = '''
Yunmen, the tenth-century master (Five Dynasties, 864–949) famous for cutting people off mid-sentence, springs his trap on a monk who starts out sounding sure of himself. The monk begins with a line by the layman-poet Zhang Zhuo, "radiant light shines silent over the sands of the Ganges," the kind of polished spiritual phrase that normally earns a nod. "Caught by your own words" (話墮, literally "speech fallen") is the charge. Wumen's verse drops a baited hook into the current. The later teacher Sixin then turns the screw on the reader, refusing to let you just agree, and asking you to put your finger on the spot where the monk went under. So where was it?
'''
