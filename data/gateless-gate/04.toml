number = 4
slug = "barbarian-has-no-beard"
title_zh = "胡子無鬚"
title_en = "The Barbarian Has No Beard"
title_pinyin = ""

case_zh = '''
或庵曰。西天胡子。因甚無鬚。
'''
case_en = '''
Huo'an asked, "Why does the barbarian from India have no beard?"
'''

commentary_zh = '''
參須實參。悟須實悟。者箇胡子。直須親見一回始得。說親見。早成兩箇。
'''
commentary_en = '''
If you're going to practice, practice for real. If you're going to wake up, wake up for real. You have to see this barbarian for yourself, just once. Say you've seen him for yourself and already there are two.
'''

verse_zh = '''
癡人面前
不可說夢
胡子無鬚
惺惺添懵
'''
verse_en = '''
In front of a fool,
keep your dreams to yourself.
The barbarian has no beard.
The sharp ones get even more muddled.
'''

pointer = '''
The "barbarian from the West" is Bodhidharma, the Indian monk who supposedly carried Chan to China. Chinese painters often drew him as a fierce, wild-bearded foreigner; the beard is practically his logo. So the question is a trap wearing the mask of nonsense: why does the famously bearded man have no beard? There's no clever fact that resolves it.
'''
