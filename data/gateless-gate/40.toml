slug = "kicking-over-the-water-jug"
title_zh = "趯倒淨瓶"
title_en = "Kicking Over the Water Jug"
title_pinyin = ""

case_zh = '''
溈山和尚。始在百丈會中。充典座。百丈將選大溈主人。乃請同首座。對眾下語。出格者可往。百丈遂拈淨瓶。置地上。設問云。不得喚作淨瓶。汝喚作甚麼。首座乃云。不可喚作木[木+突]。也百丈卻問於山。山乃趯倒淨瓶而去。百丈笑云。第一座輸卻山子。也因命之為開山。
'''
case_en = '''
Before he was Master Guishan, he was head cook in Baizhang's monastery. Baizhang was choosing someone to take charge on Mount Gui, so he summoned Guishan and the head monk to answer in front of the assembly. Whoever stood out would go.

Baizhang set a water jug on the floor and asked, "You're not to call it a water jug. What do you call it?"

The head monk said, "You couldn't call it a block of wood."

Baizhang put the question to Guishan. Guishan kicked the jug over and left.

Baizhang laughed. "The head monk has lost to Guishan." He appointed Guishan founding abbot.
'''

commentary_zh = '''
溈山一期之勇。爭奈跳百丈圈圚不出。檢點將來。便重不便輕。何故聾脫得盤頭。擔起鐵枷。
'''
commentary_en = '''
Guishan summoned one good burst of nerve, yet for all that he never leapt clear of Baizhang's trap. Look him over and you'll see he's better at taking on the heavy load than the light one. How so? He shed his cook's headcloth only to take up an iron yoke.
'''

verse_zh = '''
颺下箍籬并木杓
當陽一突絕周遮
百丈重關攔不住
腳尖趯出佛如麻
'''
verse_en = '''
Down go the bamboo strainer and the wooden ladle.
One thrust in broad daylight and nothing gets in the way.
Baizhang's barred gate can't hold him.
His toe kicks out buddhas thick as hemp.
'''

pointer = '''
Baizhang is the Tang teacher who organized Chan monastic life; Guishan is his student, here still a kitchen worker about to be made founding abbot of a new monastery. The test is a classic bind: name the water jug without calling it a water jug. The head monk plays the word game, calling it not-a-block-of-wood, clever and safe and dead. Guishan walks up, boots the jug over, and leaves, answering with an act where a label was demanded, and Baizhang gives him the post. The twist Wumen flags is sharp: winning means landing the abbacy, and the commentary says Guishan only swapped the cook's headband for an iron yoke, never really leaping clear of Baizhang's trap. So even the right answer hangs a fresh weight on the winner, which leaves the question of what it would mean to win without picking up the yoke.
'''
