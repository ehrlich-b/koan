number = 18
slug = "dongshan-three-pounds-of-flax"
title_zh = "洞山三斤"
title_en = "Dongshan's Three Jin of Hemp"
title_pinyin = ""

case_zh = '''
洞山和尚。因僧問。如何是佛。山云。麻三斤。
'''
case_en = '''
A monk asked Dongshan, "What is Buddha?"
Dongshan said, "Three jin of hemp."
'''

commentary_zh = '''
洞山老人參得些蚌蛤禪。纔開兩片。露出肝腸。然雖如是且道。向甚處見洞山。
'''
commentary_en = '''
Old Dongshan picked up a little clam Zen. The moment he opens the two halves of his shell, there are his guts for all to see. Even so, tell me, where do you see Dongshan?
'''

verse_zh = '''
突出麻三斤
言親意更親
來說是非者
便是是非人
'''
verse_en = '''
Three jin of hemp, blurted out.
The words land close, the meaning closer.
Whoever comes around talking right and wrong
is the one stirring right and wrong up.
'''

pointer = '''
Dongshan is a Chan master, and a monk asks him the biggest question going: what is Buddha, the awakened reality everyone's chasing? Dongshan doesn't lecture. He just names three jin of hemp (a jin is a Chinese unit of weight), the raw stuff you could spin into cloth, as if the question had a flat, ordinary answer. The bait is the itch to decode it, "hemp must stand for X." Wumen's verse heads you off: if you come around talking right and wrong, you're the one stirring it up. Yunmen pulls the same crude move with the shit-stick in case 21.
'''
