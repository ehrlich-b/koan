number = 42
slug = "woman-comes-out-of-samadhi"
title_zh = "女子出定"
title_en = "The Woman Comes Out of Samadhi"
title_pinyin = ""

case_zh = '''
世尊昔因文殊至諸佛集處。值諸佛各還本處。惟有一女人。近彼佛坐入於三昧。文殊乃白佛。云何女人得近佛坐。而我不得。佛告文殊。汝但覺此女。令從三昧起。汝自問之。文殊遶女人三匝。鳴指一下。乃托至梵天。盡其神力。而不能出。世尊云。假使百千文殊亦出此女人定不得。下方過一十二億河沙國土。有罔明菩薩。能出此女人定。須臾罔明大士從地湧出。禮拜世尊。世尊敕罔明。卻至女人前。鳴指一下。女人於是從定而出。
'''
case_en = '''
Long ago, Manjushri came to a gathering of the buddhas just as they were returning to their own realms. Only a woman remained, sitting near the Buddha, sunk deep in samadhi.

Manjushri asked the Buddha, "How does this woman get to sit near you when I can't?"

The Buddha said, "Just wake her up. Bring her out of samadhi and ask her yourself."

Manjushri circled the woman three times and snapped his fingers once. He lifted her up to the Brahma heaven and threw all his supernatural powers at her. Still he couldn't bring her out.

The Buddha said, "Even a hundred thousand Manjushris couldn't bring her out of samadhi. Far below us, past as many worlds as there are grains of sand in twelve kotis of Ganges Rivers, there's a bodhisattva named Wangming who can."

In an instant Wangming rose out of the earth and bowed to the Buddha. At the Buddha's command he went up to the woman and snapped his fingers once. She came out of samadhi.
'''

commentary_zh = '''
釋迦老子做者一場雜劇。不通小小。且道文殊是七佛之師。因甚出女人定不得。罔明初地菩薩。為甚卻出得。若向者裏。見得親切。業識忙忙　那伽大定。
'''
commentary_en = '''
Old man Shakyamuni staged quite a little circus here, and it's no small thing. Tell me, Manjushri is teacher to seven buddhas. Why couldn't he bring the woman out? Wangming is a bodhisattva of the first stage. Why could he? See into this for yourself. Karmic consciousness in a whirl. The naga's great samadhi.
'''

verse_zh = '''
出得出不得
渠儂得自由
神頭并鬼面
敗闕當風流
'''
verse_en = '''
Can bring her out, can't bring her out.
There's freedom either way.
A god's head and a ghost's face.
Even the slip makes a fine show.
'''

pointer = '''
The players: Shakyamuni, the Buddha; Manjushri, bodhisattva of wisdom, the one you'd bet on in any contest of insight; and Wangming, a bodhisattva at the first of ten stages on the way to buddhahood. Samadhi is deep meditative absorption, and the woman is so far under that the wisest being present cannot reach her, even hauling her up to the Brahma heaven. Read as a ranking puzzle it makes no sense, which is the door. Wumen pushes you past scoring the two of them: his verse speaks of freedom whether she comes out or stays in, so where does that leave your scorekeeping?
'''
