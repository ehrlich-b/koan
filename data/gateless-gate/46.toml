number = 46
slug = "step-from-top-of-pole"
title_zh = "竿頭進步"
title_en = "Step Forward from the Top of the Pole"
title_pinyin = ""

case_zh = '''
石霜和尚云。百尺竿頭如何進步。又古德云。百尺竿頭坐底人。雖然得入。未為真。百尺竿頭須進步十方世界現全身。
'''
case_en = '''
Master Shishuang said, "You're at the top of a hundred-foot pole. How do you step forward?"

An old master said, "The person sitting atop the hundred-foot pole has found a way in, but hasn't reached the genuine thing. From the top of the hundred-foot pole you must step forward and show your whole body throughout the worlds of the ten directions."
'''

commentary_zh = '''
進得步翻得身。更嫌何處不稱尊。然雖如是。且道百尺竿頭如何進步。嗄。
'''
commentary_en = '''
Take the step and turn yourself around, and where wouldn't you stand honored? Even so, tell me, how do you take a step from the top of the hundred-foot pole? Hah!
'''

verse_zh = '''
瞎卻頂門眼
錯認定盤星
拚身能捨命
一盲引眾盲
'''
verse_en = '''
He blinds the eye at the crown of his head.
He takes the wrong mark for zero on the scale.
He can throw himself away and give up his life.
One blind man leads a crowd of the blind.
'''

pointer = '''
Shishuang and the unnamed "old master" are early Chan teachers, and the hundred-foot pole is their image for spiritual progress. You climb to the very top, total stillness, the breakthrough everyone is after, and the trap snaps shut the moment you decide you have arrived. Shishuang asks how to step forward, and the old master says getting there isn't the real thing yet. The instruction is to step forward and show your whole body throughout the "ten directions," which simply means everywhere. That echoes "ordinary mind is the way" (19): the pole was never the destination. Read the verse as a warning, not applause. It ends with one blind man leading a crowd of the blind. So, standing at the top: which way is forward?
'''
