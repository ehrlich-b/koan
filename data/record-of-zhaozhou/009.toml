pointer = '''
The "bright pearl" is an old image for mind: a clear gem that adds nothing and judges nothing, showing a foreigner to a foreigner and a Han Chinese to a Han Chinese, reflecting exactly what arrives. From there Zhaozhou flattens every ranking you might want to keep. A weed and a gilded Buddha statue become interchangeable in his hands, and "Buddha," the goal, turns out to be the same stuff as "affliction," the Buddhist name for the likes of craving, anger, and confusion, the mess you are trying to escape. The monk asks the reasonable next question, how to get free of affliction, and Zhaozhou asks what getting free would be for.
'''
