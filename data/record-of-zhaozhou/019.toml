case_zh = '''
師示眾云：「衲僧家直須坐斷報化佛頭始得。」問：「坐斷報化佛頭是什麼人？」師云：「非你境界。」

'''
case_en = '''
Zhaozhou addressed the assembly: "A monk in a patched robe has to sit right down on the heads of the reward-body and transformation-body Buddhas. Only then will it do."

A monk asked, "And who is it that sits on the heads of those Buddhas?"

Zhaozhou said, "Not your territory."
'''

verse_zh = '''
'''
verse_en = '''
'''

pointer = '''
Buddhism splits the Buddha into "bodies." Two of them sit behind this case: the reward-body, the radiant glorified Buddha you would meet in a vision, and the transformation-body, a form a Buddha takes in the world, like the human teacher who walked northern India twenty-five hundred years ago, both of them objects of worship. Zhaozhou says a monk has to sit right down on the very figures he would ordinarily bow to. So a monk asks the natural follow-up: who is big enough to do that? "Not your territory" brushes him off just as he's asking who qualifies.
'''
