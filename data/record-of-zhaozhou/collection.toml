intro_en = '''
The Record of Zhaozhou collects the sayings of Zhaozhou Congshen, a Tang Chan teacher known for replies that can make a question sound different the second time you hear it. The Gateless Gate preserves his "Wu" (無) and the courtyard cypress. His record also gives us the instruction to have tea, a life story, and a poem that follows one day in a run-down monastery. The record survives in the Song anthology Recorded Sayings of the Ancient Worthies (古尊宿語錄), and the sections here follow the order of that text.

The original text is public domain (from the Xuzangjing), set in our own punctuation. The translations and pointers are released under CC0.
'''
