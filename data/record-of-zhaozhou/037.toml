pointer = '''
A few scenes strung together. Yaoshan was a master Zhaozhou visited; "caught one phrase and stayed full on it ever since" is his joke that a single good line was a lifetime's food. The centerpiece is the prince's visit. The attendants see a monk stay seated when their lord arrives and read it as an insult, so Zhaozhou inverts it: the less he rises, the higher the honor, since only top-rank guests rate being received without getting up. He turns rudeness into the ultimate compliment and the prince buys it outright. Linji was another towering teacher of the same era; when Councilor Zhou holds up a fist as if to signal "I've grasped it," Zhaozhou keeps poking, a fist is just a fist, where is Linji in it. Then Zhou tries "neither coming nor going," a lofty bit of non-attachment talk, and Zhaozhou punctures it on contact: fine, but you still walked in here flapping around like any old crow. Lofty words, ordinary crow, same person.
