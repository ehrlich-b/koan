pointer = '''
A tiny scene, almost a joke, and one of the gentlest in the book. Zhaozhou sits on the platform in silence, then says he is waiting for one more before he speaks. Everyone has already been counted. The monk tops him: when no one comes, I'll tell you, Master. Zhaozhou's reply lands as half praise, half sigh, that a person is hard to find. Underneath the wordplay sits a real question about who his teaching is even for, and whether the room that calls itself full is, by his count, nearly empty.
'''
