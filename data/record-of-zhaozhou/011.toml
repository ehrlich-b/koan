pointer = '''
"The moment you aim your mind, you've already missed" is the line the whole case circles, and it is the same trap Nanquan sprang on the young Zhaozhou back in case 2: reach for the right state and the reaching splits you from it. So the first monk plays it safe and asks about not aiming, and gets hit three times. Even asking about not-aiming gives him something to aim at. The dragon girl is from the Lotus Sutra, the dragon king's young daughter, who hands the Buddha a priceless jewel and goes on to show how quickly she can attain buddhahood. The monk wants to know what she "really" gave. Zhaozhou just cups his hands in the offering gesture, which leaves you to say what, if anything, changed hands.
'''
