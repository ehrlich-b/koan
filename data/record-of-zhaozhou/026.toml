pointer = '''
Calling a buddha to mind, often by reciting the buddha's name over and over, was, and still is, a mainstream devotional practice. Zhaozhou tells the monks to call the Buddha and the teaching to mind, then a monk gets clever and asks which reciting is "truly his own," fishing for some private essence underneath the chant. Zhaozhou turns it straight around: who is the one reciting? That is a real question, the kind that stops you cold, and the monk answers, "One with no companion." Zhaozhou gives him a label of his own: donkey. Ask it yourself and notice how fast you reach for "me."
'''
