case_zh = '''
本自圓成，何勞疊石。名邈雕鐫，與吾懸隔。若人借問，終不指畫。

'''
case_en = '''
Whole and complete from the start.
Why trouble to stack the stones?
A name and a likeness carved in stone
are a long way from me.
If someone should ask,
I won't point it out.
'''

