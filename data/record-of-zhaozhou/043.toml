pointer = '''
One of the short verses that close the record. When a famous Chan teacher died, students built a stupa, a monument that could hold the master's relics and give people a place to pay respects. Zhaozhou watches one going up and tells them not to bother. He puts his name and likeness on one side and himself a long way off. In the last line he imagines someone coming along to ask, and says he won't point it out. Fitting last word from the man who spent a whole book refusing to let himself be turned into an object.
'''
