case_zh = '''
四大猶來造化功，有聲全貴裏頭空。莫怪不與凡夫說，只為宮商調不同。

'''
case_en = '''
The four elements are nature at her work.
It rings only because it's hollow.
Don't blame it for keeping quiet with ordinary folk.
It's just that they're tuned to a different scale.
'''

