pointer = '''
The dragon girl is from the Lotus Sutra, the dragon king's young daughter who offers a priceless jewel to the Buddha and goes on to show that awakening can land all at once, no centuries of grinding needed. She turns up here and in case 11. Zhaozhou calls her gift pure spontaneity, nothing forced. The monk pokes the obvious hole: if it was so natural, why make a deliberate gesture of it, doesn't acting on purpose spoil the "natural"? Zhaozhou flips the objection inside out. How would you know it was natural if she hadn't done it? He makes the monk look back at the offering.
