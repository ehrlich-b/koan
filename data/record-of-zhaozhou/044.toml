pointer = '''
Another of the closing verses. "Zhaozhou" is both the master and the name of his town, and the Stone Bridge was its famous local landmark; the Guanyin Cloister is named for the bodhisattva of compassion, and Maitreya is the buddha-yet-to-come, still waiting in the wings. So three lines just recite real, locatable places and statues. Then the floor drops out: the "patriarch" is Bodhidharma, the Indian monk credited with bringing Chan to China, and legend says that after he died travelers met him walking back to India carrying a single sandal, and when his tomb was opened only one sandal lay inside. You can point to the town, the bridge, the temple, the statue. The sandal is the one thing in the verse nobody can lay a finger on.
'''
