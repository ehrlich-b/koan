pointer = '''
"Neither arising nor ceasing" is standard Buddhist language for the teaching that things don't truly come into being or pass away. The danger is how easily it becomes a slogan, and the instant a monk parrots it back as already settled fact, Zhaozhou nails him for dealing in "dead words," memorized phrases with no life in them. The second monk reaches again for that favorite line, "the great Way isn't hard. It only hates picking and choosing" (see case 14), and tries to use it to trap the teacher. Zhaozhou's move is to quote it straight back, deadpan. The test running under both halves: can you tell the difference between knowing a true sentence and being changed by it.
'''
