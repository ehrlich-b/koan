pointer = '''
This is the death that made Pang a legend, and in Chan accounts an adept may choose the moment of death and die sitting upright and composed. Pang plans his, sending Lingzhao to watch for noon. She reports an eclipse. When he goes to look, she climbs into his seat and dies first, sitting up. "My girl is quick" is a proud father admiring the daughter who just beat him at his own game, one last echo of the bridge in case 23, and seven days pass before his own death. The parting line to the governor is the real bequest: empty out what is there and never make solid what isn't there. It is all shadow and echo. Monks and laypeople called him Vimalakirti, the enlightened layman of the sutras who out-argued the Buddha's disciples, which is the tradition admitting its patron saint of ordinary life never needed the robe.
'''
