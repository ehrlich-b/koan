pointer = '''
This opens the record with its whole argument in one life: Layman Pang (died 808), the householder who woke all the way up without ever shaving his head, "layman" meaning he stayed a householder in ordinary clothes. In Shitou's question, black is a monk's dyed clothing and white is a lay follower's. His first question to the master Shitou, "Who is the one not partnered with the ten thousand things," uses stock phrasing for everything that exists, so he is reaching for the self that isn't tangled into all of it, and Shitou's answer is to clap a hand over his mouth, at which something opens. Pang's poem then plants enlightenment in hauling water and carrying firewood, done without grabbing at things or shoving them away, and when he is asked which life he'll choose he shrugs and stays an ordinary man, which is the bait set for every case ahead. So where exactly is the holy life supposed to happen, if not at the woodpile?
'''
