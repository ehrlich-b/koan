pointer = '''
Pang lived by selling handmade bamboo goods on the road, and here, coming off a bridge, he takes a hard spill. Lingzhao, as quick as her father or quicker, doesn't rush over to haul him up the ordinary way. She drops to the ground beside him, and there they both are in the dirt when she calls that "helping you." It also sets up the deathbed in case 24, where she will outmaneuver him one last time.
'''
