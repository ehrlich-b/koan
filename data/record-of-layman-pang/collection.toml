intro_en = '''
The Record of Layman Pang preserves the sayings of Pang Yun, a Tang Buddhist who practiced as a householder. He studied with Shitou and Mazu, and his daughter Lingzhao is one of his sharpest interlocutors. Blue Cliff Record 42 retells the encounter about falling snow. The record opens with an account of Pang's life and continues with dialogues and occasional verses. The numbered sections follow the order of the record.

The original text is public domain (from the Xuzangjing), set in our own punctuation. The translations and pointers are released under CC0.
'''
