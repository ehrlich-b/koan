source_note = "The Record of Layman Pang (龐居士語錄), from the public-domain Xuzangjing (卍續藏, vol. 69, no. 1336), set in our own punctuation. It gives the recorded sayings (fascicle 1) — Pang's life-record followed by his encounter dialogues with the masters of his day; the two fascicles of his poems (詩) and the later masters' verses of praise (歷代讚文) are omitted."
