居士後之江西參馬祖大師，問曰：「不與萬法為侶者是什麼人？」祖曰：「待汝一口吸盡西江水即向汝道。」士於言下頓領玄旨，遂呈偈，有「心空及第」之句，乃留駐。參承二載，有偈曰：「有男不婚，有女不嫁，大家團圞頭，共說無生話。」士一日又問祖曰：「不昧本來人，請師高著眼。」祖直下覷。士曰：「一等沒絃琹，惟師彈得妙。」祖直上覷。士禮拜。祖歸方丈，士隨後曰：「適來弄巧成拙。」士一日又問祖曰：「如水無筋骨，能勝萬斛舟，此理如何？」祖曰：「這裏無水亦無舟，說什麼筋骨？」

'''
case_en = '''
Later the Layman went to Jiangxi to study with Master Mazu. He asked, "Who is the one who keeps no company with the ten thousand things?"

Mazu said, "I'll tell you once you've swallowed the whole West River in a single gulp."

At those words Pang suddenly grasped the deep point. He presented a verse that included the line, "An empty mind passes the exam." Then he stayed on, studying under Mazu for two years.

He wrote another verse:

I have a son who won't marry,
a daughter who won't wed.
The whole family sits in a circle
talking about non-arising.

One day the Layman asked Mazu again, "Master, look well at the original person who's never in the dark."

Mazu looked straight down.

The Layman said, "The same stringless zither, yet you're the one who plays it so well."

Mazu looked straight up.

The Layman bowed. Mazu went back to his quarters, and the Layman followed him, saying, "A clever move just turned into a botch."

Another day the Layman asked Mazu, "Water has no sinews or bones, yet it can bear a ship carrying ten thousand measures of cargo. How does that work?"

Mazu said, "Here there's no water and no ship. What sinews and bones are you talking about?"
