case_zh = '''
元和中，居士北遊襄漢，隨處而居。有女靈照，常鬻竹漉籬，以供朝夕。士有偈曰：
心如境亦如，無實亦無虗。
有亦不管，無亦不拘。
不是賢聖，了事凡夫。
易復易，即此五蘊有真智。
十方世界一乘同，無相法身豈有二？
若捨煩惱入菩提，不知何方有佛地。
護生須是殺，殺盡始安居。
會得箇中意，鉄船水上浮。

'''
case_en = '''
During the Yuanhe era, Layman Pang traveled north into the Xiang and Han river country, settling wherever he came to rest. His daughter Lingzhao regularly sold bamboo strainers to provide for them day to day.

The layman had a verse:

Mind is such, and so is what it meets.
Nothing solid, nothing illusory.
What's there, I don't bother with.
I don't get stuck on what's absent.
No sage or saint,
just an ordinary man who's settled the matter.
Easy, easy again, true wisdom is here in these five aggregates.
In all ten directions the worlds share the One Vehicle.
How could the formless Dharma body be two?
If you abandon affliction to enter awakening,
where on earth will you find the ground of a buddha?
To guard life you must kill.
Kill it all, and only then can you rest.
Catch what this points to,
and an iron boat floats on water.
'''

