pointer = '''
By now Pang is wandering through river country, with Lingzhao keeping them both fed by selling strainers, and this is one of the longer verses in the record. It runs the stock terms past us: the "five aggregates" are the Buddhist name for the bundle that makes up a person, body and sensation and perception and the rest, and the "formless Dharma body" names the Buddha as reality itself. Pang's move throughout is to collapse the gaps people imagine, between trouble and enlightenment, ordinary and holy, here and some better elsewhere, which is why he says good luck finding where the Buddha lives if you throw off your troubles to go chasing it. The last lines put killing beside protecting life, then put an iron boat on the water.
'''
