number = 53
slug = ""
title_zh = ""
title_en = "Mazu's Wild Ducks"

intro_zh = '''
遍界不藏，全機獨露。觸途無滯，著著有出身之機；句下無私，頭頭有殺人之意。且道：古人畢竟向什麼處休歇？試舉看。

'''
intro_en = '''
Nothing is hidden anywhere in the world. The whole working of it lies bare. Whatever road you take, no snag, no stall. Every move opens a way out. Every word is given freely, yet at every turn there's the intent to kill. Tell me, then: where does the old master finally come to rest? Take a look.
'''

case_zh = '''
馬大師與百丈行次，見野鴨子飛過。大師云：「是什麼？」丈云：「野鴨子。」大師云：「什麼處去也？」丈云：「飛過去也。」大師遂扭百丈鼻頭，丈作忍痛聲。大師云：「何曾飛去！」

'''
case_en = '''
Mazu was walking with Baizhang when some wild ducks flew past.
Mazu said, "What are those?"
Baizhang said, "Wild ducks."
Mazu said, "Where did they go?"
Baizhang said, "They flew past."
Mazu twisted the tip of Baizhang's nose. Baizhang yelped.
Mazu said, "When did they ever fly away?"
'''

verse_zh = '''
野鴨子，
知何許？
馬祖見來相共語。
話盡山雲海月情，
依前不會還飛去。
欲飛去，
却把住，
道道。

'''
verse_en = '''
Wild ducks,
where are they?
Mazu sees them coming and the two start talking.
They talk it all out, the feeling of mountain clouds and moon over the sea.
Still no understanding, and off they fly again.
About to fly off,
caught and held fast.
Speak! Speak!
'''

pointer = '''
Mazu is one of the great Tang teachers, the source of much of this whole tradition; Baizhang is his student, walking beside him when wild ducks fly past. Baizhang answers the way anyone would. They're ducks, and they flew past. Mazu twists his nose, real pain right here and now, and asks when they ever flew away. You'll meet Mazu again in case 73, scattering a monk's careful logic.
'''
