number = 97
slug = ""
title_zh = ""
title_en = "The Diamond Sutra's Scorn"

intro_zh = '''
拈一放一，未是作家；舉一明三，猶乖宗旨。直得天地𨺗變，四方絕唱，雷奔電馳，雲行雨驟，傾湫倒嶽，甕瀉盆傾，也未提得一半在。還有解轉天關、能移地軸底麼？試舉看。

'''
intro_en = '''
Pick one up, set one down: that is not yet a master at work. Raise one corner and grasp the other three, and you have already missed the point. Though heaven and earth suddenly change, though the four quarters break into unsurpassed song, though thunder cracks and lightning streaks, clouds roll and rain comes down in sheets, lakes tip over and mountains topple, jars and basins pour out their water, still you have brought forth less than half of it. Is there anyone who can throw the bolt on heaven's gate and swing the axis the earth turns on? Let's see.
'''

case_zh = '''
金剛經云：「若為人輕賤，是人先世罪業應墮惡道，以今世人輕賤故，先世罪業則為消滅。」

'''
case_en = '''
The Diamond Sutra says: "If such a person is treated with contempt, the wrongs they did in former lives would have led to a bad rebirth. Because people treat them with contempt in this life, the bad karma from their former lives is wiped away."
'''

verse_zh = '''
明珠在掌，
有功者賞。
胡漢不來，
全無技倆。
伎倆既無，
波旬失途。
瞿曇瞿曇，
識我也無？

'''
verse_en = '''
A bright pearl in the palm.
The prize goes to the one who earns it.
No Hu or Han comes,
and there's no skill to show.
With no skill to show,
Mara loses the trail.
Gautama, Gautama,
do you know me?
'''

pointer = '''
The Diamond Sutra is one of the most famous Buddhist scriptures, and this line is a real head-scratcher: if you keep and recite this sutra and get kicked around in this life, that is good news, your old bad karma burning off cheap so you dodge a far worse rebirth. The puzzle the case plays with is how an insult can be a reward and what it even means for "crimes" to vanish. In the verse, a bright pearl sits in your palm, a prize for the one who earns it. Hu and Han, foreigners and Chinese, together mean anybody at all, and when no one shows up to test you there is nothing left to perform. Mara, the tempter, loses the trail once there's no skill left to show. The last line needles the Buddha himself, calling him Gautama and asking whether he even knows who's speaking.
'''
