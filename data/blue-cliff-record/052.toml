case_zh = '''
僧問趙州：「久響趙州石橋，到來只見略彴。」州云：「汝只見略彴，且不見石橋。」僧云：「如何是石橋？」州云：「渡驢渡馬。」

'''
case_en = '''
A monk said to Zhaozhou, "I've long heard of Zhaozhou's stone bridge. Now that I'm here, all I see is a log footbridge."

Zhaozhou said, "You see the log footbridge. You don't see the stone bridge."

The monk said, "What is the stone bridge?"

Zhaozhou said, "It carries donkeys across. It carries horses across."
'''

verse_zh = '''
孤危不立道方高，
入海還須釣巨鼇。
堪笑同時灌溪老，
解云劈箭亦徒勞。

'''
verse_en = '''
He won't perch on the lonely peak, and that is what makes the Way run high.
To fish the ocean you need a hook that lands the giant turtle.
Old Guanxi, his contemporary, makes me laugh.
He knows how to say "split an arrow," and even that's wasted effort.
'''

pointer = '''
Zhaozhou is one of the most quoted Tang masters, and he took his name from the district where he taught, which was known for a grand stone bridge. The monk is a smart-aleck testing him: I came all this way for the legendary Zhaozhou, and all I find is a plain log footbridge. Zhaozhou doesn't get defensive and doesn't take the dig. He flips it. The monk sees a humble footbridge, Zhaozhou says, and then he tells him what the stone bridge does. It carries every donkey and horse across, no questions asked. The verse adds that a real master won't pose on some lonely unreachable summit, and Zhaozhou's hook is big enough to land anyone. The jab at "old Guanxi," a contemporary teacher whose line about splitting an arrow the verse calls wasted effort, is just there to make Zhaozhou look better by comparison.
'''
