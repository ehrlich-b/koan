title_en = "Baling's Hair-Cutting Sword"

intro_zh = '''
收因結果，盡始盡終，對面無私，元不曾說。忽有箇出來道：「一夏請益，為什麼不曾說？」待爾悟來，向爾道。且道：為復是當面諱却，為復別有長處？試舉看。

'''
intro_en = '''
Gather the causes and bring them to fruition, all the way from beginning to end. Face to face, nothing held back, and yet not a word has ever been said. Suppose someone steps out and says, "We've asked for instruction all summer. Why do you say you never spoke?" Wait until you wake up. Then I'll tell you. So which is it: am I dodging the question right to your face, or is there more to it? Let's look.
'''

case_zh = '''
僧問巴陵：「如何是吹毛劍？」陵云：「珊瑚枝枝撐著月。」

'''
case_en = '''
A monk asked Baling, "What is the hair-cutting sword?"
Baling said, "Each branch of coral holds up the moon."
'''

verse_zh = '''
要平不平，
大巧若拙。
或指或掌，
倚天照雪。
大冶兮磨礱不下，
良工兮拂拭未歇。
萬斛盈舟信手拏，
却因一粒甕吞蛇。
拈提百轉舊公案，
撒却時人幾眼沙。

'''
verse_en = '''
You want to level what's uneven.
Great skill looks clumsy.
Sometimes a finger, sometimes a palm,
it leans against heaven and shines on the snow.
The great smith can't grind down this edge.
The good craftsman keeps polishing, never done.
A boat brimming with ten thousand measures, taken with an easy hand.
Yet for one grain, a jar swallows a snake.
He trots out the old cases and turns them a hundred ways.
Into how many eyes has he thrown sand?
'''

pointer = '''
The book closes on its sharpest image. A "hair-cutting sword" is the legendary blade so keen that a single hair blown against its edge falls in two, Chan shorthand for the wisdom that severs every delusion in one clean stroke. So the monk is asking, show me that razor. Baling refuses to define it and answers with a line of poetry instead, branches of coral each one propping up the moon, beautiful and concrete and seemingly beside the point. The intro is the editor Yuanwu running the same game, insisting that after a whole summer of requests for teaching nothing has actually been "said." The verse gives that sword an edge the great smith cannot grind down and a craftsman who never stops polishing it. It ends with a wry question about how many readers have got sand in their eyes from all this clever commentary, this whole hundred-case book. A fitting last word from a collection that loved the originals too much to ever quite explain them.
'''
