'''
verse_en = '''
The six consciousnesses idle, and still a question is put.
Masters have sorted out where it comes from together.
Rushing water as far as you can see, and someone bats a ball.
It never stops where it lands. Who knows how to watch?
'''

pointer = '''
Buddhist psychology counts six consciousnesses, one for each of the usual five senses plus one for the thinking mind. The monk's trick question: a newborn has eyes, ears, and a brain, but is not yet carving the world into me-and-that or like-and-dislike, so is the equipment really switched on? Zhaozhou refuses the yes or no and throws an image instead, a ball batted across fast water, never pausing where it lands. Touzi, asked to unpack the same picture, simply keeps it in motion: thought after thought, never resting, flowing on. Can you watch your mind move without grabbing?
'''
