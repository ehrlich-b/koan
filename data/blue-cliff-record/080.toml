case_zh = '''
僧問趙州：「初生孩子，還具六識也無？」趙州云：「急水上打毬子。」僧復問投子：「急水上打毬子，意旨如何？」子云：「念念不停流。」

'''
case_en = '''
A monk asked Zhaozhou, "Does a newborn child have the six consciousnesses?"
Zhaozhou said, "Batting a ball on rushing water."
The monk asked Touzi, "What does 'batting a ball on rushing water' mean?"
Touzi said, "Thought after thought, never resting, flowing on."
'''

verse_zh = '''
