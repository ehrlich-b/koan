case_zh = '''
古有十六開士，於浴僧時隨例入浴，忽悟水因。諸禪德，作麼生會？他道：「妙觸宣明，成佛子住。」也須七穿八穴始得。

'''
case_en = '''
Long ago, sixteen bodhisattvas went to bathe at the monks' bath time, as was customary, and suddenly awoke through water. Worthy Chan practitioners, how do you understand this? They said, "Wondrous touch brought clarity, and we came to dwell as children of the Buddha." You still have to break through seven holes and eight openings to get there.
'''

verse_zh = '''
了事衲僧消一箇，
長連床上展脚臥。
夢中曾說悟圓通，
香水洗來驀面唾。

'''
verse_en = '''
One monk who's done with his business is enough.
On the long platform he stretches out his legs and lies down.
Once, in a dream, he held forth on awakening to perfect understanding.
Wash him with scented water and he spits in your face.
'''

pointer = '''
This comes from the Shurangama Sutra, where the Buddha goes around the room asking each student how they broke through. Bhadrapala speaks for sixteen of them: it happened in the bath. They stepped into the water, felt it on their skin, and something gave way. Xuedou's warning is aimed at the obvious temptation, which is to make a cozy religious experience out of it. A few warm words about "perfect awakening" are dream-talk, he says, and the verse closes with the sort of person who would spit your pretty answer back in your face.
'''
