number = 27
slug = ""
title_zh = ""
title_en = "Yunmen's Withered Tree"

intro_zh = '''
問一答十，舉一明三，見兔放鷹，因風吹火。不惜眉毛則且置，只如入虎穴時如何？試舉看。

'''
intro_en = '''
Ask one thing, get ten back. Raise one thing, and three become clear. Spot the rabbit, loose the hawk. Use the wind to fan the fire. The ones who'll risk their own eyebrows to do it we'll set aside for now. But the moment you walk into the tiger's den, what then? Let's look.
'''

case_zh = '''
僧問雲門：「樹凋葉落時如何？」雲門云：「體露金風。」

'''
case_en = '''
A monk asked Yunmen, "What about when the tree withers and the leaves fall?"
Yunmen said, "Body laid bare in the autumn wind."
'''

verse_zh = '''
問既有宗，
答亦攸仝。
三句可辨，
一鏃遼空。
大野兮涼飈颯颯，
長天兮疎雨濛濛。
君不見少林久坐未歸客，
靜依熊耳一叢叢。

'''
verse_en = '''
The question had its point,
the answer met it dead-on.
Three phrases can be made out,
one arrowhead ranges across the sky.
Across the great plain, a cold wind whistles.
Under the vast sky, a scattered rain drifts.
Don't you see the long-sitting guest at Shaolin who never went home,
quiet among the thick growth on Bear's Ear Mountain.
'''

pointer = '''
Yunmen, the tenth-century master whose calling card is the surprising one-liner, gets a question that only sounds seasonal. "When the tree withers and the leaves fall" could be what it sounds like, or what happens when everything you've propped yourself up with falls away, every idea and support stripped off. The monk is braced for consolation about loss. Yunmen gives him the opposite. The "metal wind" in his answer is the autumn wind, named for the phase associated with fall in the old Chinese calendar. It's the wind doing the stripping, and what it leaves is the tree's actual shape, laid bare. The verse closes on Bodhidharma, who supposedly sat facing a wall nine years at Shaolin and now rests on Bear's Ear Mountain, another figure left out in the weather.
'''
