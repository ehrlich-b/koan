case_zh = '''
僧問雲門：「如何是一代時教？」雲門云：「對一說。」

'''
case_en = '''
A monk asked Yunmen, "What is the teaching of the Buddha's whole lifetime?"
Yunmen said, "One statement in reply."
'''

verse_zh = '''
對一說，
太孤絕。
無孔鐵鎚重下楔。
閻浮樹下笑呵呵，
昨夜驪龍拗角折。
別，別！
韻陽老人得一橛。

'''
verse_en = '''
One statement in reply,
utterly alone, cut clean.
Into the iron hammer with no hole, drive another wedge.
Under the jambu tree, laughing out loud.
Last night the black dragon's horn was twisted off.
Something else, something else!
The old man of Shaoyang got hold of one peg.
'''

pointer = '''
Yunmen Wenyan (864–949), the Five Dynasties master with the fastest tongue in Chan, specialized in short answers that shut a question down and split it open in the same beat. The monk asks the big one: sum up everything the Buddha taught across an entire life. Both honest exits are mined. Say something specific and you have shrunk a lifetime to a slogan; say "it is beyond words" and you are just ducking. Yunmen's reply, literally "facing one, speak," gives the monk a single statement and puts someone there to hear it. The verse heaps on impossible images, a hammer with no hole to take a wedge, a dragon's horn snapped clean off, to say he did the thing that should not be doable. "The old man of Shaoyang" is Xuedou's name for Yunmen. Notice the answer is built to be re-aimed. A different person could be standing there.
'''
