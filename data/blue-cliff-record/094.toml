number = 94
slug = ""
title_zh = ""
title_en = "The Buddha's Not-Seeing"

intro_zh = '''
聲前一句，千聖不傳；面前一絲，長時無間。淨裸裸，赤灑灑，露地白牛，眼卓朔，耳卓朔。金毛獅子則且置，且道：作麼生是露地白牛？

'''
intro_en = '''
The one phrase before sound: a thousand sages never handed it down. The single thread right in front of you is never broken. Naked and bare, the white ox in the open field, eyes and ears alert. Set aside the golden-maned lion. Tell me: what is the white ox in the open field?
'''

case_zh = '''
楞嚴經云：「吾不見時，何不見吾不見之處？若見不見，自然非彼不見之相；若不見吾不見之地，自然非物，云何非汝？」

'''
case_en = '''
The Shurangama Sutra says: "When I don't see, why don't you see where I don't see? If you could see my not-seeing, what you saw wouldn't be the mark of my not-seeing. And if you can't see where I don't see, then it is plainly no object. How could it be anything other than you?"
'''

verse_zh = '''
全象全牛瞖不殊，
從來作者共名模。
如今要見黃頭老，
剎剎塵塵在半途。

'''
verse_en = '''
To a clouded eye, the whole elephant and the whole ox look alike.
Adept teachers have always called them by name and traced their forms.
Now, if you want to see the old Yellow Head,
in every world, in every speck of dust, you're still halfway there.
'''

pointer = '''
This case is not the usual teacher-and-student exchange but a knotty quote lifted straight from the Shurangama Sutra, where the Buddha is needling his disciple Ananda about what "seeing" even is. If Ananda could see the Buddha's not-seeing the way he sees a cup or a tree, the Buddha says he would be looking at something else. The intro stacks up stock images, a white ox standing plain in an open field with its ears up, and a golden-maned lion. The trap is the brain-knotting line in the middle, where trying to see someone else's not-seeing ties you up.
'''
