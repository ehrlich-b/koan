intro_en = '''
The Blue Cliff Record (Chinese: Biyan Lu, Japanese: Hekiganroku) is a Song dynasty collection based on one hundred cases that Xuedou Chongxian selected and set in verse in the eleventh century. In the early twelfth century, Yuanwu Keqin added introductions, prose commentary, and brief remarks interleaved with the cases and verses.

This edition gives the case (本則), Xuedou's verse (頌), and Yuanwu's introduction (垂示) where present. We omit Yuanwu's prose commentary and his interlinear "capping phrases."

The original text is in the public domain. It comes from the Taisho Tripitaka and uses our own punctuation. The translations and pointers are released under CC0.
'''
