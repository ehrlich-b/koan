slug = ""
title_zh = ""
title_en = "Zhimen's Lotus"

intro_zh = '''
建法幢，立宗旨，錦上鋪花；脫籠頭，卸角馱，太平時節。或若辨得格外句，舉一明三；其或未然，依舊伏聽處分。

'''
intro_en = '''
Raise the Dharma banner and set out the school's teaching: flowers laid on brocade. Slip off the halter and unload the pack: peacetime at last. If you can make out a saying outside the usual rules, one thing raised makes three clear. Otherwise, stand by as before and hear your sentence.
'''

case_zh = '''
僧問智門：「蓮花未出水時如何？」智門云：「蓮花。」僧云：「出水後如何？」門云：「荷葉。」

'''
case_en = '''
A monk asked Zhimen, "What about the lotus before it breaks the surface?"
Zhimen said, "Lotus blossom."
The monk said, "And after it clears the water?"
Zhimen said, "Lotus leaf."
'''

verse_zh = '''
蓮花荷葉報君知，
出水何如未出時。
江北江南問王老，
一狐疑了一狐疑。

'''
verse_en = '''
Lotus blossom, lotus leaf: there's your answer.
Out of the water, still in it, what's the difference?
North of the river, south of the river, go ask old Wang.
One doubt put to rest, and here comes the next.
'''

pointer = '''
The monk is fishing for a clean distinction: the lotus before it breaks the surface, hidden and not yet, against the lotus after, open and realized. He wants Zhimen to confirm that awakening runs on a before-and-after, a thing you lack and then possess. Zhimen names a blossom before it breaks the surface and a leaf after, two different parts of the same plant. "Old Wang" is Nanquan, the teacher whose family name was Wang, though Xuedou makes him sound like the next guy down the road. The verse's punchline is that chasing this kind of answer only swaps one nagging doubt for the next in line. There's the same temptation to chase down what the object stands for when Dongshan says "three pounds of flax" at case 12.
'''
