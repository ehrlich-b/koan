case_zh = '''
僧問趙州：「至道無難，唯嫌揀擇，是時人窠窟否？」州云：「曾有人問我，直得五年分疎不下。」

'''
case_en = '''
A monk said to Zhaozhou, "'The Great Way isn't hard. It only hates picking and choosing.' Isn't that line a den people crawl into and hide?"
Zhaozhou said, "Someone asked me that once. For five years I couldn't talk my way out of it."
'''

verse_zh = '''
象王嚬呻，
獅子哮吼。
無味之談，
塞斷人口。
南北東西，
烏飛兔走。

'''
verse_en = '''
The king of elephants stretches and yawns,
the lion roars.
Flavorless talk
that shuts everyone's mouth.
North, south, east, west,
the crow flies, the rabbit runs.
'''

pointer = '''
Same famous line as the case before it: the Great Way isn't hard, it only hates picking and choosing, the opening of a well-worn Zen poem called the Xinxinming about dropping the habit of sorting everything into like and dislike. By Zhaozhou's day the line was a greatest hit, quoted so often it had hardened into a slogan people could hide behind. So the monk sets a sly trap: isn't that very quote just another cozy den you crawl into to dodge the real work? Agree and he's snared you, defend the line and you're stuck inside the den he named. Zhaozhou takes neither door. Instead of arguing he admits that someone pinned him with this same question and he couldn't talk his way out of it for five years. The verse closes on the crow and the rabbit, old shorthand for sun and moon: while you debate the slogan, the days are flying.
'''
