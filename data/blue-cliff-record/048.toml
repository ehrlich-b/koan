case_zh = '''
王太傅入招慶煎茶。時朗上座與明招把銚，朗翻却茶銚。太傅見問上座：「茶爐下是什麼？」朗云：「捧爐神。」太傅云：「既是捧爐神，為什麼翻却茶銚？」朗云：「仕官千日，失在一朝。」太傅拂袖便去。明招云：「朗上座喫却招慶飯了，却去江外打野榸。」朗云：「和尚作麼生？」招云：「非人得其便。」雪竇云：「當時但踏倒茶爐。」

'''
case_en = '''
Grand Tutor Wang came to Zhaoqing to make tea. Elder Lang and Mingzhao were handling the kettle when Lang knocked it over.

Wang saw it and asked Lang, "What's under the tea stove?"

Lang said, "The spirit that holds up the stove."

Wang said, "If a spirit holds up the stove, how did the kettle tip over?"

Lang said, "Serve in office a thousand days, lose it in a single morning." Wang flicked his sleeves and left.

Mingzhao said, "Elder Lang, you've eaten Zhaoqing's rice, and now you go across the river to knock on burnt stumps."

Lang said, "And what would you say?"

Mingzhao said, "A spirit saw its chance."

Xuedou said, "Right then I'd just have kicked the tea stove over."
'''

