title_en = "Yanguan's Rhino Fan"

intro_zh = '''
超情離見，去縛解粘，提起向上宗乘，扶竪正法眼藏，也須十方齊應，八面玲瓏。直到恁麼田地，且道：還有同得同證、同死同生底麼？試舉看。

'''
intro_en = '''
Go beyond feelings and views. Untie the cords and loosen what sticks. Lift up the highest teaching and uphold the treasury of the true Dharma eye. You have to respond in all ten directions at once, clear and bright on every side. And even when you reach that ground, tell me: is there anyone who has attained and verified it with you, who dies and lives with you? Take a look.
'''

case_zh = '''
鹽官一日喚侍者：「與我將犀牛扇子來。」侍者云：「扇子破也。」官云：「扇子既破，還我犀牛兒來。」侍者無對。投子云：「不辭將出，恐頭角不全。」雪竇拈云：「我要不全底頭角。」石霜云：「若還和尚即無也。」雪竇拈云：「犀牛兒猶在。」資福畫一圓相，於中書一牛字。雪竇拈云：「適來為什麼不將出？」保福云：「和尚年尊，別請人好。」雪竇拈云：「可惜勞而無功。」

'''
case_en = '''
One day Yanguan called to his attendant: "Bring me the rhino fan."
The attendant said, "The fan's broken."
Yanguan said, "If the fan's broken, then bring me back the rhino."
The attendant had nothing to say.

Touzi said: "I wouldn't refuse to bring it out. I'm afraid the head and horn wouldn't be whole."
Xuedou comments: "I want that head and horn, incomplete as they are."

Shishuang said: "If I gave it back to you, Master, there'd be no rhino."
Xuedou comments: "The rhino's still here."

Zifu drew a circle and wrote the character for "ox" inside it.
Xuedou comments: "Why didn't you bring it out a minute ago?"

Baofu said: "You're venerable in years, Master. Better ask somebody else."
Xuedou comments: "A shame. All that work and nothing to show for it."
'''

verse_zh = '''
犀牛扇子用多時，
問著元來總不知。
無限清風與頭角，
盡同雲雨去難追。

'''
verse_en = '''
The rhino fan has seen long use.
Ask about it, and it turns out no one knows a thing.
The endless cool breeze, the head and horn,
gone with the clouds and rain, past all chasing.
'''

pointer = '''
Yanguan was a Tang master, and the "rhino fan" is a real luxury item, a fan fitted with rhinoceros horn. The gag starts plain: the master asks for his fan, the servant says it is busted, and Yanguan flips it, fine, if the fan's wrecked then bring me back the rhino. He is poking at whether the real thing behind the worn-out object can be handed over at all. The attendant freezes. Then four more heavyweight masters take their swings at the question, and the editor Xuedou has a word for each one. Zifu writes "ox," the second character in the Chinese word for rhinoceros, inside his circle. So where did it go when the fan broke?
'''
