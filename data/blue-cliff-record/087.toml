title_zh = ""
title_en = "Yunmen's Medicine and Sickness"

intro_zh = '''
明眼漢沒窠臼，有時孤峯頂上草漫漫，有時鬧市裏頭赤灑灑。忽若忿怒那吒，現三頭六臂；忽若日面月面，放普攝慈光，於一塵現一切身，為隨類人，和泥合水。忽若撥著向上竅，佛眼也覻不著，設使千聖出頭來，也須倒退三千里。還有同得同證者麼？試舉看。

'''
intro_en = '''
A man with clear eyes fits no mold. One moment he's up on a lonely peak where the weeds run wild. The next he's down in the crowded market, naked and exposed. Sometimes he flares up like the guardian deity Nezha, three heads and six arms. Sometimes, like Sun-Face Buddha or Moon-Face Buddha, he sheds the light of compassion that takes everyone in. In a single speck of dust he appears in every form there is, mixing mud and water to meet each kind of person. And sometimes he touches the pivot beyond it all, and even a Buddha's eye can't find him. Bring out a thousand saints in a row and they'd still fall back three thousand miles. Has anyone attained and verified it along with him? Take a look.
'''

case_zh = '''
雲門示眾云：「藥病相治，盡大地是藥，那箇是自己治？」

'''
case_en = '''
Yunmen spoke to the assembly: "Medicine and sickness counter each other. The whole earth is medicine. Which is your own cure?"
'''

verse_zh = '''
盡大地是藥，
古今何太錯。
閉門不造車，
通途自寥廓。
錯錯，
鼻孔遼天亦穿却。

'''
verse_en = '''
The whole earth is medicine.
Past and present, how could it be so wrong?
Behind a closed door, no cart gets built.
The open road runs wide and clear on its own.
Wrong, wrong.
Nostrils as high as the sky, and still pierced right through.
'''

pointer = '''
Yunmen (864–949, Five Dynasties) specialized in one-line gut-punches, and this one starts from an old Buddhist picture: the Buddha's teachings are medicine prescribed for the sickness of a confused mind, different cures for different ills. Yunmen pushes the metaphor until it snaps. If everything that exists is medicine, every thing, every teaching, every experience, all of it curing something, then where does that leave you, the patient swallowing it? The bait is the wish for a clean separation between the one who is sick, the cure, and the one who gets cured. The verse's punchline about not building your cart behind a closed door flips a proverb in which a cart built behind closed doors still fits the ruts when you take it out. So when the whole earth is the medicine, which is your own cure?
'''
