title_zh = ""
title_en = "Tianping's Two Wrongs"

intro_zh = '''
一夏嘮嘮打葛藤，幾乎絆倒五湖僧。金剛寶劍當頭截，始覺從來百不能。且道：作麼生是金剛寶劍？眨上眉毛，試請露鋒鋩看。

'''
intro_en = '''
A whole summer retreat of chatter, twisting vines into tangles. It nearly tripped up every monk in the land. Then the diamond sword comes straight down and cuts it clean, and only then do you see you never could do a thing. So tell me, what is the diamond sword? Lift an eyebrow. Go on, show me its edge.
'''

case_zh = '''
天平和尚行脚時參西院，常云：「莫道會佛法，覓箇舉話人也無。」一日，西院遙見，召云：「從漪！」平舉頭。西院云：「錯！」平行三兩步。西院又云：「錯！」平近前。西院云：「適來這兩錯，是西院錯，是西院錯，是上座錯？」平云：「從漪錯。」西院云：「錯！」平休去。西院云：「且在這裏過夏，待共上座商量這兩錯。」平當時便行。後住院，謂眾云：「我當初行脚時，被業風吹，到思明長老處，連下兩錯，更留我過夏，待共我商量。我不道恁麼時錯，我發足向南方去時，早知道錯了也。」

'''
case_en = '''
When Tianping was traveling to visit teachers, he went to see Xiyuan. He liked to say, "Leave understanding the Buddha's teaching aside. I can't even find someone who can bring up a case."

One day Xiyuan saw him in the distance and called out, "Congyi!"

Tianping looked up.

Xiyuan said, "Wrong!"

Tianping took two or three steps.

Xiyuan said again, "Wrong!"

Tianping came up close.

Xiyuan said, "Those two 'wrongs' just now. Was Xiyuan wrong? Was Xiyuan wrong? Or were you wrong?"

Tianping said, "It was me, Congyi, who was wrong."

Xiyuan said, "Wrong!"

Tianping let it drop.

Xiyuan said, "Stay here for the summer retreat. I want to go over those two 'wrongs' with you."

But Tianping left on the spot.

Later, when he had a temple of his own, he told his monks: "When I first set out, the wind of karma blew me to Elder Siming. Twice he hit me with 'Wrong!' Then he wanted me to stay for the summer retreat and go over it with him. I'm not saying I was wrong back then. When I first set out for the south, I already knew I was wrong."
'''

verse_zh = '''
禪家流，
愛輕薄，
滿肚參來用不著。
堪悲堪笑天平老，
却謂當初悔行脚。
錯錯，
西院清風頓銷鑠。

'''
verse_en = '''
These Chan people
love to be glib.
Bellies stuffed with training, and none of it any use.
Old Tianping is both funny and sad.
Now he says he wishes he'd never hit the road.
Wrong! Wrong!
Xiyuan's clear breeze has vanished all at once.
'''

pointer = '''
Tianping is a cocky monk on his walking tour of teachers, going around announcing he can't find anyone who can even bring up a case. Xiyuan, also called Elder Siming, decides to find out. He simply calls Tianping's name, and the moment Tianping looks up, fires off "Wrong!", then does it again, with no reason given. The trap is that Xiyuan asks who was wrong without saying what went wrong. He asks twice whether he's the one, and Tianping pins the error on himself. He bolts rather than stay and look at what just happened, and later, running his own temple, he says he knew he was wrong before he ever reached Xiyuan. The verse's verdict is that a belly full of training was no use, and it ends with Xiyuan's clear breeze gone.
'''
