number = 82
slug = ""
title_zh = ""
title_en = "Dalong's Indestructible Body"

intro_zh = '''
竿頭絲線，具眼方知；格外之機，作家方辨。且道：作麼生是竿頭絲線、格外之機？試舉看。

'''
intro_en = '''
A silk line dangling from the tip of the pole: only the clear-eyed catch it. A move beyond the usual forms: only an adept can spot it. So tell me, what is that silk line at the pole's tip, that move past all the rules? Take a look.
'''

case_zh = '''
僧問大龍：「色身敗壞，如何是堅固法身？」龍云：「山花開似錦，㵎水湛如藍。」

'''
case_en = '''
A monk asked Dalong, "The body of flesh rots and falls apart. What is the indestructible Dharma body?"

Dalong said, "Mountain flowers bloom like brocade. The clear stream in the ravine is blue as indigo."
'''

verse_zh = '''
問曾不知，
答還不會。
月冷風高，
古巖寒檜。
堪笑路逢達道人，
不將語默對。
手把白玉鞭，
驪珠盡擊碎。
不擊碎，
增瑕纇。
國有憲章，
三千條罪。

'''
verse_en = '''
He asks and has never known.
He answers and still doesn't understand.
Cold moon, high wind,
old cliff, cold juniper.
You meet someone on the road who knows the Way, and it's a laugh.
Face them with neither words nor silence.
With a white jade whip in hand,
smash the black dragon's pearls to bits.
Don't smash it,
and the flaws multiply.
The country has its laws:
three thousand punishable offenses.
'''

pointer = '''
The monk is chasing the oldest worry there is: this body rots and dies, so where is the part of me that lasts? He wants Dalong to point at the Dharma body, a Buddhist name for the Buddha as the truth he realized. Dalong answers with the scenery, mountain flowers, a blue stream. The verse stacks up images of cold, knife-edged clarity, high wind and cold juniper, then turns playful: when you finally meet someone who has it, you cannot pin it down with talk, and you cannot pin it down with pointed silence either. In old lore, the black dragon's pearl is a treasure you have to reach under the dragon's chin to get, and here it gets smashed to bits.
'''
