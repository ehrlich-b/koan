case_zh = '''
僧問大光：「長慶道『因齋慶讚』，意旨如何？」大光作舞。僧禮拜。光云：「見箇什麼便禮拜？」僧作舞。光云：「這野狐精。」

'''
case_en = '''
A monk asked Daguang, "Changqing said, 'Giving thanks at a ritual meal.' What did he mean by that?"

Daguang danced.

The monk bowed.

Daguang said, "What did you see that made you bow?"

The monk danced.

Daguang said, "You wild fox spirit."
'''

verse_zh = '''
前箭猶輕後箭深，
誰云黃葉是黃金。
曹溪波浪如相似，
無限平人被陸沈。

'''
verse_en = '''
The first arrow grazed. The second drove deep.
Who called yellow leaves real gold?
If the waves of Caoxi look alike,
countless people will go under on dry land.
'''

pointer = '''
Daguang and Changqing are teachers from the late Tang, and the monk drags up Changqing's line about "giving thanks at a ritual meal" from the exchange about Jinniu's rice bucket in case 74 and asks what it really means. Daguang skips the explanation and just dances, live action, no words. The monk bows like he gets it, so Daguang asks what he saw that made him bow, and the monk copies the move, dancing too. Daguang nails him: "wild fox spirit," a trickster from folklore and a Chan insult for a faker. The verse's "yellow leaves for gold" is the stock image of telling a crying child that leaves are coins to quiet him, a useful lie mistaken for the real thing, and "Caoxi" is the seat of Huineng, the great sixth ancestor: even at the source you can drown on dry land by aping the dance.
'''
