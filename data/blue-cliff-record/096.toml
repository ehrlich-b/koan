verse_zh = '''
泥佛不渡水，
神光照天地。
立雪如未休，
何人不雕偽。
金佛不渡罏，
人來訪紫胡。
牌中數箇字，
清風何處無。
木佛不渡火，
常思破竈墮。
杖子忽擊著，
方知辜負我。

'''
verse_en = '''
A clay Buddha can't cross water.
Shenguang shines through heaven and earth.
If the standing in the snow never ends,
who could help putting on a show?

A gold Buddha can't cross a furnace.
People come to visit Zihu.
A few words on a signboard.
Where does the cool breeze fail to blow?

A wooden Buddha can't cross fire.
I keep thinking of the Stove-Breaker.
The staff comes down with a sudden crack.
Only then do you know how you've let me down.
'''

pointer = '''
Zhaozhou is the old master behind the most famous koan of all (the dog, Gateless Gate 1), and "turning words" are short phrases built to flip your head around and snap you out of stuck thinking. He hands his students three, terse to the point of riddle: a clay Buddha cannot cross water, a gold Buddha cannot cross a furnace, a wood Buddha cannot cross fire. The hook is that each image of "Buddha" comes up against exactly what undoes it: the clay dissolves in the river, the gold melts in the smelter, the wood burns in the fire. Xuedou's verse hangs each line on an old story: Huike, called Shenguang in the verse, standing in the snow and cutting off his own arm to prove he meant it, a teacher named Zihu who posted a blunt warning at his gate, and the Stove-Breaker, who broke a stove the villagers worshipped and freed its spirit. Three times the same setup, three idols knocked over. So if every Buddha you can name is the kind that won't survive the crossing, what is it that does?
'''
