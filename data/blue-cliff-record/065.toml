title_zh = ""
title_en = "The Non-Buddhist Questions the Buddha"

intro_zh = '''
無相而形，充十虛而方廣；無心而應，遍剎海而不煩。舉一明三，目機銖兩，直得棒如雨點、喝似雷奔，也未當得向上人行履在。且道：作麼生是向上人事？試舉。

'''
intro_en = '''
Without form it takes shape, filling all the space in the ten directions. Without deliberation it responds, reaching across an ocean of worlds without strain. Shown one corner, such a person sees three, weighing each move to the last grain at a glance. Even with blows falling like rain and shouts rolling like thunder, you still haven't seen how someone who has gone beyond it all conducts themselves. Tell me: what would such a person do? Take a look.
'''

case_zh = '''
外道問佛：「不問有言，不問無言。」世尊良久，外道讚歎云：「世尊大慈大悲，開我迷雲，令我得入。」外道去後，阿難問佛：「外道有何所證，而言得入？」佛云：「如世良馬，見鞭影而行。」

'''
case_en = '''
A non-Buddhist asked the Buddha, "I ask for no answer in words and no answer without words."

The Buddha stayed silent for a long while.

The visitor praised him: "Your great kindness and compassion have parted my clouds of confusion and let me in."

After he left, Ananda asked, "What did the visitor realize that made him say he got in?"

The Buddha said, "A fine horse moves at the sight of the whip's shadow."
'''

verse_zh = '''
機輪曾未轉，
轉必兩頭走。
明鏡忽臨臺，
當下分妍醜。
妍醜分兮迷雲開，
慈門何處生塵埃。
因思良馬窺鞭影，
千里追風喚得回。
喚得回，鳴指三下。

'''
verse_en = '''
The pivot wheel has yet to turn.
Once it turns, it is bound to run to one side or the other.
Suddenly a bright mirror is set on its stand,
and splits the lovely from the ugly in an instant.
Lovely and ugly part, and the clouds of confusion lift.
Where could dust gather at the gate of compassion?
Think of the fine horse catching sight of the whip's shadow:
a thousand miles chasing the wind, and one call brings it back.
Brings it back. He snaps his fingers three times.
'''

pointer = '''
The "non-Buddhist" here is just an outsider, someone who follows another teaching. He sets a tidy trap: don't answer in words, don't answer in silence. Both doors are now nailed shut. The Buddha takes neither; he simply sits there, present and unbothered, and the man somehow gets it and leaves satisfied. Ananda, the Buddha's longtime attendant, is baffled, because the visitor walked off with nothing you could name, so what did he actually get? The Buddha supplies the punchline: a truly fine horse doesn't need the whip to land, the shadow of it is enough. So the case hands you the same shadow and asks how fast you move.
'''
