title_zh = ""
title_en = "The Buddha Takes His Seat"

intro_zh = '''
動絃別曲，千載難逢；見兔放鷹，一時取俊。總一切語言為一句，攝大千沙界為一塵，同死同生，七穿八穴。還有證據者麼？試舉看。

'''
intro_en = '''
Pluck a string and someone knows the tune: a person like that comes along once in a thousand years. See the hare and loose the hawk: take the fine quarry on the spot. Gather all speech into one phrase and worlds as numerous as grains of sand into a speck of dust. Die together, live together, break through seven holes and eight openings. Is there anyone who can vouch for it? Take a look.
'''

case_zh = '''
世尊一日陞座，文殊白槌云：「諦觀法王法，法王法如是。」世尊便下座。

'''
case_en = '''
One day the Buddha took the teaching seat. Manjushri struck the gavel and announced, "Look closely at the Dharma King's teaching. The Dharma King's teaching is just this." The Buddha stepped down at once.
'''

verse_zh = '''
列聖叢中作者知，
法王法令不如斯。
會中若有仙陀客，
何必文殊下一槌。

'''
verse_en = '''
In that company of sages, an adept would know:
the Dharma King's teaching is nothing like this.
Had a guest who knew saindhava been in the assembly,
why would Manjushri have needed to strike the gavel?
'''

pointer = '''
The Buddha climbs up to deliver a sermon. Manjushri, the bodhisattva who stands for wisdom in these stories, bangs the gavel to call the hall to order and announces, in effect, here is the teaching, look at this. And the Buddha steps down without a word. That is the entire case. This echoes Vimalakirti's wordless answer a few cases back (84). The verse needles Manjushri outright. A guest who knew "saindhava" could tell whether a king meant salt, water, a vessel, or a horse by that one word. With a guest that sharp in the crowd, the verse asks why Manjushri had to strike the gavel at all. So what exactly did the gavel interrupt?
'''
