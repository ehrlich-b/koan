title_en = "Yunmen's Rice and Water"

intro_zh = '''
度越階級，超絕方便，機機相應，句句相投。儻非入大解脫門、得大解脫用，何以權衡佛祖、龜鑑宗乘？且道：當機直截，逆順縱橫，如何道得出身句？試請舉看。

'''
intro_en = '''
Step past the ranks. Go beyond expedient means. Move meets move, line answers line. But if you've never walked through the gate of total freedom and learned to use that freedom, how will you measure the buddhas and ancestors, how will you judge the whole tradition? So tell me: meeting the moment head-on, cutting straight through, going with the grain or against it, free in every direction, what line would get you clear? Let's see.
'''

case_zh = '''
僧問雲門：「如何是塵塵三昧？」門云：「鉢裏飯，桶裏水。」

'''
case_en = '''
A monk asked Yunmen, "What is the samadhi of each and every speck of dust?"
Yunmen said, "Rice in the bowl. Water in the bucket."
'''

verse_zh = '''
鉢裏飯，桶裏水，
多口阿師難下嘴。
北斗南星位不殊，
白浪滔天平地起。
擬不擬，止不止，
箇箇無裩長者子。

'''
verse_en = '''
Rice in the bowl, water in the bucket.
Even the loudmouth teacher can't get a word in.
The Northern Dipper and the southern stars keep their places.
On flat ground, white waves rise to the sky.
You consider it or you don't, you stop or you don't:
every one of us a rich man's son with no pants.
'''

pointer = '''
Yunmen, the tenth-century master whose one-line answers land like a slap, gets a question loaded with gear. "Samadhi" is deep meditative absorption, and "the samadhi of each and every speck of dust" recalls a Buddhist image of all of reality fully present in the tiniest thing. The monk's question sounds like it's reaching for some cosmic state where the infinite shows up in a grain of sand. Yunmen points at lunch instead. Rice in the bowl, water in the bucket. If the whole universe really is in every speck, the dishes could keep you busy for quite a while. The verse twists the knife with a rich man's son from a poem by Hanshan, walking around with no pants. All that money and he still can't turn up dressed for lunch.
'''
