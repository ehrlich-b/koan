number = 60
slug = ""
title_zh = ""
title_en = "Yunmen's Staff Becomes a Dragon"

intro_zh = '''
諸佛眾生本來無異，山河自己寧有等差？為什麼却渾成兩邊去也？若能撥轉話頭，坐斷要津，放過即不可；若不放過，盡大地不消一揑。且作麼生是撥轉話頭處？試舉看。

'''
intro_en = '''
Buddhas and sentient beings have never been different. Could there be any distinction between mountains and rivers and your own self? So why has it all become two sides? If you can flip the question on its head and sit astride the vital crossing, you cannot let a single thing slip by. And if you let nothing slip by, and the whole earth amounts to less than a pinch. How do you flip the question on its head? Take a look.
'''

case_zh = '''
雲門以拄杖示眾云：「拄杖子化為龍，吞却乾坤了也，山河大地甚處得來？」

'''
case_en = '''
Yunmen held up his staff before the assembly and said, "This staff has turned into a dragon and swallowed the whole universe. So where do the mountains, the rivers, the great earth come from?"
'''

verse_zh = '''
拄杖子吞乾坤，
徒說桃花浪奔。
燒尾者不在拏雲攫霧，
曝腮者何必喪膽亡魂。
拈了也，
聞不聞？
直須灑灑落落，
休更紛紛紜紜。
七十二棒且輕恕，
一百五十難放君。
師驀拈拄杖下座，大眾一時走散。

'''
verse_en = '''
The staff swallows heaven and earth.
No use babbling about the surging peach-blossom flood.
A burning tail has nothing to do with grabbing at clouds and mist.
If you're left with your gills drying in the sun, why lose your nerve, why lose your soul?
I've held it up now.
Do you hear it?
Be completely at ease.
Enough of all this fuss and confusion.
Seventy-two blows I'll let you off for now.
A hundred and fifty, and I won't let you off so easily.
The master suddenly picked up his staff and stepped down from his seat. The whole assembly scattered at once.
'''

pointer = '''
Yunmen, the fierce tenth-century master of one-line gut-punches, is holding up the staff a teacher always carries, the ordinary prop he reaches for to make a point. His trick: the stick just became a dragon and ate the entire cosmos, so where did all the scenery you're still looking at come from? Either answer is a trap. If everything got swallowed, the question can't be answered; if it didn't, his claim was a lie. The "burning tail" in the verse comes from the legend that a carp leaping the Dragon Gate gets its tail scorched and turns into a dragon, while the one who fails is left with its gills drying in the sun. The threatened beatings are imaginary, the kind of stick-talk these teachers love, and Xuedou ends the verse by grabbing his staff and stepping down, sending the whole assembly running.
'''
