case_zh = '''
梁武帝請傅大士講金剛經。大士便於座上揮案一下，便下座。武帝愕然。誌公問：「陛下還會麼？」帝云：「不會。」誌公云：「大士講經竟。」

'''
case_en = '''
Emperor Wu of Liang asked Fu Dashi to expound the Diamond Sutra. From the teaching seat, Fu Dashi struck the desk once and stepped down. The emperor was stunned. Zhigong asked him, "Did you get it, Your Majesty?"

The emperor said, "No."

Zhigong said, "Fu Dashi has finished expounding the sutra."
'''

verse_zh = '''
不向雙林寄此身，
却於梁土惹埃塵。
當時不得誌公老，
也是栖栖去國人。

'''
verse_en = '''
He could have stayed at Twin Forests,
but came to Liang and kicked up dust.
Had old Zhigong been absent that day,
he too would have left the capital in dismay.
'''

pointer = '''
Emperor Wu of Liang was a devout Buddhist ruler who loved having famous teachers lecture him, the same emperor Bodhidharma stonewalls back in case 1. Fu Dashi was a celebrated lay master, and Twin Forests is where he lived. The Diamond Sutra hammers on one theme: grasping at words and forms misses the point. So when Fu is asked to expound it, he raps the desk once and steps down from the teaching seat, and that thump is the entire sermon. The emperor doesn't catch it; Zhigong, standing by, has to announce that the lecture is already over. The verse ribs Fu a little, that by coming to court to perform a no-teaching he muddied his own hands, and only Zhigong's quick save kept him from looking like a fraud who got run out of town.
'''
