title_zh = ""
title_en = "Nanquan Draws a Circle"

intro_zh = '''
無啗啄處，祖師心印，狀似鐵牛之機，透荊棘林。衲僧家如紅爐上一點雪，平地上七穿八穴則且止。不落寅緣，又作麼生？試舉看。

'''
intro_en = '''
Nothing to bite down on, no place to peck. The ancestors' seal of mind works like an iron ox. It cuts clean through the thicket of thorns. A monk is like one snowflake on a red-hot furnace. Set aside punching seven or eight holes in level ground. What happens when you don't get caught in conditions? Take a look.
'''

case_zh = '''
南泉、歸宗、麻谷同去禮拜忠國師。至中路，南泉於地上畫一圓相云：「道得即去。」歸宗於圓相中坐，麻谷便作女人拜。泉云：「恁麼則不去也。」歸宗云：「是什麼心行？」

'''
case_en = '''
Nanquan, Guizong, and Magu set out together to pay their respects to National Teacher Zhong. Halfway there, Nanquan drew a circle on the ground and said, "Say the right word and we go on."

Guizong sat down inside the circle. Magu bowed as a woman would.

Nanquan said, "In that case, we don't go."

Guizong said, "What kind of thinking is that?"
'''

verse_zh = '''
由基箭射猿，
遶樹何太直。
千箇與萬箇，
是誰曾中的？
相呼相喚歸去來，
曹溪路上休登陟。

'''
verse_en = '''
Yang Youji shoots an ape with his arrow.
Around the tree, yet how straight!
A thousand archers, ten thousand archers,
which of them ever hit the mark?
Calling back and forth: come on, let's head home.
Quit climbing the road to Caoxi.
'''

pointer = '''
Three monks are walking to visit National Teacher Zhong (the famous teacher from case 18) when one of them, Nanquan, scratches a circle in the dirt and makes it a test: speak the right word and we go on. Guizong sits down inside the circle and Magu bows as a woman would, each answering with a move rather than a statement. Nanquan flips it again: in that case we don't go. Guizong's closing "what kind of thinking is that?" reads as a player naming the next play, not as bewilderment. The verse name-drops Yang Youji, the Spring-and-Autumn archer of legend who could pierce a willow leaf at a hundred paces. Here his shot goes straight even as it goes around a tree. Caoxi is the home ground of Zen, where the Sixth Patriarch taught.
'''
