title_zh = ""
title_en = "The Mussel and the Moon"

intro_zh = '''
聲前一句，千聖不傳；面前一絲，長時無間。淨裸裸，赤灑灑，頭鬔鬆，耳卓朔。且道作麼生？試舉看。

'''
intro_en = '''
The one line before sound: a thousand sages never handed it down. The single thread right in front of you never breaks. Naked and bare, hair tousled, ears pricked. So tell me, what is it? Take a look.
'''

case_zh = '''
僧問智門：「如何是般若體？」門云：「蚌含明月。」僧云：「如何是般若用？」門云：「兔子懷胎。」

'''
case_en = '''
A monk asked Zhimen, "What is the body of prajna?"
Zhimen said, "The mussel holds the bright moon."
The monk asked, "What is the function of prajna?"
Zhimen said, "The rabbit is carrying young."
'''

verse_zh = '''
一片虛凝絕謂情，
人天從此見空生。
蚌含玄兔深深意，
曾與禪家作戰爭。

'''
verse_en = '''
A stretch of still emptiness, beyond words and thought.
From here, humans and gods see Subhuti.
The mussel holds the dark hare: the meaning runs deep,
and it has set Chan practitioners at odds.
'''

pointer = '''
Zhimen is a Chan teacher, in fact Xuedou's own master, and "prajna" is the Buddhist word for the deep wisdom that sees straight through to how things actually are. The monk asks two textbook questions, what prajna is, its body, and what it does, its function, plainly hoping for a clean pair of definitions. Zhimen answers with two images from old Chinese folklore: mussels were thought to grow their pearls by swallowing moonlight, and a hare was said to conceive merely by gazing at the moon. The answers refuse to be the tidy definitions the monk wanted. The verse names Subhuti, the Buddha's disciple known for his insight into emptiness, and notes that these slippery lines have kept Zen students arguing for ages. You asked what wisdom is and got a pregnant rabbit. Where does that leave the question?
'''
