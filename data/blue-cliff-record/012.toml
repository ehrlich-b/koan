title_zh = ""
title_en = "Dongshan's Three Pounds of Flax"

intro_zh = '''
殺人刀，活人劍，乃上古之風規，亦今時之樞要。若論殺也，不傷一毫；若論活也，喪身失命。所以道：向上一路，千聖不傳。學者勞形，如猿捉影。且道：既是不傳，為什麼却有許多葛藤公案？具眼者試說看。

'''
intro_en = '''
The killing sword, the life-giving sword: the old masters' way, and the hinge of things still. As a killing blade it doesn't nick a single hair. As a life-giver it costs you skin and life. So they say: the road up and beyond, not one of the thousand sages ever handed down. Students wear themselves out chasing it, like a monkey grabbing at a reflection. Tell me, if it's never handed down, why are there so many tangled old cases? Anyone with eyes, give it a try.
'''

case_zh = '''
僧問洞山：「如何是佛？」山云：「麻三斤。」

'''
case_en = '''
A monk asked Dongshan, "What is Buddha?"

Dongshan said, "Three pounds of flax."
'''

verse_zh = '''
金烏急，
玉兔速，
善應何曾有輕觸。
展事投機見洞山，
跛鱉盲龜入空谷。
花簇簇，錦簇簇，
南地竹兮北地木。
因思長慶陸大夫，
解道合笑不合哭。
咦！

'''
verse_en = '''
The golden crow streaks past,
the jade hare bolts.
When has a deft answer ever landed clumsy?
See Dongshan in how he sets out the matter and meets the moment.
A lame softshell and a blind turtle hobble into an empty valley.
Flowers in clusters, brocade in clusters.
Bamboo in the south, trees in the north.
Which brings to mind Changqing and Official Lu:
Changqing knew to say, "He should have laughed. He shouldn't have cried."
Ha!
'''

pointer = '''
"What is Buddha" is the oldest setup in the collection, a monk angling for some grand statement about ultimate reality. One old guess puts Dongshan in the storeroom weighing three pounds of flax, the raw fiber you would spin into cloth. The case doesn't say where he was. The pull is to decode it, to ask why flax, why three, what symbol is buried inside. Start excavating the answer for a secret and you might walk straight into the empty valley the verse describes, a blind turtle hobbling nowhere. Xuedou name-drops Changqing and old Mr. Lu, who laughed at his teacher Nanquan's funeral before breaking into tears. Changqing said he should have laughed and left it at that. It pairs with Yunmen's cake at case 77, another answer you could put on a plate.
'''
