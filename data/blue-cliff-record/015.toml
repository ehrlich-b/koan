number = 15
slug = ""
title_zh = ""
title_en = "Yunmen Turns the Saying Around"

intro_zh = '''
殺人刀，活人劍，乃上古之風規，是今時之樞要。且道：如今那箇是殺人刀、活人劍？試舉看。

'''
intro_en = '''
The sword that kills, the sword that gives life: that was the way of the old masters, and it's still what everything turns on today. So tell me, right now, what are the blade that kills and the sword that gives life? Let's look.
'''

case_zh = '''
僧問雲門：「不是目前機，亦非目前事時如何？」門云：「倒一說。」

'''
case_en = '''
A monk asked Yunmen, "What about when it's neither the move before your eyes nor the matter before your eyes?"

Yunmen said, "One statement turned around."
'''

verse_zh = '''
倒一說，
分一節。
同死同生為君訣。
八萬四千非鳳毛，
三十三人入虎穴。
別，別！
擾擾怱怱水裏月。

'''
verse_en = '''
One statement turned around,
one joint split apart.
Die together, live together: that's the watchword for you.
Of eighty-four thousand, none has a phoenix feather.
Thirty-three people enter the tiger's den.
Something else, something else!
The moon in churning, racing water.
'''

pointer = '''
Yunmen Wenyan (864–949) was the Five Dynasties master famous for single words that knock a questioner sideways, and you just met one of his short answers in the case before this. Here the monk tries to be subtle: he asks about what lies beyond "the move before your eyes" and "the matter before your eyes," angling for a grand word about the absolute, the deep stuff that is not mere everyday experience. Yunmen flips the previous case's answer over with one stroke, changing "One statement in reply" to "One statement turned around." The verse runs with it, masters leading students to live and die together, and lands on the moon shaking in churning water: a view you could get without going anywhere special. Check where you put the "beyond," and whether the search itself is the inversion.
'''
