title_zh = ""
title_en = "Danxia's \"Eaten Yet?\""

intro_zh = '''
細如米末，冷似氷霜，畐塞乾坤，離明絕暗。低低處觀之有餘，高高處平之不足。把住放行，總在這裏許，還有出身處也無？試舉看。

'''
intro_en = '''
Fine as powdered rice. Cold as ice and frost. It fills heaven and earth, beyond all light, beyond all dark. Look for it down low and there's more than enough. Try to level it up high and it falls short. Holding fast and letting go both happen right here. Is there a way out? Let's see.
'''

case_zh = '''
丹霞問僧：「甚處來？」僧云：「山下來。」霞云：「喫飯了也未？」僧云：「喫飯了。」霞云：「將飯來與汝喫底人，還具眼麼？」僧無語。長慶問保福：「將飯與人喫，報恩有分，為什麼不具眼？」福云：「施者受者，二俱瞎漢。」長慶云：「盡其機來，還成瞎否？」福云：「道我瞎得麼？」

'''
case_en = '''
Danxia asked a monk, "Where have you come from?"

The monk said, "From down the mountain."

Danxia said, "Eaten yet?"

The monk said, "I've eaten."

Danxia said, "The one who brought you your rice, did he have eyes?" The monk had nothing to say.

Later Changqing asked Baofu, "Someone who offers food is doing their part to repay a kindness. So why wouldn't they have eyes?"

Baofu said, "Giver and receiver, both blind."

Changqing said, "Even if they give it everything they've got, are they still blind?"

Baofu said, "You going to call me blind?"
'''

verse_zh = '''
盡機不成瞎，
按牛頭喫草。
四七二三諸祖師，
寶器持來成過咎。
過咎深，
無處尋，
天上人間同陸沈。

'''
verse_en = '''
Giving it everything still doesn't make you blind.
He presses the ox's head down to make it eat grass.
Four times seven and two times three, all those patriarchs
brought the precious vessel and made it into a fault.
The fault runs deep.
There's nowhere to find it.
Heaven and the human world sink together on dry land.
'''

pointer = '''
Danxia is the Tang master notorious for burning a wooden Buddha to keep warm, so he is not sentimental about anything. He runs the ordinary greeting on a traveling monk, where you from, eaten yet, then drops the hook: the person who fed you, does he have eyes? In Chan, "eyes" means real seeing and "blind" means going through the motions with the lights off, so the whole homey exchange was a test, and the monk who answers it as small talk has already walked into the pit. He freezes, which is the case. Then Changqing and Baofu kick it around, and Baofu's "giver and receiver, both blind" is the live wire. When pushed, Baofu spins the trap back: so I'm the blind one now? The verse goes further, saying even the revered ancestors, twenty-eight in India and six in China, carrying the priceless teaching like a sacred bowl just turned it into one more thing to stumble over. So where, in all this feeding, was anyone home?
'''
