number = 39
slug = ""
title_zh = ""
title_en = "Yunmen's Garden Railing"

intro_zh = '''
途中受用底，似虎靠山；世諦流布底，如猿在檻。欲知佛性義，當觀時節因緣；欲煅百鍊精金，須是作家爐韛。且道大用現前底，將什麼試驗？

'''
intro_en = '''
A man at ease on the road is a tiger backed by his mountain. A man caught in the world's affairs is a monkey in a cage. Would you know what buddha-nature means? Watch the season, watch the conditions. Would you smelt pure gold, hammered a hundred times? Then you need a master's furnace and bellows. Now tell me: when the great function stands before you in full, what will you use to test it?
'''

case_zh = '''
僧問雲門：「如何是清淨法身？」門云：「花藥欄。」僧云：「便恁麼去時如何？」門云：「金毛獅子。」

'''
case_en = '''
A monk asked Yunmen, "What is the pure Dharma body?"
Yunmen said, "The railing around the flower bed."
The monk said, "And what if I go on just like that?"
Yunmen said, "A golden-haired lion."
'''

verse_zh = '''
花藥欄，
莫顢頇。
星在秤兮不在盤，
便恁麼，
太無端，
金毛獅子大家看。

'''
verse_en = '''
The railing around the flower bed.
Don't blur it, don't fudge it.
The marks are on the beam of the scale. The pan has none.
Go on just like that,
how rash!
A golden-haired lion. Everyone, take a look.
'''

pointer = '''
Yunmen, the famously sharp tenth-century master, gets handed the dharmakaya, "the pure Dharma body," the grandest Buddhist abstraction going: reality itself, beyond every form, the kind of phrase that fogs a student's eyes. He answers with the railing around a flower bed. There it is, nothing special, in front of you. The monk presses, fine, but what if I go on just like that, and Yunmen names a golden-haired lion. That's some distance from a house cat reciting lines. Yunmen has given the monk a railing to grab when he wanted a handle on "pure truth," the kind of handle Bodhidharma refuses the emperor in case 1.
'''
