title_zh = ""
title_en = "Xuansha's Three Visitors"

intro_zh = '''
門庭施設，且恁麼破二作三；入理深談，也須是七穿八穴。當機敲點，擊碎金鎖玄關；據令而行，直得掃蹤滅跡。且道：誵訛在什麼處？具頂門眼者，請試舉看。

'''
intro_en = '''
When you set up a school's teaching, you can make two into three. If you go deep into the principle, you still have to break through seven holes and eight openings. Strike at the moment that calls for it and smash the golden lock on the hidden gate. Carry out the command and sweep away every trace. Tell me: where's the snag? If you have an eye at the crown of your head, take a look.
'''

case_zh = '''
玄沙示眾云：「諸方老宿盡道接物利生，忽遇三種病人來，作麼生接？患盲者，拈鎚竪拂，他又不見；患聾者，語言三昧，他又不聞；患啞者，教伊說，又說不得。且作麼生接？若接此人不得，佛法無靈驗。」僧請益雲門，雲門云：「汝禮拜著。」僧禮拜起，雲門以拄杖挃，僧退後。門云：「汝不是患盲。」復喚：「近前來。」僧近前。門云：「汝不是患聾。」門乃云：「還會麼？」僧云：「不會。」門云：「汝不是患啞。」僧於此有省。

'''
case_en = '''
Xuansha addressed the assembly: "The old teachers everywhere say they welcome people and work for the good of all beings. If three kinds of people came to you, how would you receive them? Raise a mallet or a whisk, and the blind person can't see it. Speak with all the skill you have, and the deaf person can't hear it. Ask the person who can't speak to say something, and they can't say it. How will you receive them? If you can't receive these people, then the Buddha's teaching has no effect."

A monk asked Yunmen about this. Yunmen said, "Bow." The monk bowed and stood up. Yunmen jabbed at him with his staff, and the monk stepped back. Yunmen said, "So you're not blind." Then he called him: "Come closer." The monk came closer. Yunmen said, "So you're not deaf." Then Yunmen said, "Got it?" The monk said, "No." Yunmen said, "So you're not mute." At this the monk had an opening.
'''

verse_zh = '''
盲聾瘖啞，
杳絕機宜。
天上天下，
堪笑堪悲。
離婁不辨正色，
師曠豈識玄絲。
爭如獨坐虛窓下，
葉落花開自有時。

'''
verse_en = '''
Blind, deaf, mute,
utterly beyond any move that might reach them.
Heaven above, earth below:
something to laugh at, something to mourn.
Li Lou could not tell the true colors apart.
How would Music Master Kuang know the hidden string?
Better to sit alone at an empty window:
leaves fall, flowers open, each in its own time.
'''

pointer = '''
Xuansha was a Tang master and Yunmen lived 864–949 into the Five Dynasties; "taking in beings" is teacher-talk for waking students up. A teacher normally reaches you through what you can see, by holding up a mallet or a whisk, what you can hear, with a sharp word, or what you can say, in a back-and-forth. So Xuansha sets the trap: what about three people, one who can't see, one who can't hear, and one who can't speak? Yunmen's reply makes the monk step back, come closer, and answer before he can think. In the verse, Li Lou with legendary eyes and Music Master Kuang with a legendary ear are the ancient gold standards, and even they come up short, which is the joke.
'''
