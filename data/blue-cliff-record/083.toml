pointer = '''
Yunmen (864–949, Five Dynasties) liked one-liners that go off like charges, and here he plants one. A "bare pillar" is just a wooden post holding up the hall, the deadest, most ordinary object he can point at, so when he says an "ancient buddha," the most exalted thing imaginable, is intimate with a plain pillar, he is deliberately welding the highest to the lowest and daring you to rank it: which level of attainment is that? Then he answers his own question with weather, clouds rising over one mountain, rain falling on another. In the verse the "four times seven and two times three" are the legendary ancestors, twenty-eight in India and six in China, gazing at each other across the centuries, and Silla was a Korean kingdom, while Tang was the dynasty ruling China. The closing line flips a pious cliche, since monks are supposed to treat gold like dirt, by teasing that maybe you have the worth of things exactly backwards. So go ahead and grade it.
'''
