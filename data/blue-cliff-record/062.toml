number = 62
slug = ""
title_zh = ""
title_en = "Yunmen's Hidden Treasure"

intro_zh = '''
以無師智，發無作妙用；以無緣慈，作不請勝友。向一句下，有殺有活；於一機中，有縱有擒。且道：什麼人曾恁麼來？試舉看。

'''
intro_en = '''
With wisdom learned from no teacher, he brings forth a wondrous activity that takes no contriving. With compassion that depends on nothing, he turns up as the best friend you never called for. In a single phrase there's killing and bringing to life. In a single move there's letting go and taking hold. Tell me: who has ever come this way? Take a look.
'''

case_zh = '''
雲門示眾云：「乾坤之內，宇宙之間，中有一寶，祕在形山。拈燈籠向佛殿裏，將三門來燈籠上。」

'''
case_en = '''
Yunmen spoke to the assembly: "Within heaven and earth, in the midst of the universe, there is one treasure, hidden in the mountain of the body. Take a lantern, carry it into the Buddha hall, and bring the monastery gate. Set it on the lantern."
'''

verse_zh = '''
看看，
古岸何人把釣竿？
雲冉冉，
水漫漫，
明月蘆花君自看。

'''
verse_en = '''
Look. Look.
On the old bank, who holds the fishing rod?
Clouds drift on,
water runs wide.
Bright moon, reed flowers: see for yourself.
'''

pointer = '''
Yunmen, the blunt tenth-century master, is teaching the monks and starts by quoting an old line: a treasure hidden in the mountain of the body, the idea that what you're hunting for is already inside you rather than out there to be found. Then he goes haywire on purpose. Grab the lantern, carry it into the Buddha hall, and stick the giant temple gate on top of it. That's nonsense by design. The bait is to treat it as a riddle with a buried answer. The verse doesn't decode anything either. It puts a fishing rod in your hands on an empty bank and tells you to look at the moon and the reeds yourself.
'''
