title_zh = ""
title_en = "Magu Shakes His Staff"

intro_zh = '''
動則影現，覺則氷生。其或不動不覺，不免入野狐窟裏。透得徹，信得及，無絲毫障翳，如龍得水，似虎靠山。放行也瓦礫生光，把定也真金失色。古人公案，未免周遮，且道評論什麼邊事？試舉看。

'''
intro_en = '''
Move, and a shadow falls. Notice it, and ice forms. Stay still and notice nothing, and you drop straight into a wild fox's den. See clear through, trust all the way, not a speck blocking the view, and you are a dragon reaching water, a tiger backed against its mountain. Let go, and broken tiles catch the light. Hold fast, and pure gold loses its shine. Even the old masters' cases get tangled up in talk. So tell me, what are we judging here? Here is a case. Look.
'''

case_zh = '''
麻谷持錫到章敬，遶禪床三匝，振錫一下，卓然而立。敬云：「是，是。」雪竇著語云：「錯。」麻谷又到南泉，遶禪床三匝，振錫一下，卓然而立。泉云：「不是，不是。」雪竇著語云：「錯。」麻谷富時云：「章敬道是，和尚為什麼道不是？」泉云：「章敬即是，是汝不是。此是風力所轉，終成敗壞。」

'''
case_en = '''
Magu came to Zhangjing carrying his ringed staff. He circled the meditation seat three times, gave the staff one shake, and stood there straight.

Zhangjing said, "Right, right."

(Xuedou comments: "Wrong.")

Then Magu went to Nanquan. He circled the meditation seat three times, gave the staff one shake, and stood there straight.

Nanquan said, "Not right, not right."

(Xuedou comments: "Wrong.")

Magu said, "Zhangjing said it was right. Why do you say it isn't?"

Nanquan said, "Zhangjing is right. You're the one who's wrong. It's the force of the wind blowing you about. In the end it all falls apart."
'''

verse_zh = '''
此錯彼錯，
切忌拈却。
四海浪平，
百川潮落。
古策風高十二門，
門門有路空蕭索。
非蕭索，
作者好求無病藥。

'''
verse_en = '''
This one wrong, that one wrong:
take care not to remove them.
The four seas lie flat and calm,
a hundred rivers ebb with the tide.
The old staff, a high wind at the twelve gates.
Every gate has a road, empty and desolate.
And yet desolate won't do.
An adept may well look for medicine where there's no illness.
'''

pointer = '''
Magu, Zhangjing, and Nanquan are all Tang teachers. A monk's traveling staff had metal rings that rattled, and circling a master's seat three times was a gesture of respect. Give the staff a shake and stand there straight, as Magu does, and you might also be saying "I've got it, check me." Magu runs the identical performance at two teachers and draws opposite verdicts, "right" from one, "wrong" from the other, which is bait for the obvious question: which teacher graded it correctly? Notice that Xuedou, the collector, comments "wrong" on both, refusing the scoreboard entirely. Nanquan's jab is that it was only the wind blowing him around. Wind was one of the four elements and accounted for the body's movements, all the way down to a hand giving a staff a shake. A whose-stamp-is-valid argument is chasing the wrong thing.
'''
