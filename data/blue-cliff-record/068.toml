title_zh = ""
title_en = "What's Your Name?"

intro_zh = '''
掀天關，翻地軸，擒虎兕，辨龍蛇。須是箇活鱍鱍漢，始得句句相投、機機相應。且：從上來什麼人合恁麼？請舉看。

'''
intro_en = '''
Tip the sky off its hinge, flip the earth off its axle. Catch tigers and wild buffalo, tell dragons from snakes. It takes a live wire for every phrase to meet its match and each move to answer the next. So tell me, who down the ages has ever pulled it off? Take a look.
'''

case_zh = '''
仰山問三聖：「汝名什麼？」聖云：「惠寂。」仰山云：「惠寂是我。」聖云：「我名惠然。」仰山呵呵大笑。

'''
case_en = '''
Yangshan asked Sansheng, "What's your name?"
Sansheng said, "Huiji."
Yangshan said, "I'm Huiji."
Sansheng said, "My name is Huiran."
Yangshan roared with laughter.
'''

verse_zh = '''
雙收雙放若為宗，
騎虎由來要絕功。
笑罷不知何處去，
只應千古動悲風。

'''
verse_en = '''
Taking hold of both and letting go of both: what does that amount to as a teaching?
Riding a tiger has always taken consummate skill.
The laughter ends. Where has he gone?
For a thousand years, the mournful wind still stirs.
'''

pointer = '''
Two famous teachers feeling each other out. Yangshan asks Sansheng's name. Sansheng answers "Huiji," which happens to be Yangshan's own name, not his. It's a feint: claim the other man's ground and see if he flinches. Yangshan calmly takes it back ("Huiji is me"), and Sansheng just as calmly gives his real name, Huiran. Nobody got rattled, nobody got stuck, two pros passing the lead back and forth so cleanly that all Yangshan can do is laugh. The verse comes back to that motion, taking hold and letting go. Each one grabs the offensive, then drops it, and nothing snags on the way.
'''
